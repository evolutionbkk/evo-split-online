<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>คอนโซลหัวหน้าทีม — Evo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap">
<style>
  :root{
    --bg:#eef2f8;--surface:#ffffff;--surface-2:#f7f9fc;--ink:#0f172a;--muted:#64748b;--line:#e6ecf3;
    --brand:#2563eb;--brand-deep:#1e3a8a;--violet:#7c3aed;--cyan:#0e7490;
    --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--w:#2563eb;--k:#4f46e5;
    --side:#0f172a;--side-ink:#cbd5e1;--side-mut:#64748b;--side-line:#1e293b;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(30,41,59,.06);--shadow-lg:0 12px 40px rgba(15,23,42,.18);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0b1220;--surface:#131c2e;--surface-2:#0f1829;--ink:#e6ecf5;--muted:#93a3bb;--line:#243247;
    --side:#080d18;--side-line:#1a2436;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 12px 40px rgba(0,0,0,.5);
  }}
  :root[data-theme="dark"]{
    --bg:#0b1220;--surface:#131c2e;--surface-2:#0f1829;--ink:#e6ecf5;--muted:#93a3bb;--line:#243247;
    --side:#080d18;--side-line:#1a2436;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 12px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}.tnum{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  .app{display:flex;min-height:100vh}
  .side{width:232px;flex:0 0 auto;background:var(--side);color:var(--side-ink);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{color:#fff;font-weight:800;font-size:14px;padding:6px 10px 12px;border-bottom:1px solid var(--side-line);margin-bottom:6px;line-height:1.3}
  .brand small{display:block;color:var(--side-mut);font-weight:600;font-size:11px;margin-top:3px}
  .navlab{font-size:10px;font-weight:800;color:var(--side-mut);letter-spacing:.6px;padding:11px 10px 4px;text-transform:uppercase}
  .nav-i{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;font-size:13px;font-weight:700;color:var(--side-ink);background:transparent;border:0;width:100%;text-align:left}
  .nav-i:hover{background:rgba(255,255,255,.06);color:#fff}.nav-i.on{background:var(--brand);color:#fff}
  .nav-i .ic{width:17px;text-align:center;flex:0 0 auto}
  .nav-i .badge{margin-left:auto;background:#db2777;color:#fff;font-size:11px;border-radius:8px;padding:1px 7px;font-weight:800}
  .nav-i.sub{padding-left:32px;font-size:12.5px;color:var(--side-mut);font-weight:600}
  .nav-i.sub.on{color:#fff;background:rgba(37,99,235,.25)}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px 22px;display:flex;align-items:center;gap:14px}
  .topbar h2{margin:0;font-size:16px;font-weight:800}.spacer{flex:1}
  .menuBtn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;font-size:16px;color:var(--ink)}
  .iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;font-size:16px;color:var(--ink)}
  .lo{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:700;font-size:13px;color:var(--ink);text-decoration:none}
  .content{padding:22px;max-width:1240px;width:100%;margin:0 auto}
  .secttl{font-size:15px;font-weight:800;margin:6px 2px 12px;display:flex;align-items:center;gap:9px}
  .secttl .ln{flex:1;height:1px;background:var(--line)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;border-radius:999px;padding:5px 11px;white-space:nowrap}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:11px 14px;margin-bottom:18px}
  .fg{display:flex;align-items:center;gap:5px}.fg .lb{font-size:11px;color:var(--muted);font-weight:800}
  .chip{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--ink)}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .fbar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  .tcard{overflow:hidden}
  .tcard .hd{padding:13px 16px;color:#fff;font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:9px}
  .tcard.adm .hd{background:linear-gradient(135deg,#5b21b6,#7c3aed)}
  .tcard.tel .hd{background:linear-gradient(135deg,#1e3a8a,#2563eb)}
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
  .mi{background:var(--surface);padding:14px 15px}
  .mi .n{font-size:22px;font-weight:800;line-height:1}.mi .l{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:4px}
  .todo{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}
  .tt{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:13px;box-shadow:var(--shadow);padding:14px 15px}
  .tt .n{font-size:25px;font-weight:800;line-height:1;color:var(--warn)}.tt .l{font-size:12px;color:var(--muted);font-weight:700;margin-top:5px}
  .tt.red{border-left-color:var(--bad)}.tt.red .n{color:var(--bad)}
  .tt.blue{border-left-color:var(--brand)}.tt.blue .n{color:var(--brand)}
  .tt.green{border-left-color:var(--ok)}.tt.green .n{color:var(--ok)}
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:800;padding:12px 15px;background:var(--surface-2);border-bottom:1px solid var(--line)}
  .tbl th.r,.tbl td.r{text-align:right}
  .tbl td{padding:12px 15px;border-bottom:1px solid var(--line)}
  .tbl tr:last-child td{border-bottom:0}
  .tbl.click tbody tr{cursor:pointer}.tbl.click tbody tr:hover td{background:var(--surface-2)}
  .win{color:var(--ok);font-weight:800}
  .sideb{font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:2px 7px}.sideb.w{background:var(--w)}.sideb.k{background:var(--k)}
  .rd{font-size:11.5px;font-weight:800;color:var(--violet);background:color-mix(in srgb,var(--violet) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--violet) 30%,var(--surface));border-radius:6px;padding:2px 7px}
  .st-new{background:color-mix(in srgb,#3730a3 14%,var(--surface));color:#4f46e5}
  .st-ct{background:color-mix(in srgb,var(--cyan) 14%,var(--surface));color:var(--cyan)}
  .st-int{background:color-mix(in srgb,var(--violet) 14%,var(--surface));color:var(--violet)}
  .st-fu{background:color-mix(in srgb,var(--cyan) 14%,var(--surface));color:#0369a1}
  .st-won{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}
  .st-pay{background:color-mix(in srgb,var(--warn) 15%,var(--surface));color:var(--warn)}
  .st-lost{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
  .btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;font-size:13px;font-family:inherit}
  .btn.p{background:var(--brand);color:#fff}.btn.g{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.5}
  .seg{display:flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;width:fit-content;flex-wrap:wrap}
  .seg button{border:0;background:var(--surface);padding:9px 15px;font-size:13px;font-weight:700;color:var(--muted)}
  .seg button.on{background:var(--brand);color:#fff}
  .inp{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:14px}
  .fld{margin-bottom:14px}.fld label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:7px}
  .poolwrap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:4px}
  .poolcard{border:1px solid var(--line);border-radius:13px;padding:15px 16px;background:var(--surface-2)}
  .poolcard .n{font-size:27px;font-weight:800;line-height:1}.poolcard .l{font-size:12px;color:var(--muted);font-weight:700;margin-top:5px}
  .dor{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}.dor:last-child{border-bottom:0}
  .av{width:42px;height:42px;border-radius:12px;color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .av.W{background:linear-gradient(135deg,#2563eb,#1e3a8a)}.av.K{background:linear-gradient(135deg,#7c3aed,#4c1d95)}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border-bottom:0}.kv .k{color:var(--muted)}.kv .v{font-weight:700;text-align:right}
  .backbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:700;font-size:13px;color:var(--ink);margin-bottom:14px;display:inline-flex;gap:7px;align-items:center}
  .tk-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:15px 18px;margin-bottom:14px}
  .tk-av{width:50px;height:50px;border-radius:13px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-weight:800;font-size:21px;display:flex;align-items:center;justify-content:center}
  .tk-name{font-size:18px;font-weight:800;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.tk-id{font-size:12px;color:var(--muted);margin-top:2px}
  .grid2{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;align-items:start}
  .ev{position:relative;padding:0 0 15px 28px}
  .ev:not(:last-child)::before{content:"";position:absolute;left:11px;top:23px;bottom:0;width:2px;background:var(--line)}
  .ev .eic{position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--surface-2);border:1px solid var(--line)}
  .ev .et{font-size:13px;font-weight:700}.ev .em{font-size:11px;color:var(--muted);margin-top:2px}
  .ev .ex{font-size:12px;color:var(--ink);margin-top:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  .ttag{font-size:12px;font-weight:700;border-radius:999px;padding:4px 11px;border:1px solid var(--line);background:var(--surface-2)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:22px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.22s;z-index:100;box-shadow:var(--shadow-lg)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .note{background:color-mix(in srgb,var(--cyan) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--cyan) 28%,var(--surface));color:#0369a1;border-radius:12px;padding:11px 14px;font-size:12.5px;font-weight:600;line-height:1.6}
  .empty{color:var(--muted);padding:26px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
  @media(max-width:960px){.side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:.25s}.side.open{transform:none}.menuBtn{display:block}.two{grid-template-columns:1fr}.todo{grid-template-columns:repeat(2,1fr)}.poolwrap{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <div class="main">
    <div class="topbar">
      <button class="menuBtn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <h2 id="viewTitle">ภาพรวม</h2><div class="spacer"></div>
      <button class="iconbtn" id="themeBtn" title="สลับธีม" onclick="toggleTheme()">◐</button>
      <a class="lo" href="#" onclick="logout(event)">ออกจากระบบ</a>
    </div>
    <div class="content" id="content"><div class="empty">กำลังโหลด…</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("th-TH");
const fmtB=n=>"฿"+fmt(Math.round(n||0));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1900);}
let ME=null,VIEW="dashboard",PREV="dashboard",RANGE="today",CURKEY=null,TKFILTER="all",D={};

(function(){try{const s=localStorage.getItem("evo-theme");if(s)document.documentElement.setAttribute("data-theme",s);}catch(e){}})();
window.toggleTheme=function(){const el=document.documentElement,cur=el.getAttribute("data-theme");const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;const nx=dark?"light":"dark";el.setAttribute("data-theme",nx);try{localStorage.setItem("evo-theme",nx);}catch(e){}};
window.logout=function(e){e.preventDefault();fetch("/logout",{method:"POST"}).then(()=>location.href="/login");};

/* nav */
const NAV=[
  {k:"dashboard",ic:"📊",t:"ภาพรวม"},
  {lab:"Admin (แชท)"},
  {k:"admin_overview",t:"ภาพรวม Admin",sub:1},
  {lab:"Telesales (โทร)"},
  {k:"tel_overview",t:"ภาพรวม Telesales",sub:1},
  {k:"tel_perf",t:"ผลงาน Telesales",sub:1},
  {lab:"ทั่วไป"},
  {k:"tickets",ic:"🎫",t:"ตั๋วลูกค้า"},
  {k:"stock",ic:"📥",t:"คลังรายชื่อ & แจก"},
  {k:"reports",ic:"📄",t:"รายงาน"},
  {k:"staff",ic:"🧑‍💼",t:"พนักงาน"},
  {k:"settings",ic:"⚙️",t:"ตั้งค่า"},
];
const TITLES={dashboard:"ภาพรวม",admin_overview:"ภาพรวม Admin",tel_overview:"ภาพรวม Telesales",tel_calltoday:"โทรวันนี้",tel_perf:"ผลงาน Telesales",tickets:"ตั๋วลูกค้า",ticket:"ตั๋วลูกค้า",stock:"คลังรายชื่อ & แจก",reports:"รายงาน",staff:"พนักงาน",settings:"ตั้งค่า"};
function renderNav(){
  $("#side").innerHTML=`<div class="brand">EVO E-COMMERCE<small>${esc((ME&&ME.name)||"หัวหน้าทีม")} · Console</small></div>`+
    NAV.map(it=>it.lab?`<div class="navlab">${it.lab}</div>`
      :`<button class="nav-i ${it.sub?"sub":""} ${(VIEW===it.k||(it.k==="tickets"&&VIEW==="ticket"))?"on":""}" onclick="go('${it.k}')">${it.ic?`<span class="ic">${it.ic}</span>`:""}<span>${it.t}</span></button>`).join("");
}
window.go=function(k){VIEW=k;$("#side").classList.remove("open");paint();};

async function getJSON(u){const r=await fetch(u);if(r.status===401){location.href="/login";return null;}if(r.status===403){location.href="/sales";return null;}return r.json().catch(()=>({}));}
async function postJSON(u,b){const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});if(r.status===401){location.href="/login";return null;}return r.json().catch(()=>({}));}

/* range */
let customFrom="",customTo="";
function rangeISO(){
  const TZ=7*3600000,now=Date.now(),th=new Date(now+TZ);
  const y=th.getUTCFullYear(),m=th.getUTCMonth(),d=th.getUTCDate();
  const sT=Date.UTC(y,m,d,0,0,0)-TZ,eT=Date.UTC(y,m,d,23,59,59)-TZ;
  if(RANGE==="yesterday")return{from:new Date(sT-86400000).toISOString(),to:new Date(eT-86400000).toISOString()};
  if(RANGE==="week")return{from:new Date(sT-6*86400000).toISOString(),to:new Date(eT).toISOString()};
  if(RANGE==="month")return{from:new Date(Date.UTC(y,m,1,0,0,0)-TZ).toISOString(),to:new Date(eT).toISOString()};
  if(RANGE==="custom"&&customFrom&&customTo){const f=Date.parse(customFrom+"T00:00:00Z")-TZ,t=Date.parse(customTo+"T23:59:59Z")-TZ;if(!isNaN(f)&&!isNaN(t))return{from:new Date(f).toISOString(),to:new Date(t).toISOString()};}
  return{from:new Date(sT).toISOString(),to:new Date(eT).toISOString()};
}
const RLABEL={today:"วันนี้",yesterday:"เมื่อวาน",week:"สัปดาห์",month:"เดือน",custom:"กำหนดเอง"};
const RORDER=["today","yesterday","week","month","custom"];
function rlab(){return (RANGE==="custom"&&customFrom&&customTo)?`${customFrom} – ${customTo}`:RLABEL[RANGE];}
function filterBar(){
  let h=`<div class="filters"><div class="fg"><span class="lb">ช่วงเวลา</span>`+RORDER.map(r=>`<button class="chip ${RANGE===r?"on":""}" onclick="setRange('${r}')">${RLABEL[r]}</button>`).join("")+`</div>`;
  if(RANGE==="custom")h+=`<div class="fg" style="margin-left:6px"><span class="lb">จาก</span><input type="date" class="inp" id="cFrom" value="${esc(customFrom)}" style="padding:6px 9px;font-size:12.5px"><span class="lb">ถึง</span><input type="date" class="inp" id="cTo" value="${esc(customTo)}" style="padding:6px 9px;font-size:12.5px"><button class="chip on" onclick="applyCustom()">ใช้</button></div>`;
  h+=`<div class="fg" style="margin-left:auto"><span class="lb" style="color:var(--muted)">อัปเดตทุก 1 นาที</span></div></div>`;
  return h;
}
window.setRange=async function(r){RANGE=r;if(r==="custom"){if(!customFrom||!customTo){const TZ=7*3600000,th=new Date(Date.now()+TZ),y=th.getUTCFullYear(),m=th.getUTCMonth(),d=th.getUTCDate(),iso=t=>new Date(t).toISOString().slice(0,10);customTo=iso(Date.UTC(y,m,d));customFrom=iso(Date.UTC(y,m,d)-6*86400000);}paint();return;}$("#content").innerHTML='<div class="empty">กำลังโหลด…</div>';await load();paint();};
window.applyCustom=async function(){const f=$("#cFrom").value,t=$("#cTo").value;if(!f||!t){toast("เลือกวันที่ให้ครบ");return;}if(f>t){toast("วันเริ่มต้องไม่เกินวันสิ้นสุด");return;}customFrom=f;customTo=t;$("#content").innerHTML='<div class="empty">กำลังโหลด…</div>';await load();paint();};

/* data */
const FB=s=>s==="pancake"||s==="manual"||s==="refill";
const chName=s=>FB(s)?"Facebook (Pancake)":"Marketplace";
function saleRev(r){return (r.saleItems||[]).reduce((s,x)=>s+(Number(x.price)||0),0);}
const STLABEL={new:"ใหม่",contacting:"กำลังติดต่อ",interested:"สนใจ",followup:"นัดติดตาม",awaiting_payment:"รอชำระเงิน",won:"ปิดการขาย",lost:"ไม่สนใจ"};
const STCLASS={new:"st-new",contacting:"st-ct",interested:"st-int",followup:"st-fu",awaiting_payment:"st-pay",won:"st-won",lost:"st-lost"};
const STCOL={new:"#4f46e5",contacting:"#0e7490",interested:"#7c3aed",followup:"#0369a1",awaiting_payment:"#d97706",won:"#16a34a",lost:"#b91c1c"};
function stPill(s,ex){s=s||"new";return `<span class="pill ${STCLASS[s]||"st-new"}">${STLABEL[s]||s}${ex||""}</span>`;}
async function load(){
  const{from,to}=rangeISO();const q=`?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`;
  const[kpi,calls,chat,pool,dist,leads,leave,tiers,aperf]=await Promise.all([
    getJSON("/api/admin/kpi"+q),getJSON("/api/admin/callstats"+q),getJSON("/api/admin/chat-kpi"+q),
    getJSON("/api/pool"),getJSON("/api/dist-stats"+q),getJSON("/api/leads"),getJSON("/api/admin/leaves"),
    getJSON("/api/admin/followup-tiers"),getJSON("/api/admin/admin-perf"+q),
  ]);
  D={kpi:kpi||{},calls:calls||{},chat:chat||{},pool:pool||{},dist:dist||{},leave:leave||{},tiers:(tiers&&tiers.tiers)||{},adminPerf:aperf||{}};
  D.leads=(leads&&leads.active)||[];D.archived=(leads&&leads.archived)||[];
  D.src=srcAgg(D.leads);D.todo=todoAgg(D.leads);
}
function srcAgg(list){const z=()=>({leads:0,called:0,interest:0,won:0,rev:0});const A={mkt:z(),fb:z()};
  for(const r of list){const a=A[FB(r.source)?"fb":"mkt"];a.leads++;if((r.callCount||0)>0)a.called++;const st=r.leadStatus||"new";if(st==="interested"||st==="followup")a.interest++;if(st==="won"){a.won++;a.rev+=saleRev(r);}}return A;}
function todoAgg(list){const now=Date.now();let notCalled=0,dueToday=0,overdue=0,pay=0,interest=0;
  const TZ=7*3600000,th=new Date(now+TZ),y=th.getUTCFullYear(),m=th.getUTCMonth(),d=th.getUTCDate(),dayEnd=Date.UTC(y,m,d,23,59,59)-TZ;
  for(const r of list){const st=r.leadStatus||"new";if(st==="won"||st==="lost")continue;
    if((r.callCount||0)===0&&st==="new")notCalled++;if(st==="awaiting_payment")pay++;if(st==="interested")interest++;
    if(st==="followup"&&r.nextAppt){const t=Date.parse(r.nextAppt);if(!isNaN(t)){if(t<now)overdue++;else if(t<=dayEnd)dueToday++;}}
    else{const la=Date.parse(r.lastActivity||r.updatedAt||0);if(la&&(now-la)>=4*86400000)overdue++;}}
  return{notCalled,dueToday,overdue,pay,interest};}
function teamT(){const W=D.kpi.W||{},K=D.kpi.K||{},s=f=>(W[f]||0)+(K[f]||0),rev=a=>(a.todaySales||[]).reduce((x,y)=>x+(y.amount||0),0);
  return{total:s("total"),callsToday:s("callsToday"),talk7Today:s("talk7Today"),wonToday:s("wonToday"),revToday:rev(W)+rev(K),
    pending:s("pending"),followup:((W.status||{}).followup||0)+((K.status||{}).followup||0),
    calledEvoToday:s("calledEvoToday"),calledManualToday:s("calledManualToday"),Wrev:rev(W),Krev:rev(K)};}

    <div class="kv"><span class="k">รอบติดตาม T1/T2/T3</span><span class="v" style="color:var(--ok)">✅ ระบบแยกอัตโนมัติจากอายุออเดอร์</span></div>
    <div class="kv"><span class="k">— T1 รายใหม่</span><span class="v">0–6 วัน · โทรครั้งแรก/ยืนยันออเดอร์</span></div>
    <div class="kv"><span class="k">— T2 หลังรับของ</span><span class="v">7–24 วัน · ถามผลใช้ + เสนอเพิ่ม</span></div>
    <div class="kv"><span class="k">— T3 ซื้อซ้ำ</span><span class="v">25 วันขึ้นไป · ชวนสั่งซ้ำ</span></div>
    <div class="kv"><span class="k">ฟอนต์</span><span class="v">Noto Sans Thai</span></div>
  </div>
  <div class="secttl" style="margin-top:22px">🔄 รีเซ็ตรายชื่อคืนคลัง (ด้วยตัวเอง)<span class="ln"></span></div>
  <div class="card" style="padding:16px 18px">
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.6">คืนรายชื่อที่ยังไม่คืบหน้า (สถานะ "ใหม่/กำลังติดต่อ") กลับเข้าคลังรายชื่อทันที โดยไม่ต้องรอ 20:00 น. — รายที่ สนใจ/นัด/รอชำระ/ปิดการขาย จะยังอยู่กับเซลล์</p>
    <button class="btn p" id="resetBtn" onclick="doReset()">รีเซ็ตคืนคลังตอนนี้</button><span id="resetMsg" style="margin-left:12px;font-size:13px;color:var(--muted);font-weight:700"></span>
  </div>
  <div class="note" style="margin-top:14px">รอบ T1/T2/T3 คำนวณจากอายุของรายชื่อ/ออเดอร์อัตโนมัติ (เซลล์เปลี่ยนเองไม่ได้) · เมื่อเชื่อม Pancake แล้วระบบจะใช้วันที่ออเดอร์จริงทันที</div>`;
}

window.doReset=async function(){
  if(!confirm("คืนรายชื่อที่ยังไม่คืบหน้าทั้งหมดกลับเข้าคลัง?"))return;
  $("#resetBtn").disabled=true;$("#resetMsg").textContent="กำลังรีเซ็ต…";
  const j=await postJSON("/api/admin/daily-reset");
  if(j&&j.ok){toast(`คืนคลังแล้ว ${j.moved} ราย`);await load();paint();}
  else{$("#resetBtn").disabled=false;$("#resetMsg").textContent="ทำรายการไม่สำเร็จ";}
};
/* render */
const VIEWS={dashboard:viewDashboard,admin_overview:viewAdminOverview,tel_overview:viewTelOverview,tel_calltoday:viewTelCallToday,tel_perf:viewTelPerf,tickets:viewTickets,ticket:viewTicket,stock:viewStock,reports:viewReports,staff:viewStaff,settings:viewSettings};
function paint(){renderNav();$("#viewTitle").textContent=TITLES[VIEW]||"คอนโซล";const fn=VIEWS[VIEW]||viewDashboard;$("#content").innerHTML=fn();window.scrollTo(0,0);}
async function init(){
  const me=await getJSON("/api/me");if(!me)return;ME=me;
  if(me.role!=="admin"){location.href=(me.role==="adminsales"?"/distribute":(me.role==="chatadmin"?"/me":"/sales"));return;}
  renderNav();await load();paint();
  setInterval(async()=>{if(VIEW==="ticket"||$("#dBtn"))return;await load();paint();},60000);
}
init();
</script>
</body>
