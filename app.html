<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>คอนโซลหัวหน้าทีม — Evo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap">
<style>
  :root{
    --bg:#eef2f8;--surface:#ffffff;--surface-2:#f7f9fc;--ink:#0f172a;--muted:#64748b;--line:#e6ecf3;
    --brand:#2563eb;--brand-deep:#1e3a8a;--violet:#7c3aed;--cyan:#0e7490;
    --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--w:#2563eb;--k:#4f46e5;
    --side:#0f172a;--side-ink:#cbd5e1;--side-mut:#64748b;--side-line:#1e293b;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(30,41,59,.06);
    --shadow-lg:0 12px 40px rgba(15,23,42,.18);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0b1220;--surface:#131c2e;--surface-2:#0f1829;--ink:#e6ecf5;--muted:#93a3bb;--line:#243247;
    --side:#080d18;--side-ink:#cbd5e1;--side-mut:#64748b;--side-line:#1a2436;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 12px 40px rgba(0,0,0,.5);
  }}
  :root[data-theme="dark"]{
    --bg:#0b1220;--surface:#131c2e;--surface-2:#0f1829;--ink:#e6ecf5;--muted:#93a3bb;--line:#243247;
    --side:#080d18;--side-ink:#cbd5e1;--side-mut:#64748b;--side-line:#1a2436;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 12px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  .tnum{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  .app{display:flex;min-height:100vh}
  .side{width:232px;flex:0 0 auto;background:var(--side);color:var(--side-ink);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{color:#fff;font-weight:800;font-size:14px;padding:6px 10px 12px;border-bottom:1px solid var(--side-line);margin-bottom:6px;line-height:1.3}
  .brand small{display:block;color:var(--side-mut);font-weight:600;font-size:11px;margin-top:3px}
  .navlab{font-size:10px;font-weight:800;color:var(--side-mut);letter-spacing:.6px;padding:11px 10px 4px;text-transform:uppercase}
  .nav-i{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;font-size:13px;font-weight:700;color:var(--side-ink);background:transparent;border:0;width:100%;text-align:left}
  .nav-i:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-i.on{background:var(--brand);color:#fff}
  .nav-i .ic{width:17px;text-align:center;flex:0 0 auto}
  .nav-i .badge{margin-left:auto;background:#db2777;color:#fff;font-size:11px;border-radius:8px;padding:1px 7px;font-weight:800}
  .nav-i.sub{padding-left:32px;font-size:12.5px;color:var(--side-mut);font-weight:600}
  .nav-i.sub.on{color:#fff;background:rgba(37,99,235,.25)}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px 22px;display:flex;align-items:center;gap:14px}
  .topbar h2{margin:0;font-size:16px;font-weight:800}
  .spacer{flex:1}
  .menuBtn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;font-size:16px;color:var(--ink)}
  .iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;font-size:16px;color:var(--ink)}
  .lo{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:700;font-size:13px;color:var(--ink);text-decoration:none}
  .content{padding:22px;max-width:1240px;width:100%;margin:0 auto}
  .secttl{font-size:15px;font-weight:800;margin:6px 2px 12px;display:flex;align-items:center;gap:9px}
  .secttl .ln{flex:1;height:1px;background:var(--line)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;border-radius:999px;padding:5px 11px;white-space:nowrap}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:11px 14px;margin-bottom:18px}
  .fg{display:flex;align-items:center;gap:5px}.fg .lb{font-size:11px;color:var(--muted);font-weight:800}
  .chip{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--ink)}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  .tcard{overflow:hidden}
  .tcard .hd{padding:13px 16px;color:#fff;font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:9px}
  .tcard.adm .hd{background:linear-gradient(135deg,#5b21b6,#7c3aed)}
  .tcard.tel .hd{background:linear-gradient(135deg,#1e3a8a,#2563eb)}
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
  .mi{background:var(--surface);padding:14px 15px}
  .mi .n{font-size:22px;font-weight:800;line-height:1}
  .mi .l{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:4px}
  .todo{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}
  .tt{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:13px;box-shadow:var(--shadow);padding:14px 15px}
  .tt .n{font-size:25px;font-weight:800;line-height:1;color:var(--warn)}
  .tt .l{font-size:12px;color:var(--muted);font-weight:700;margin-top:5px}
  .tt.red{border-left-color:var(--bad)}.tt.red .n{color:var(--bad)}
  .tt.blue{border-left-color:var(--brand)}.tt.blue .n{color:var(--brand)}
  .tt.green{border-left-color:var(--ok)}.tt.green .n{color:var(--ok)}
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:800;padding:12px 15px;background:var(--surface-2);border-bottom:1px solid var(--line)}
  .tbl th.r,.tbl td.r{text-align:right}
  .tbl td{padding:12px 15px;border-bottom:1px solid var(--line)}
  .tbl tr:last-child td{border-bottom:0}
  .win{color:var(--ok);font-weight:800}
  .sideb{font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:2px 7px}
  .sideb.w{background:var(--w)}.sideb.k{background:var(--k)}
  .st-new{background:color-mix(in srgb,#3730a3 14%,var(--surface));color:#4f46e5}
  .st-ct{background:color-mix(in srgb,var(--cyan) 14%,var(--surface));color:var(--cyan)}
  .st-int{background:color-mix(in srgb,var(--violet) 14%,var(--surface));color:var(--violet)}
  .st-fu{background:color-mix(in srgb,var(--cyan) 14%,var(--surface));color:#0369a1}
  .st-won{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}
  .st-pay{background:color-mix(in srgb,var(--warn) 15%,var(--surface));color:var(--warn)}
  .st-lost{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
  .btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;font-size:13px;font-family:inherit}
  .btn.p{background:var(--brand);color:#fff}.btn.g{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.5}
  .seg{display:flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;width:fit-content;flex-wrap:wrap}
  .seg button{border:0;background:var(--surface);padding:9px 15px;font-size:13px;font-weight:700;color:var(--muted)}
  .seg button.on{background:var(--brand);color:#fff}
  .inp{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:14px}
  .fld{margin-bottom:14px}.fld label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:7px}
  .poolwrap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:4px}
  .poolcard{border:1px solid var(--line);border-radius:13px;padding:15px 16px;background:var(--surface-2)}
  .poolcard .n{font-size:27px;font-weight:800;line-height:1}.poolcard .l{font-size:12px;color:var(--muted);font-weight:700;margin-top:5px}
  .dor{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}.dor:last-child{border-bottom:0}
  .av{width:42px;height:42px;border-radius:12px;color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .av.W{background:linear-gradient(135deg,#2563eb,#1e3a8a)}.av.K{background:linear-gradient(135deg,#7c3aed,#4c1d95)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:22px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.22s;z-index:100;box-shadow:var(--shadow-lg)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .note{background:color-mix(in srgb,var(--cyan) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--cyan) 28%,var(--surface));color:#0369a1;border-radius:12px;padding:11px 14px;font-size:12.5px;font-weight:600;line-height:1.6}
  .empty{color:var(--muted);padding:26px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
  @media(max-width:960px){.side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:.25s}.side.open{transform:none}.menuBtn{display:block}.two{grid-template-columns:1fr}.todo{grid-template-columns:repeat(2,1fr)}.poolwrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <div class="main">
    <div class="topbar">
      <button class="menuBtn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <h2 id="viewTitle">ภาพรวมทีม</h2><div class="spacer"></div>
      <button class="iconbtn" id="themeBtn" title="สลับธีม" onclick="toggleTheme()">◐</button>
      <a class="lo" href="#" onclick="logout(event)">ออกจากระบบ</a>
    </div>
    <div class="content" id="content"><div class="empty">กำลังโหลด…</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("th-TH");
const fmtB=n=>"฿"+fmt(Math.round(n||0));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1900);}
let ME=null,VIEW="dash",RANGE="today",D={};

/* theme */
(function(){try{const s=localStorage.getItem("evo-theme");if(s)document.documentElement.setAttribute("data-theme",s);}catch(e){}})();
window.toggleTheme=function(){const el=document.documentElement;const cur=el.getAttribute("data-theme");const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;const nx=dark?"light":"dark";el.setAttribute("data-theme",nx);try{localStorage.setItem("evo-theme",nx);}catch(e){}};

const NAV=[
  {k:"dash",ic:"📊",t:"ภาพรวมทีม"},
  {lab:"ผลงานทีม"},
  {k:"tele",ic:"📞",t:"KPI ทีมเซลล์",sub:1},
  {k:"admin",ic:"💬",t:"KPI ทีมแอดมิน",sub:1},
  {lab:"จัดการ"},
  {k:"dist",ic:"📤",t:"คลังรายชื่อ & แจก"},
  {k:"leave",ic:"🌴",t:"วันลา / วันหยุด"},
];
const TITLES={dash:"ภาพรวมทีม",tele:"KPI ทีมเซลล์",admin:"KPI ทีมแอดมิน",dist:"คลังรายชื่อ & แจก",leave:"วันลา / วันหยุด"};
function renderNav(){
  $("#side").innerHTML=`<div class="brand">EVO E-COMMERCE<small>${esc((ME&&ME.name)||"หัวหน้าทีม")} · Console</small></div>`+
    NAV.map(it=>it.lab?`<div class="navlab">${it.lab}</div>`
      :`<button class="nav-i ${it.sub?"sub":""} ${VIEW===it.k?"on":""}" onclick="go('${it.k}')">${it.ic?`<span class="ic">${it.ic}</span>`:""}<span>${it.t}</span></button>`).join("");
}
window.go=function(k){VIEW=k;$("#side").classList.remove("open");paint();};
window.logout=function(e){e.preventDefault();fetch("/logout",{method:"POST"}).then(()=>location.href="/login");};

async function getJSON(u){const r=await fetch(u);if(r.status===401){location.href="/login";return null;}if(r.status===403){location.href="/sales";return null;}return r.json().catch(()=>({}));}
async function postJSON(u,b){const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});if(r.status===401){location.href="/login";return null;}return r.json().catch(()=>({}));}

/* range */
function rangeISO(){
  const TZ=7*3600000,now=Date.now(),th=new Date(now+TZ);
  const y=th.getUTCFullYear(),m=th.getUTCMonth(),d=th.getUTCDate();
  const sT=Date.UTC(y,m,d,0,0,0)-TZ,eT=Date.UTC(y,m,d,23,59,59)-TZ;
  if(RANGE==="7")return{from:new Date(sT-6*86400000).toISOString(),to:new Date(eT).toISOString()};
  if(RANGE==="month")return{from:new Date(Date.UTC(y,m,1,0,0,0)-TZ).toISOString(),to:new Date(eT).toISOString()};
  return{from:new Date(sT).toISOString(),to:new Date(eT).toISOString()};
}
const RLABEL={today:"วันนี้","7":"7 วันล่าสุด",month:"เดือนนี้"};
function filterBar(){
  return `<div class="filters"><div class="fg"><span class="lb">ช่วงเวลา</span>`+
    ["today","7","month"].map(r=>`<button class="chip ${RANGE===r?"on":""}" onclick="setRange('${r}')">${RLABEL[r]}</button>`).join("")+
    `</div><div class="fg" style="margin-left:auto"><span class="lb" style="color:var(--muted)">อัปเดตอัตโนมัติทุก 1 นาที</span></div></div>`;
}
window.setRange=async function(r){RANGE=r;$("#content").innerHTML='<div class="empty">กำลังโหลด…</div>';await load();paint();};

/* ---------- data ---------- */
async function load(){
  const{from,to}=rangeISO();const q=`?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`;
  const[kpi,calls,chat,pool,dist,leads,leave]=await Promise.all([
    getJSON("/api/admin/kpi"+q),getJSON("/api/admin/callstats"+q),getJSON("/api/admin/chat-kpi"+q),
    getJSON("/api/pool"),getJSON("/api/dist-stats"+q),getJSON("/api/leads"),getJSON("/api/admin/leaves"),
  ]);
  D={kpi:kpi||{},calls:calls||{},chat:chat||{},pool:pool||{},dist:dist||{},leave:leave||{}};
  // derive from raw leads: source table + todo counts
  D.src=srcAgg((leads&&leads.active)||[]);
  D.todo=todoAgg((leads&&leads.active)||[]);
}
const FB=s=>s==="pancake"||s==="manual"||s==="refill";
function saleRev(r){return (r.saleItems||[]).reduce((s,x)=>s+(Number(x.price)||0),0);}
function srcAgg(list){
  const z=()=>({leads:0,called:0,talk:0,interest:0,won:0,rev:0});
  const A={mkt:z(),fb:z()};
  for(const r of list){const ch=FB(r.source)?"fb":"mkt";const a=A[ch];a.leads++;
    if((r.callCount||0)>0)a.called++;
    const st=r.leadStatus||"new";
    if(st==="interested"||st==="followup")a.interest++;
    if(st==="won"){a.won++;a.rev+=saleRev(r);}
  }
  return A;
}
function todoAgg(list){
  const now=Date.now();let notCalled=0,dueToday=0,overdue=0,pay=0,interest=0;
  const TZ=7*3600000,th=new Date(now+TZ),y=th.getUTCFullYear(),m=th.getUTCMonth(),d=th.getUTCDate();
  const dayEnd=Date.UTC(y,m,d,23,59,59)-TZ;
  for(const r of list){const st=r.leadStatus||"new";
    if(st==="won"||st==="lost")continue;
    if((r.callCount||0)===0&&st==="new")notCalled++;
    if(st==="awaiting_payment")pay++;
    if(st==="interested")interest++;
    if(st==="followup"&&r.nextAppt){const t=Date.parse(r.nextAppt);if(!isNaN(t)){if(t<now)overdue++;else if(t<=dayEnd)dueToday++;}}
    else{const la=Date.parse(r.lastActivity||r.updatedAt||0);if(la&&(now-la)>=4*86400000)overdue++;}
  }
  return{notCalled,dueToday,overdue,pay,interest};
}
function teamT(){
  const W=D.kpi.W||{},K=D.kpi.K||{},s=f=>(W[f]||0)+(K[f]||0);
  const rev=a=>(a.todaySales||[]).reduce((x,y)=>x+(y.amount||0),0);
  return{total:s("total"),callsToday:s("callsToday"),talk7Today:s("talk7Today"),wonToday:s("wonToday"),
    revToday:rev(W)+rev(K),pending:s("pending"),followup:((W.status||{}).followup||0)+((K.status||{}).followup||0),
    calledEvoToday:s("calledEvoToday"),calledManualToday:s("calledManualToday"),
    Wrev:rev(W),Krev:rev(K)};
}

/* ---------- helpers ---------- */
function mi(n,l,c){return `<div class="mi"><div class="n tnum" ${c?`style="color:${c}"`:""}>${n}</div><div class="l">${l}</div></div>`;}
function statTile(n,l,c){return `<div class="card" style="padding:14px 16px"><div class="tnum" style="font-size:22px;font-weight:800;line-height:1${c?`;color:${c}`:""}">${n}</div><div style="font-size:11.5px;color:var(--muted);font-weight:600;margin-top:5px">${l}</div></div>`;}
function bar(pct,c){return `<div style="height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:5px"><i style="display:block;height:100%;width:${Math.min(100,pct)}%;background:${c}"></i></div>`;}
function cell(v,pct){const c=pct>=90?"var(--ok)":pct>=60?"var(--brand)":pct>=40?"var(--warn)":"var(--bad)";
  return `<td><div style="display:flex;justify-content:space-between;font-weight:800;font-size:13px"><span class="tnum">${v}</span><span class="tnum" style="color:${c}">${pct}%</span></div>${bar(pct,c)}</td>`;}

/* ========== DASHBOARD ========== */
function viewDash(){
  const t=teamT(),src=D.src,todo=D.todo;
  const admins=(D.chat.admins||[]).filter(Boolean);
  const admChats=admins.reduce((s,a)=>s+(a.chats||0),0),admReplies=admins.reduce((s,a)=>s+(a.replies||0),0),admClosed=admins.reduce((s,a)=>s+(a.closed||0),0);
  const tgtCallTeam=((D.kpi.targets&&D.kpi.targets.evo)||50)*2+((D.kpi.targets&&D.kpi.targets.manual)||15)*2;
  let h=filterBar();
  h+=`<div class="two">
    <div class="card tcard adm"><div class="hd">💬 ทีมแอดมิน — ตอบแชท FB</div>
      <div class="mgrid">${mi(fmt(admins.length),"จำนวนแอดมิน")}${mi(fmt(admChats),"แชทที่ดูแล")}${mi(fmt(admReplies),"ข้อความตอบ")}${mi(fmt(admClosed),"ปิดแชท","var(--ok)")}${mi("—","ยอดขาย")}${mi("—","ต้องเชื่อม Pancake")}</div>
    </div>
    <div class="card tcard tel"><div class="hd">📞 ทีมเซลล์ — การโทร</div>
      <div class="mgrid">${mi(fmt(t.total),"ลูกค้าในมือ")}${mi(fmt(t.callsToday),"โทรวันนี้")}${mi(fmt(t.talk7Today),"ได้คุย (>7 วิ)")}${mi(fmt(t.followup),"รอติดตาม")}${mi(fmt(t.wonToday),"ปิดได้วันนี้","var(--ok)")}${mi(fmtB(t.revToday),"ยอดขายวันนี้","var(--ok)")}</div>
    </div>
  </div>`;
  // งานค้าง
  h+=`<div class="secttl">🔔 งานค้างวันนี้ — ต้องเคลียร์<span class="ln"></span></div>
  <div class="todo">
    <div class="tt blue"><div class="n tnum">${fmt(todo.notCalled)}</div><div class="l">ยังไม่ได้โทร</div></div>
    <div class="tt"><div class="n tnum">${fmt(todo.dueToday)}</div><div class="l">ต้องติดตามวันนี้</div></div>
    <div class="tt red"><div class="n tnum">${fmt(todo.overdue)}</div><div class="l">เลยกำหนด/เงียบนาน</div></div>
    <div class="tt"><div class="n tnum">${fmt(todo.pay)}</div><div class="l">รอชำระเงิน</div></div>
    <div class="tt green"><div class="n tnum">${fmt(todo.interest)}</div><div class="l">สนใจ · รอปิด</div></div>
  </div>`;
  // source table
  h+=`<div class="secttl">🛒 แหล่งที่มาของลูกค้า — Marketplace vs Facebook<span class="ln"></span></div>
  <div class="card" style="overflow:auto"><table class="tbl">
    <thead><tr><th>ช่องทาง</th><th class="r">รายชื่อในมือ</th><th class="r">โทรแล้ว</th><th class="r">สนใจ/ติดตาม</th><th class="r">ปิดขาย</th><th class="r">ยอดขาย</th></tr></thead>
    <tbody>
      <tr><td><b>📦 Marketplace</b></td><td class="r tnum">${fmt(src.mkt.leads)}</td><td class="r tnum">${fmt(src.mkt.called)}</td><td class="r tnum">${fmt(src.mkt.interest)}</td><td class="r tnum win">${fmt(src.mkt.won)}</td><td class="r tnum win">${fmtB(src.mkt.rev)}</td></tr>
      <tr><td><b>💬 Facebook (Pancake)</b></td><td class="r tnum">${fmt(src.fb.leads)}</td><td class="r tnum">${fmt(src.fb.called)}</td><td class="r tnum">${fmt(src.fb.interest)}</td><td class="r tnum win">${fmt(src.fb.won)}</td><td class="r tnum win">${fmtB(src.fb.rev)}</td></tr>
    </tbody></table></div>`;
  // ยอดขายวันนี้
  h+=`<div class="secttl" style="margin-top:22px">💰 ยอดขายวันนี้ (ทีมเซลล์)<span class="ln"></span></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px">
    ${statTile(fmtB(t.revToday),"ยอดขายรวม","var(--ok)")}${statTile(fmtB(t.Wrev),"พี่หวาน (W)")}${statTile(fmtB(t.Krev),"พี่เขม (K)")}${statTile(fmt(t.wonToday),"ออเดอร์รวม")}</div>
  <div class="card" style="overflow:auto"><table class="tbl"><thead><tr><th>พนักงาน</th><th>ทีม</th><th class="r">ปิดวันนี้</th><th class="r">ยอดขายวันนี้</th></tr></thead>
  <tbody>
    <tr><td><b>พี่หวาน</b></td><td><span class="sideb w">W</span> Telesales</td><td class="r tnum">${fmt((D.kpi.W||{}).wonToday||0)}</td><td class="r tnum win">${fmtB(t.Wrev)}</td></tr>
    <tr><td><b>พี่เขม</b></td><td><span class="sideb k">K</span> Telesales</td><td class="r tnum">${fmt((D.kpi.K||{}).wonToday||0)}</td><td class="r tnum win">${fmtB(t.Krev)}</td></tr>
    ${admins.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>Admin (แชท)</td><td class="r tnum">${fmt(a.closed)}</td><td class="r tnum" style="color:var(--muted)">—</td></tr>`).join("")}
  </tbody></table></div>
  ${admins.length?'':'<div class="note" style="margin-top:12px">ℹ️ แถวทีมแอดมินและยอดขายรายแอดมินจะแสดงเมื่อตั้งค่า CHAT_USERS และเชื่อม Pancake (PANCAKE_API_KEY) บน Railway</div>'}`;
  return h;
}

/* ========== TELESALES KPI ========== */
function viewTele(){
  const kpi=D.kpi,W=kpi.W||{},K=kpi.K||{},calls=D.calls||{};
  const s=f=>(W[f]||0)+(K[f]||0);
  const tEvo=(kpi.targets&&kpi.targets.evo)||50,tMan=(kpi.targets&&kpi.targets.manual)||15;
  const pc=(v,t)=>t?Math.round(v/t*100):0;
  const wEvo=W.calledEvoToday||0,kEvo=K.calledEvoToday||0,wMan=W.calledManualToday||0,kMan=K.calledManualToday||0;
  let h=filterBar();
  // pipeline
  const stK=[["new","st-new","ใหม่"],["contacting","st-ct","กำลังติดต่อ"],["interested","st-int","สนใจ"],["followup","st-fu","นัดติดตาม"],["awaiting_payment","st-pay","รอชำระเงิน"],["won","st-won","ปิดสำเร็จ"],["lost","st-lost","ไม่สนใจ"]];
  h+=`<div class="secttl">📊 ไปป์ไลน์ลูกค้า (ในมือตอนนี้)<span class="ln"></span></div>
  <div class="card" style="overflow:auto;margin-bottom:20px"><table class="tbl">
    <thead><tr><th>สถานะ</th><th class="r">พี่หวาน (W)</th><th class="r">พี่เขม (K)</th><th class="r">รวมทีม</th></tr></thead><tbody>
    ${stK.map(([k,cls,l])=>`<tr><td><span class="pill ${cls}">${esc(l)}</span></td><td class="r tnum">${fmt((W.status||{})[k]||0)}</td><td class="r tnum">${fmt((K.status||{})[k]||0)}</td><td class="r tnum"><b>${fmt(((W.status||{})[k]||0)+((K.status||{})[k]||0))}</b></td></tr>`).join("")}
    <tr style="background:var(--surface-2)"><td><b>ลูกค้าในมือรวม</b></td><td class="r tnum"><b>${fmt(W.total)}</b></td><td class="r tnum"><b>${fmt(K.total)}</b></td><td class="r tnum"><b>${fmt(s("total"))}</b></td></tr>
  </tbody></table></div>`;
  // KPI target table w/ progress cells
  h+=`<div class="secttl">📞 การโทร — เทียบเป้าที่ระบบแจก/คน/วัน<span class="ln"></span></div>
  <div class="card" style="overflow:auto;margin-bottom:20px"><table class="tbl">
    <thead><tr><th>ช่องทาง</th><th class="r">เป้า/คน</th><th>พี่หวาน (W)</th><th>พี่เขม (K)</th><th>รวมทีม</th></tr></thead><tbody>
    <tr><td><b>📦 Marketplace</b><div style="font-size:11px;color:var(--muted)">รายชื่อจากเว็บ</div></td><td class="r tnum">${tEvo}</td>${cell(wEvo+"/"+tEvo,pc(wEvo,tEvo))}${cell(kEvo+"/"+tEvo,pc(kEvo,tEvo))}${cell((wEvo+kEvo)+"/"+(tEvo*2),pc(wEvo+kEvo,tEvo*2))}</tr>
    <tr><td><b>💬 Facebook (Pancake)</b><div style="font-size:11px;color:var(--muted)">T1+T2+T3</div></td><td class="r tnum">${tMan}</td>${cell(wMan+"/"+tMan,pc(wMan,tMan))}${cell(kMan+"/"+tMan,pc(kMan,tMan))}${cell((wMan+kMan)+"/"+(tMan*2),pc(wMan+kMan,tMan*2))}</tr>
    <tr style="background:var(--surface-2)"><td><b>รวมทั้งหมด</b></td><td class="r tnum">${tEvo+tMan}</td>${cell((wEvo+wMan)+"/"+(tEvo+tMan),pc(wEvo+wMan,tEvo+tMan))}${cell((kEvo+kMan)+"/"+(tEvo+tMan),pc(kEvo+kMan,tEvo+tMan))}${cell((wEvo+wMan+kEvo+kMan)+"/"+((tEvo+tMan)*2),pc(wEvo+wMan+kEvo+kMan,(tEvo+tMan)*2))}</tr>
  </tbody></table>
  <div style="padding:12px 15px;font-size:12px;color:var(--muted)">🟩 ถึงเป้า ≥90% · 🟦 ใกล้ 60–89% · 🟧 ต้องเร่ง 40–59% · 🟥 ห่างเป้า &lt;40% · <b>เป้าเป็นรายวัน</b> (เลือกช่วง "7 วัน/เดือนนี้" เพื่อดูยอดสะสม)</div></div>`;
  // performance + revenue
  h+=`<div class="secttl">🎯 ผลงาน · ${RLABEL[RANGE]}<span class="ln"></span></div>
  <div class="card" style="overflow:auto;margin-bottom:20px"><table class="tbl">
    <thead><tr><th>ตัวชี้วัด</th><th class="r">พี่หวาน (W)</th><th class="r">พี่เขม (K)</th><th class="r">รวมทีม</th></tr></thead><tbody>
    ${krow("โทรออก (นับสาย)","callsRange",W,K)}
    ${krow("คุยจริง >7 วินาที","talk7Range",W,K)}
    ${krow("ปิดการขาย","wonRange",W,K)}
    ${krow("ไม่สนใจ (Lost)","lostRange",W,K)}
    <tr style="background:var(--surface-2)"><td><b>ยอดขาย</b></td><td class="r tnum"><b>${fmtB(W.revRange)}</b></td><td class="r tnum"><b>${fmtB(K.revRange)}</b></td><td class="r tnum win"><b>${fmtB(s("revRange"))}</b></td></tr>
  </tbody></table></div>`;
  // call quality
  if(calls.summary){const q=calls.summary;
    h+=`<div class="secttl">☎️ คุณภาพการโทร (OneCall) — ${calls.hasOnecall?"เชื่อมต่อแล้ว":"ยังไม่มีข้อมูล"}<span class="ln"></span></div>
    <div class="card" style="overflow:auto"><table class="tbl">
      <thead><tr><th>เซลล์</th><th class="r">สายทั้งหมด</th><th class="r">คุย >7 วิ</th><th class="r">เฉลี่ย/สาย</th><th class="r">อัตราคุยติด</th></tr></thead><tbody>
      ${qrow("พี่หวาน (W)",q.W)}${qrow("พี่เขม (K)",q.K)}
      <tr style="background:var(--surface-2)"><td><b>รวมทีม</b></td><td class="r tnum"><b>${fmt(q.team.calls)}</b></td><td class="r tnum win"><b>${fmt(q.team.over7)}</b></td><td class="r tnum"><b>${fmt(q.team.avgSec)} วิ</b></td><td class="r tnum"><b>${fmt(q.team.pct)}%</b></td></tr>
    </tbody></table></div>`;
  }
  return h;
}
function krow(l,f,W,K){return `<tr><td>${esc(l)}</td><td class="r tnum">${fmt(W[f]||0)}</td><td class="r tnum">${fmt(K[f]||0)}</td><td class="r tnum"><b>${fmt((W[f]||0)+(K[f]||0))}</b></td></tr>`;}
function qrow(n,s){s=s||{};return `<tr><td><b>${esc(n)}</b></td><td class="r tnum">${fmt(s.calls)}</td><td class="r tnum win">${fmt(s.over7)}</td><td class="r tnum">${fmt(s.avgSec)} วิ</td><td class="r tnum">${fmt(s.pct)}%</td></tr>`;}

/* ========== TEAM ADMIN KPI ========== */
function viewAdmin(){
  const admins=(D.chat.admins||[]).filter(Boolean);
  let h=filterBar();
  if(!admins.length){h+=`<div class="empty">ยังไม่ได้ตั้งค่าทีมแอดมิน (ตอบแชท) หรือยังไม่มีข้อมูลในช่วง ${RLABEL[RANGE]}<br><span style="font-size:12px">เพิ่มรายชื่อแอดมิน (ไลลา/ณชา/ยูกิ/พี่โม) ที่ตัวแปร CHAT_USERS บน Railway แล้วข้อมูลจะขึ้นที่นี่อัตโนมัติ</span></div>`;return h;}
  const tc=admins.reduce((s,a)=>s+(a.chats||0),0),tr=admins.reduce((s,a)=>s+(a.replies||0),0),tcl=admins.reduce((s,a)=>s+(a.closed||0),0);
  h+=`<div class="card tcard adm" style="margin-bottom:20px"><div class="hd">💬 ทีมแอดมิน — ตอบแชท FB · ${RLABEL[RANGE]}</div>
    <div class="mgrid">${mi(fmt(admins.length),"จำนวนแอดมิน")}${mi(fmt(tc),"แชทที่ดูแล")}${mi(fmt(tcl),"ปิดแชท","var(--ok)")}</div></div>`;
  h+=`<div class="secttl">รายบุคคล<span class="ln"></span></div>
  <div class="card" style="overflow:auto"><table class="tbl">
    <thead><tr><th>แอดมิน</th><th class="r">จำนวนแชท</th><th class="r">ข้อความตอบ</th><th class="r">ตอบเฉลี่ย</th><th class="r">ปิดแชท</th></tr></thead><tbody>
    ${admins.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td class="r tnum">${fmt(a.chats)}</td><td class="r tnum">${fmt(a.replies)}</td><td class="r tnum">${a.avgRespSec!=null?a.avgRespSec+" วิ":"—"}</td><td class="r tnum win">${fmt(a.closed)}</td></tr>`).join("")}
  </tbody></table></div>
  <div class="note" style="margin-top:14px">ยอดขายรายแอดมิน (ปิดการขายผ่านแชท) จะแสดงเมื่อเชื่อม Pancake (PANCAKE_API_KEY) — อยู่ในแผนด่านถัดไป</div>`;
  return h;
}

/* ========== DISTRIBUTE ========== */
let dSource="all",dMode="50",dSide="W";
function viewDist(){
  const pool=(D.pool.pool)||{mp:0,fb:0,total:0},dist=D.dist||{};
  let h=`<div class="secttl">📦 คลังรายชื่อ (รอแจก)<span class="ln"></span></div>
  <div class="card" style="padding:16px 17px;margin-bottom:20px"><div class="poolwrap">
    <div class="poolcard"><div class="n tnum">${fmt(pool.total)}</div><div class="l">รวมทั้งหมด</div></div>
    <div class="poolcard"><div class="n tnum" style="color:var(--brand)">${fmt(pool.mp)}</div><div class="l">📦 Marketplace</div></div>
    <div class="poolcard"><div class="n tnum" style="color:var(--violet)">${fmt(pool.fb)}</div><div class="l">💬 Facebook (Pancake)</div></div>
  </div>${pool.total===0?`<div class="note" style="margin-top:14px">ยังไม่มีรายชื่อในคลัง — ดึงรายชื่อจาก Evolution / Pancake เข้าคลังก่อนจึงจะแจกได้</div>`:""}</div>`;
  h+=`<div class="secttl">📤 แจกรายชื่อให้เซลล์<span class="ln"></span></div>
  <div class="card" style="padding:18px;margin-bottom:20px">
    <div class="fld"><label>ช่องทางที่จะแจก</label><div class="seg">
      <button class="${dSource==="all"?"on":""}" onclick="setD('source','all')">ทั้งหมด</button>
      <button class="${dSource==="mp"?"on":""}" onclick="setD('source','mp')">📦 Marketplace</button>
      <button class="${dSource==="fb"?"on":""}" onclick="setD('source','fb')">💬 Facebook</button></div></div>
    <div class="fld"><label>วิธีแจก</label><div class="seg">
      <button class="${dMode==="50"?"on":""}" onclick="setD('mode','50')">อัตโนมัติ · แบ่งเท่ากัน W/K</button>
      <button class="${dMode==="one"?"on":""}" onclick="setD('mode','one')">เลือกจำนวน → คนเดียว</button></div></div>
    ${dMode==="one"?`<div class="fld"><label>แจกให้</label><div class="seg">
      <button class="${dSide==="W"?"on":""}" onclick="setD('side','W')">พี่หวาน (W)</button>
      <button class="${dSide==="K"?"on":""}" onclick="setD('side','K')">พี่เขม (K)</button></div></div>`:""}
    <div class="fld"><label>จำนวน (เว้นว่าง = แจกทั้งหมดในช่องทางที่เลือก)</label><input class="inp" id="dCount" type="number" min="1" placeholder="เช่น 50" style="width:170px"></div>
    <button class="btn p" id="dBtn" onclick="doDist()">แจกรายชื่อ</button>
    <span id="dMsg" style="margin-left:12px;font-size:13px;color:var(--muted);font-weight:700"></span>
  </div>`;
  if(dist.distributed){
    h+=`<div class="secttl">📈 สรุปการแจก · ${RLABEL[RANGE]}<span class="ln"></span></div>
    <div class="card" style="overflow:auto"><table class="tbl">
      <thead><tr><th>รายการ</th><th class="r">Marketplace</th><th class="r">Facebook</th><th class="r">รวม</th></tr></thead><tbody>
      <tr><td>ดึงเข้าคลัง</td><td class="r tnum">${fmt(dist.pulled.mp)}</td><td class="r tnum">${fmt(dist.pulled.fb)}</td><td class="r tnum"><b>${fmt(dist.pulled.total)}</b></td></tr>
      <tr><td>แจกให้เซลล์</td><td class="r tnum">${fmt(dist.distributed.mp)}</td><td class="r tnum">${fmt(dist.distributed.fb)}</td><td class="r tnum"><b>${fmt(dist.distributed.total)}</b></td></tr>
      <tr style="background:var(--surface-2)"><td><b>แยกตามเซลล์</b></td><td class="r" colspan="2">พี่หวาน (W): <b>${fmt(dist.distributed.W)}</b> · พี่เขม (K): <b>${fmt(dist.distributed.K)}</b></td><td class="r tnum"><b>${fmt(dist.distributed.total)}</b></td></tr>
    </tbody></table></div>`;
  }
  return h;
}
window.setD=function(k,v){if(k==="source")dSource=v;if(k==="mode")dMode=v;if(k==="side")dSide=v;paint();};
window.doDist=async function(){
  const pool=(D.pool.pool)||{total:0};if(!pool.total){toast("ยังไม่มีรายชื่อในคลัง");return;}
  const count=Number($("#dCount").value||0)||undefined;
  $("#dBtn").disabled=true;$("#dMsg").textContent="กำลังแจก…";
  const j=await postJSON("/api/distribute",{source:dSource,mode:dMode,side:dSide,count});
  if(j&&j.ok){toast(`แจกแล้ว ${j.summary.distributed} ราย (W:${j.summary.toW} · K:${j.summary.toK})`);await load();paint();}
  else{$("#dBtn").disabled=false;$("#dMsg").textContent=(j&&j.message)||"แจกไม่สำเร็จ";}
};

/* ========== LEAVE ========== */
function viewLeave(){
  const lv=D.leave||{},people=(lv.people||[]),dof=(D.pool.dayoff)||{};
  const sales=people.filter(p=>p.kind==="sales"),admins=people.filter(p=>p.kind==="admin");
  let h=`<div class="secttl">🌴 วันลา / วันหยุด — ทีมเซลล์ · เดือน ${esc(lv.month||"")}<span class="ln"></span></div>
  <div class="card" style="padding:16px 18px;margin-bottom:14px">`;
  h+=sales.map(p=>{const off=!!dof[p.who];return `<div class="dor"><div class="av ${p.who}">${p.who}</div>
    <div><div style="font-weight:800;font-size:14.5px">${esc(p.name)}</div><div style="font-size:12px;color:var(--muted);margin-top:2px">ลาเดือนนี้ ${fmt(p.monthCount)} วัน ${off?"· <b style='color:var(--warn)'>วันนี้ลา</b>":""}</div></div>
    <div style="margin-left:auto"><button class="btn ${off?"g":"p"}" onclick="setOff('${p.who}',${off?"false":"true"})">${off?"ยกเลิกวันลา":"บันทึกลาวันนี้"}</button></div></div>`;}).join("");
  h+=`</div><div class="note">เมื่อเซลล์ลา ระบบจะย้ายลูกค้าในมือไปให้อีกคนอัตโนมัติ และคืนกลับเมื่อยกเลิกวันลา · ต้องมีเซลล์ทำงานอย่างน้อย 1 คนเสมอ</div>`;
  if(admins.length){
    h+=`<div class="secttl" style="margin-top:22px">🌴 วันลา — ทีมแอดมิน<span class="ln"></span></div>
    <div class="card" style="overflow:auto"><table class="tbl"><thead><tr><th>แอดมิน</th><th class="r">ลาเดือนนี้</th><th>วันนี้</th></tr></thead><tbody>
    ${admins.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td class="r tnum">${fmt(p.monthCount)} วัน</td><td>${p.onToday?'<span class="pill st-lost">ลา</span>':'<span class="pill st-won">ทำงาน</span>'}</td></tr>`).join("")}
    </tbody></table></div>`;
  }
  return h;
}
window.setOff=async function(side,on){
  const j=await postJSON("/api/admin/dayoff",{side,off:on,type:"leave"});
  if(j&&j.ok){toast(on?`บันทึกวันลา ${side} แล้ว (ย้าย ${j.moved} ราย)`:`ยกเลิกวันลา ${side} แล้ว`);await load();paint();}
  else toast((j&&j.message)||"ทำรายการไม่สำเร็จ");
};

/* ========== render ========== */
function paint(){
  renderNav();$("#viewTitle").textContent=TITLES[VIEW]||"คอนโซล";
  let h="";
  if(VIEW==="dash")h=viewDash();else if(VIEW==="tele")h=viewTele();else if(VIEW==="admin")h=viewAdmin();
  else if(VIEW==="dist")h=viewDist();else if(VIEW==="leave")h=viewLeave();
  $("#content").innerHTML=h;window.scrollTo(0,0);
}
async function init(){
  const me=await getJSON("/api/me");if(!me)return;ME=me;
  if(me.role!=="admin"){location.href=(me.role==="adminsales"?"/distribute":(me.role==="chatadmin"?"/me":"/sales"));return;}
  renderNav();await load();paint();
  setInterval(async()=>{if(!$("#dBtn"))await load();paint();},60000);
}
init();
</script>
</body>
</html>
