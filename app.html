<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>คอนโซลหัวหน้าทีม — Evo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0f172a;--muted:#64748b;--line:#e6ecf3;--brand:#2563eb;--brand-deep:#1e3a8a;
    --violet:#7c3aed;--cyan:#0e7490;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--bg:#eef2f8;--surface:#fff;--surface-2:#f7f9fc;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.05)}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,monospace}.tnum{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit}
  .app{display:flex;min-height:100vh}
  .side{width:222px;flex:0 0 auto;background:#0f172a;color:#cbd5e1;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{color:#fff;font-weight:800;font-size:14px;padding:6px 10px 12px;border-bottom:1px solid #1e293b;margin-bottom:8px;line-height:1.3}
  .brand small{display:block;color:#64748b;font-weight:600;font-size:11px;margin-top:3px}
  .navlab{font-size:10px;font-weight:800;color:#64748b;letter-spacing:.6px;padding:11px 10px 4px}
  .nav-i{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;font-size:13px;font-weight:700;color:#cbd5e1;background:transparent;border:0;width:100%;text-align:left}
  .nav-i:hover{background:rgba(255,255,255,.06);color:#fff}.nav-i.on{background:var(--brand);color:#fff}
  .nav-i .ic{width:17px;text-align:center}.nav-i .badge{margin-left:auto;background:#db2777;color:#fff;font-size:11px;border-radius:8px;padding:1px 7px;font-weight:800}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;gap:12px}
  .topbar h2{margin:0;font-size:16px;font-weight:800}.spacer{flex:1}
  .menuBtn{display:none;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:16px}
  .lo{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-weight:700;font-size:13px;color:var(--ink);text-decoration:none}
  .content{padding:20px;max-width:1200px;width:100%;margin:0 auto}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
  .rangebar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .rbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--muted)}
  .rbtn.on{border-color:var(--brand);background:#eff5ff;color:var(--brand-deep)}
  .rlabel{font-size:12.5px;color:var(--muted);font-weight:700;margin-left:auto}
  /* hero stats */
  .hero{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
  .hcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 17px;position:relative;overflow:hidden}
  .hcard .cap{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
  .hcard .big{font-size:28px;font-weight:800;line-height:1.1;margin-top:9px}
  .hcard .sub{font-size:11.5px;color:var(--muted);margin-top:5px}
  .hcard .tag{position:absolute;top:15px;right:15px;font-size:18px;opacity:.5}
  .hcard.rev{background:linear-gradient(135deg,#052e5e,#0f3e86);border-color:#0f3e86;color:#fff}
  .hcard.rev .cap,.hcard.rev .sub{color:#bcd6ff}.hcard.rev .big{color:#fff}
  .sec{margin-bottom:16px}
  .sec-h{font-size:14px;font-weight:800;margin:0 0 11px;display:flex;align-items:center;gap:8px}
  .sec-h .mut{font-size:12px;color:var(--muted);font-weight:600}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pad{padding:16px 17px}
  /* person kpi row */
  .prow{display:flex;align-items:center;gap:13px;padding:13px 15px;border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .av{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px}
  .av.W{background:linear-gradient(135deg,#2563eb,#1e3a8a)}.av.K{background:linear-gradient(135deg,#7c3aed,#4c1d95)}.av.T{background:linear-gradient(135deg,#0e7490,#155e75)}
  .av.a1{background:linear-gradient(135deg,#db2777,#9d174d)}.av.a2{background:linear-gradient(135deg,#ea580c,#9a3412)}.av.a3{background:linear-gradient(135deg,#16a34a,#166534)}.av.a4{background:linear-gradient(135deg,#0891b2,#155e75)}
  .pname{font-weight:800;font-size:14px}.psub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .pstats{margin-left:auto;display:flex;gap:20px;text-align:right;flex-wrap:wrap;justify-content:flex-end}
  .ps .n{font-size:17px;font-weight:800;line-height:1}.ps .l{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:3px}
  .prog{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:8px;min-width:120px}
  .prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-deep),var(--brand))}
  .prog.g>i{background:linear-gradient(90deg,#166534,#16a34a)}
  table{width:100%;border-collapse:collapse}
  th,td{padding:11px 13px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
  th{font-size:11px;color:var(--muted);font-weight:800;text-transform:none;background:var(--surface-2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;white-space:nowrap}
  .st-new{background:#eef2ff;color:#4f46e5}.st-contacting{background:#ecfeff;color:#0e7490}.st-interested{background:#f5f3ff;color:#7c3aed}
  .st-followup{background:#e0f2fe;color:#075985}.st-awaiting_payment{background:#fff7ed;color:#c2660c}.st-won{background:#dcfce7;color:#166534}.st-lost{background:#fef2f2;color:#b91c1c}
  .chn{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .chbox{border:1px solid var(--line);border-radius:14px;padding:15px 16px}
  .chbox .ch-top{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px}
  .chbox .ch-big{font-size:24px;font-weight:800;margin-top:10px}
  .chbox .ch-sub{font-size:12px;color:var(--muted);margin-top:3px}
  .empty{color:var(--muted);padding:26px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
  .btn{border:0;border-radius:11px;padding:10px 15px;font-size:13.5px;font-weight:800}
  .btn.p{background:var(--brand);color:#fff}.btn.g{background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
  .btn.ok{background:var(--ok);color:#fff}.btn:disabled{opacity:.5}
  .seg{display:flex;gap:0;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;width:fit-content}
  .seg button{border:0;background:var(--surface);padding:9px 15px;font-size:13px;font-weight:700;color:var(--muted)}
  .seg button.on{background:var(--brand);color:#fff}
  .inp{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit;background:var(--surface)}
  .fld{margin-bottom:13px}.fld label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}
  .poolbig{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:4px}
  .poolcard{flex:1;min-width:130px;border:1px solid var(--line);border-radius:13px;padding:14px 16px}
  .poolcard .n{font-size:26px;font-weight:800}.poolcard .l{font-size:12px;color:var(--muted);font-weight:700;margin-top:3px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;opacity:0;transition:.25s;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .dayoff-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.dayoff-row:last-child{border-bottom:0}
  .switch{margin-left:auto;display:flex;gap:7px}
  .miniprog{display:flex;align-items:center;gap:9px}
  @media(max-width:900px){.side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:.25s}.side.open{transform:none}.menuBtn{display:block}.hero{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.chn{grid-template-columns:1fr}.pstats{gap:14px}}
  @media(max-width:520px){.hero{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <div class="main">
    <div class="topbar">
      <button class="menuBtn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <h2 id="viewTitle">ภาพรวมทีม</h2><div class="spacer"></div>
      <a class="lo" href="#" onclick="logout(event)">ออกจากระบบ</a>
    </div>
    <div class="content" id="content"><div class="empty">กำลังโหลด…</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("th-TH");
const fmtB=n=>"฿"+fmt(Math.round(n||0));
let ME=null,VIEW="dash",RANGE="today";
let D={};  // last-loaded data cache

const NAV=[
  {lab:"ภาพรวม"},
  {k:"dash",ic:"📊",t:"ภาพรวมทีม"},
  {lab:"ผลงานทีม"},
  {k:"tele",ic:"📞",t:"KPI ทีมเซลล์"},
  {k:"admin",ic:"💬",t:"KPI ทีมแอดมิน"},
  {lab:"จัดการ"},
  {k:"dist",ic:"📤",t:"แจกรายชื่อ"},
  {k:"leave",ic:"🌴",t:"วันลา / วันหยุด"},
];
function renderNav(){
  $("#side").innerHTML=`<div class="brand">Evo · คอนโซลหัวหน้าทีม<small>${esc((ME&&ME.name)||"แอดมิน")}</small></div>`+
    NAV.map(it=>it.lab?`<div class="navlab">${it.lab}</div>`
      :`<button class="nav-i ${VIEW===it.k?"on":""}" onclick="go('${it.k}')"><span class="ic">${it.ic}</span><span>${it.t}</span></button>`).join("");
}
window.go=function(k){VIEW=k;$("#side").classList.remove("open");render();};
window.logout=function(e){e.preventDefault();fetch("/logout",{method:"POST"}).then(()=>location.href="/login");};

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2200);}
async function getJSON(u){const r=await fetch(u);if(r.status===401){location.href="/login";return null;}if(r.status===403){location.href="/sales";return null;}return r.json().catch(()=>({}));}
async function postJSON(u,b){const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});if(r.status===401){location.href="/login";return null;}return r.json().catch(()=>({}));}

// ---- date range ----
function rangeISO(){
  const now=new Date();const TZ=7*3600000;const th=new Date(now.getTime()+TZ);
  const y=th.getUTCFullYear(),m=th.getUTCMonth(),d=th.getUTCDate();
  const startToday=Date.UTC(y,m,d,0,0,0)-TZ, endToday=Date.UTC(y,m,d,23,59,59)-TZ;
  if(RANGE==="today")return{from:new Date(startToday).toISOString(),to:new Date(endToday).toISOString()};
  if(RANGE==="7")return{from:new Date(startToday-6*86400000).toISOString(),to:new Date(endToday).toISOString()};
  if(RANGE==="month"){const ms=Date.UTC(y,m,1,0,0,0)-TZ;return{from:new Date(ms).toISOString(),to:new Date(endToday).toISOString()};}
  return{from:new Date(startToday).toISOString(),to:new Date(endToday).toISOString()};
}
const RLABEL={today:"วันนี้","7":"7 วันล่าสุด",month:"เดือนนี้"};
function rangeBar(){
  return `<div class="rangebar">`+["today","7","month"].map(r=>`<button class="rbtn ${RANGE===r?"on":""}" onclick="setRange('${r}')">${RLABEL[r]}</button>`).join("")+
    `<span class="rlabel">ช่วง: ${RLABEL[RANGE]}</span></div>`;
}
window.setRange=function(r){RANGE=r;render();};

// ---- data loaders ----
async function loadCore(){
  const{from,to}=rangeISO();
  const q=`?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`;
  const[state,kpi,calls,chat,pool,dist]=await Promise.all([
    getJSON("/api/state"),getJSON("/api/admin/kpi"+q),getJSON("/api/admin/callstats"+q),
    getJSON("/api/admin/chat-kpi"+q),getJSON("/api/pool"),getJSON("/api/dist-stats"+q),
  ]);
  D={state,kpi,calls,chat,pool,dist};
  return D;
}

function teamTotals(kpi){
  const W=kpi.W||{},K=kpi.K||{};
  const sum=(a,b,f)=>(a[f]||0)+(b[f]||0);
  const todayRev=(arr)=>(arr||[]).reduce((s,x)=>s+(x.amount||0),0);
  return{
    total:sum(W,K,"total"),
    callsToday:sum(W,K,"callsToday"),
    wonToday:sum(W,K,"wonToday"),
    pending:sum(W,K,"pending"),
    revToday:todayRev(W.todaySales)+todayRev(K.todaySales),
    wonRange:sum(W,K,"wonRange"),revRange:sum(W,K,"revRange"),callsRange:sum(W,K,"callsRange"),
    talk7Today:sum(W,K,"talk7Today"),
    calledEvoToday:sum(W,K,"calledEvoToday"),calledManualToday:sum(W,K,"calledManualToday"),
  };
}

// ================= DASHBOARD =================
function viewDash(){
  const kpi=D.kpi||{},t=teamTotals(kpi);
  const targetsCallEvo=(kpi.targets&&kpi.targets.evo||50)*2, targetsCallFb=(kpi.targets&&kpi.targets.manual||15)*2;
  let h=rangeBar();
  h+=`<div class="hero">
    <div class="hcard rev"><div class="cap">💰 ยอดขายวันนี้ (ทีมเซลล์)</div><div class="big tnum">${fmtB(t.revToday)}</div><div class="sub">ปิดได้ ${t.wonToday} ราย</div><span class="tag">💰</span></div>
    <div class="hcard"><div class="cap">📞 โทรวันนี้</div><div class="big tnum">${fmt(t.callsToday)}</div><div class="sub">คุยจริง >7 วิ ${fmt(t.talk7Today)} สาย</div><span class="tag">📞</span></div>
    <div class="hcard"><div class="cap">✅ ปิดได้วันนี้</div><div class="big tnum" style="color:var(--ok)">${fmt(t.wonToday)}</div><div class="sub">ในช่วง ${RLABEL[RANGE]}: ${fmt(t.wonRange)} ราย</div><span class="tag">✅</span></div>
    <div class="hcard"><div class="cap">⏰ งานค้างวันนี้</div><div class="big tnum" style="color:var(--warn)">${fmt(t.pending)}</div><div class="sub">เลยนัด/ค้างเกินกำหนด</div><span class="tag">⏰</span></div>
  </div>`;

  // team telesales overview
  h+=`<div class="sec"><div class="sec-h">📞 ทีมเซลล์ (Telesales) <span class="mut">· ${RLABEL[RANGE]}</span></div><div class="card">`+
    personRow("W",kpi.W||{},kpi)+personRow("K",kpi.K||{},kpi)+`</div></div>`;

  // channel comparison
  h+=`<div class="sec"><div class="sec-h">🎯 เทียบช่องทาง (วันนี้)</div><div class="card pad"><div class="chn">
    ${chBox("📦","Marketplace",t.calledEvoToday,targetsCallEvo,"เป้าโทร "+targetsCallEvo+" ราย/วัน (ทั้งทีม)")}
    ${chBox("💬","Facebook (Pancake)",t.calledManualToday,targetsCallFb,"เป้าโทร "+targetsCallFb+" ราย/วัน · T1+T2+T3")}
  </div></div></div>`;

  // team admin overview (chat)
  h+=`<div class="sec"><div class="sec-h">💬 ทีมแอดมิน (ตอบแชท) <span class="mut">· ${RLABEL[RANGE]}</span></div>`+adminMini()+`</div>`;

  // pending list
  h+=pendingList();
  return h;
}
function chBox(ic,name,val,target,sub){
  const pct=target?Math.min(100,Math.round(val/target*100)):0;
  return `<div class="chbox"><div class="ch-top">${ic} ${name}</div><div class="ch-big tnum">${fmt(val)} <span style="font-size:14px;color:var(--muted);font-weight:700">/ ${fmt(target)}</span></div>
    <div class="prog ${pct>=100?"g":""}" style="margin-top:11px"><i style="width:${pct}%"></i></div><div class="ch-sub">${esc(sub)} · ${pct}%</div></div>`;
}
function personRow(side,A,kpi){
  const nm=side==="W"?"พี่หวาน (W)":"พี่เขม (K)";
  const tgtCall=(kpi.targets&&kpi.targets.evo||50)+(kpi.targets&&kpi.targets.manual||15);
  const callToday=A.callsToday||0;const pct=tgtCall?Math.min(100,Math.round(callToday/tgtCall*100)):0;
  const revToday=(A.todaySales||[]).reduce((s,x)=>s+(x.amount||0),0);
  return `<div class="prow"><div class="av ${side}">${side}</div>
    <div style="min-width:120px"><div class="pname">${nm}</div><div class="psub">ลูกค้าในมือ ${fmt(A.total)} ราย</div>
      <div class="miniprog"><div class="prog ${pct>=100?"g":""}"><i style="width:${pct}%"></i></div><span style="font-size:11px;color:var(--muted);font-weight:700">${callToday}/${tgtCall}</span></div></div>
    <div class="pstats">
      <div class="ps"><div class="n tnum">${fmt(callToday)}</div><div class="l">โทรวันนี้</div></div>
      <div class="ps"><div class="n tnum" style="color:var(--ok)">${fmt(A.wonToday||0)}</div><div class="l">ปิดวันนี้</div></div>
      <div class="ps"><div class="n tnum" style="color:var(--ok)">${fmtB(revToday)}</div><div class="l">ยอดวันนี้</div></div>
      <div class="ps"><div class="n tnum" style="color:var(--warn)">${fmt(A.pending||0)}</div><div class="l">งานค้าง</div></div>
    </div></div>`;
}
function adminMini(){
  const c=D.chat||{};const admins=(c.admins||[]).filter(a=>a);
  if(!admins.length)return `<div class="empty">ยังไม่ได้ตั้งค่าทีมแอดมิน (ตอบแชท) หรือยังไม่มีข้อมูลในช่วงนี้<br><span style="font-size:12px">ตั้งค่ารายชื่อแอดมินได้ที่ตัวแปร CHAT_USERS บน Railway</span></div>`;
  return `<div class="card">`+admins.map((a,i)=>`<div class="prow"><div class="av a${(i%4)+1}">${esc((a.name||"?").slice(0,1))}</div>
    <div style="min-width:110px"><div class="pname">${esc(a.name)}</div><div class="psub">ตอบแชท</div></div>
    <div class="pstats">
      <div class="ps"><div class="n tnum">${fmt(a.chats)}</div><div class="l">แชท</div></div>
      <div class="ps"><div class="n tnum">${fmt(a.replies)}</div><div class="l">ข้อความ</div></div>
      <div class="ps"><div class="n tnum">${a.avgRespSec!=null?a.avgRespSec+" วิ":"—"}</div><div class="l">ตอบเฉลี่ย</div></div>
      <div class="ps"><div class="n tnum" style="color:var(--ok)">${fmt(a.closed)}</div><div class="l">ปิดแชท</div></div>
    </div></div>`).join("")+`</div>`;
}
function pendingList(){
  const rows=(D._pending||[]);
  if(!rows.length)return "";
  return `<div class="sec"><div class="sec-h">⏰ งานค้างวันนี้ (ตัวอย่าง 12 รายแรก)</div><div class="card" style="overflow:auto"><table>
    <tr><th>ลูกค้า</th><th>เบอร์</th><th>เซลล์</th><th>สถานะ</th><th>นัด/อัปเดตล่าสุด</th></tr>
    ${rows.slice(0,12).map(r=>`<tr><td>${esc(r.name||"(ไม่มีชื่อ)")}</td><td class="mono">${esc(r.phone)}</td><td>${esc(r.sales)}</td>
      <td>${statusPill(r.leadStatus)}</td><td style="color:var(--muted)">${esc(r.when||"")}</td></tr>`).join("")}
  </table></div></div>`;
}
function statusPill(s){const L={new:"ใหม่",contacting:"กำลังติดต่อ",interested:"สนใจ",followup:"นัดติดตาม",awaiting_payment:"รอชำระเงิน",won:"ปิดสำเร็จ",lost:"ไม่สนใจ"};return `<span class="pill st-${s||"new"}">${L[s]||s||"ใหม่"}</span>`;}

// ================= TELESALES KPI =================
function viewTele(){
  const kpi=D.kpi||{},calls=D.calls||{},W=kpi.W||{},K=kpi.K||{};
  const sum=f=>(W[f]||0)+(K[f]||0);
  let h=rangeBar();
  // pipeline table
  const stKeys=[["new","ใหม่"],["contacting","กำลังติดต่อ"],["interested","สนใจ"],["followup","นัดติดตาม"],["awaiting_payment","รอชำระเงิน"],["won","ปิดสำเร็จ"],["lost","ไม่สนใจ"]];
  h+=`<div class="sec"><div class="sec-h">📊 ไปป์ไลน์ลูกค้า (ในมือตอนนี้)</div><div class="card" style="overflow:auto"><table>
    <tr><th>สถานะ</th><th class="num">พี่หวาน (W)</th><th class="num">พี่เขม (K)</th><th class="num">รวมทีม</th></tr>
    ${stKeys.map(([k,l])=>`<tr><td>${statusPill(k)} ${esc(l)}</td><td class="num">${fmt((W.status||{})[k]||0)}</td><td class="num">${fmt((K.status||{})[k]||0)}</td><td class="num"><b>${fmt(((W.status||{})[k]||0)+((K.status||{})[k]||0))}</b></td></tr>`).join("")}
    <tr style="background:var(--surface-2)"><td><b>ลูกค้าในมือรวม</b></td><td class="num"><b>${fmt(W.total)}</b></td><td class="num"><b>${fmt(K.total)}</b></td><td class="num"><b>${fmt(sum("total"))}</b></td></tr>
  </table></div></div>`;

  // performance matrix
  h+=`<div class="sec"><div class="sec-h">🎯 ผลงาน · ${RLABEL[RANGE]}</div><div class="card" style="overflow:auto"><table>
    <tr><th>ตัวชี้วัด</th><th class="num">พี่หวาน (W)</th><th class="num">พี่เขม (K)</th><th class="num">รวมทีม</th></tr>
    ${kpiRow("โทรออก (นับสาย)","callsRange",W,K)}
    ${kpiRow("คุยจริง >7 วินาที","talk7Range",W,K)}
    ${kpiRow("Marketplace (ราย)","calledEvoRange",W,K)}
    ${kpiRow("Facebook/FB (ราย)","calledManualRange",W,K)}
    ${kpiRow("ปิดการขาย","wonRange",W,K)}
    ${kpiRow("ไม่สนใจ (Lost)","lostRange",W,K)}
    <tr style="background:var(--surface-2)"><td><b>ยอดขาย</b></td><td class="num"><b>${fmtB(W.revRange)}</b></td><td class="num"><b>${fmtB(K.revRange)}</b></td><td class="num" style="color:var(--ok)"><b>${fmtB(sum("revRange"))}</b></td></tr>
  </table></div></div>`;

  // call quality (onecall)
  if(calls.summary){
    const s=calls.summary;
    h+=`<div class="sec"><div class="sec-h">☎️ คุณภาพการโทร (OneCall) <span class="mut">· ${calls.hasOnecall?"เชื่อมต่อแล้ว":"ยังไม่มีข้อมูล OneCall"}</span></div>
    <div class="card pad"><div class="chn">
      ${qualBox("พี่หวาน (W)",s.W)}${qualBox("พี่เขม (K)",s.K)}
    </div><div style="margin-top:14px" class="chn"><div></div>${qualBox("รวมทีม",s.team)}</div></div></div>`;
  }
  return h;
}
function kpiRow(label,field,W,K){
  return `<tr><td>${esc(label)}</td><td class="num">${fmt(W[field]||0)}</td><td class="num">${fmt(K[field]||0)}</td><td class="num"><b>${fmt((W[field]||0)+(K[field]||0))}</b></td></tr>`;
}
function qualBox(name,s){
  s=s||{};return `<div class="chbox"><div class="ch-top">${esc(name)}</div>
    <div class="pstats" style="margin:12px 0 0;justify-content:flex-start;gap:22px">
      <div class="ps"><div class="n tnum">${fmt(s.calls)}</div><div class="l">สายทั้งหมด</div></div>
      <div class="ps"><div class="n tnum" style="color:var(--ok)">${fmt(s.over7)}</div><div class="l">คุย >7 วิ</div></div>
      <div class="ps"><div class="n tnum">${fmt(s.avgSec)} วิ</div><div class="l">เฉลี่ย/สาย</div></div>
      <div class="ps"><div class="n tnum">${fmt(s.pct)}%</div><div class="l">อัตราคุยติด</div></div>
    </div></div>`;
}

// ================= TEAM ADMIN KPI =================
function viewAdmin(){
  const c=D.chat||{};const admins=(c.admins||[]).filter(a=>a);
  let h=rangeBar();
  if(!admins.length){h+=`<div class="empty">ยังไม่ได้ตั้งค่าทีมแอดมิน (ตอบแชท) หรือยังไม่มีข้อมูลในช่วง ${RLABEL[RANGE]}<br><span style="font-size:12px">เพิ่มรายชื่อแอดมินได้ที่ตัวแปร CHAT_USERS บน Railway แล้วข้อมูลจะขึ้นที่นี่</span></div>`;return h;}
  h+=`<div class="sec"><div class="sec-h">💬 ผลงานทีมแอดมิน (ตอบแชท FB) · ${RLABEL[RANGE]}</div><div class="card" style="overflow:auto"><table>
    <tr><th>แอดมิน</th><th class="num">จำนวนแชท</th><th class="num">ข้อความตอบ</th><th class="num">ตอบเฉลี่ย</th><th class="num">ปิดแชท</th></tr>
    ${admins.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td class="num">${fmt(a.chats)}</td><td class="num">${fmt(a.replies)}</td><td class="num">${a.avgRespSec!=null?a.avgRespSec+" วิ":"—"}</td><td class="num" style="color:var(--ok)"><b>${fmt(a.closed)}</b></td></tr>`).join("")}
  </table></div></div>
  <div class="empty" style="text-align:left;padding:14px 16px;font-size:12.5px">หมายเหตุ: ยอดขายรายแอดมิน (ปิดการขายผ่านแชท) จะแสดงได้เมื่อเชื่อม Pancake (ตั้งค่า PANCAKE_API_KEY) — อยู่ในแผนด่านถัดไป</div>`;
  return h;
}

// ================= DISTRIBUTE =================
let distSource="all",distMode="50",distSide="W";
function viewDist(){
  const pool=(D.pool&&D.pool.pool)||{mp:0,fb:0,total:0};
  const dist=D.dist||{};const dof=(D.pool&&D.pool.dayoff)||{};
  let h=rangeBar();
  h+=`<div class="sec"><div class="sec-h">📦 คลังรายชื่อ (รอแจก)</div><div class="card pad"><div class="poolbig">
    <div class="poolcard"><div class="n tnum">${fmt(pool.total)}</div><div class="l">รวมทั้งหมด</div></div>
    <div class="poolcard"><div class="n tnum" style="color:var(--brand)">${fmt(pool.mp)}</div><div class="l">📦 Marketplace</div></div>
    <div class="poolcard"><div class="n tnum" style="color:var(--violet)">${fmt(pool.fb)}</div><div class="l">💬 Facebook (Pancake)</div></div>
  </div>${pool.total===0?`<div style="font-size:12.5px;color:var(--muted);margin-top:12px">ยังไม่มีรายชื่อในคลัง — ดึงรายชื่อเข้าคลังก่อนจึงจะแจกได้</div>`:""}</div></div>`;

  h+=`<div class="sec"><div class="sec-h">📤 แจกรายชื่อให้เซลล์</div><div class="card pad">
    <div class="fld"><label>ช่องทางที่จะแจก</label><div class="seg">
      <button class="${distSource==="all"?"on":""}" onclick="setDist('source','all')">ทั้งหมด</button>
      <button class="${distSource==="mp"?"on":""}" onclick="setDist('source','mp')">📦 Marketplace</button>
      <button class="${distSource==="fb"?"on":""}" onclick="setDist('source','fb')">💬 Facebook</button>
    </div></div>
    <div class="fld"><label>วิธีแจก</label><div class="seg">
      <button class="${distMode==="50"?"on":""}" onclick="setDist('mode','50')">อัตโนมัติ (แบ่งเท่ากัน W/K)</button>
      <button class="${distMode==="one"?"on":""}" onclick="setDist('mode','one')">เลือกจำนวน → คนเดียว</button>
    </div></div>
    ${distMode==="one"?`<div class="fld"><label>แจกให้</label><div class="seg">
      <button class="${distSide==="W"?"on":""}" onclick="setDist('side','W')">พี่หวาน (W)</button>
      <button class="${distSide==="K"?"on":""}" onclick="setDist('side','K')">พี่เขม (K)</button>
    </div></div>`:""}
    <div class="fld"><label>จำนวน (เว้นว่าง = แจกทั้งหมดในช่องทางที่เลือก)</label><input class="inp" id="distCount" type="number" min="1" placeholder="เช่น 50" style="width:160px"></div>
    <button class="btn p" id="distBtn" onclick="doDistribute()">แจกรายชื่อ</button>
    <span id="distMsg" style="margin-left:12px;font-size:13px;color:var(--muted);font-weight:700"></span>
  </div></div>`;

  // dist report
  if(dist.distributed){
    h+=`<div class="sec"><div class="sec-h">📈 สรุปการแจก · ${RLABEL[RANGE]}</div><div class="card" style="overflow:auto"><table>
      <tr><th>รายการ</th><th class="num">Marketplace</th><th class="num">Facebook</th><th class="num">รวม</th></tr>
      <tr><td>ดึงเข้าคลัง</td><td class="num">${fmt(dist.pulled.mp)}</td><td class="num">${fmt(dist.pulled.fb)}</td><td class="num"><b>${fmt(dist.pulled.total)}</b></td></tr>
      <tr><td>แจกให้เซลล์</td><td class="num">${fmt(dist.distributed.mp)}</td><td class="num">${fmt(dist.distributed.fb)}</td><td class="num"><b>${fmt(dist.distributed.total)}</b></td></tr>
      <tr style="background:var(--surface-2)"><td><b>แยกตามเซลล์</b></td><td class="num" colspan="2">W: <b>${fmt(dist.distributed.W)}</b> · K: <b>${fmt(dist.distributed.K)}</b></td><td class="num"><b>${fmt(dist.distributed.total)}</b></td></tr>
    </table></div></div>`;
  }
  return h;
}
window.setDist=function(k,v){if(k==="source")distSource=v;if(k==="mode")distMode=v;if(k==="side")distSide=v;render();};
window.doDistribute=async function(){
  const pool=(D.pool&&D.pool.pool)||{total:0};
  if(!pool.total){toast("ยังไม่มีรายชื่อในคลัง");return;}
  const count=Number($("#distCount").value||0)||undefined;
  $("#distBtn").disabled=true;$("#distMsg").textContent="กำลังแจก…";
  const j=await postJSON("/api/distribute",{source:distSource,mode:distMode,side:distSide,count});
  if(j&&j.ok){const s=j.summary;toast(`แจกแล้ว ${s.distributed} ราย (W:${s.toW} · K:${s.toK})`);await load();render();}
  else{$("#distBtn").disabled=false;$("#distMsg").textContent=(j&&j.message)||"แจกไม่สำเร็จ";}
};

// ================= LEAVE =================
function viewLeave(){
  const lv=D.leave||{};const people=(lv.people||[]);const dof=(D.pool&&D.pool.dayoff)||{};
  const sales=people.filter(p=>p.kind==="sales");const admins=people.filter(p=>p.kind==="admin");
  let h=`<div class="sec"><div class="sec-h">🌴 วันลา / วันหยุด — ทีมเซลล์ <span class="mut">· เดือน ${esc(lv.month||"")}</span></div><div class="card pad">`;
  h+=sales.map(p=>{const off=!!dof[p.who];return `<div class="dayoff-row"><div class="av ${p.who}">${p.who}</div>
    <div><div class="pname">${esc(p.name)}</div><div class="psub">ลาเดือนนี้ ${fmt(p.monthCount)} วัน ${off?"· <b style='color:var(--warn)'>วันนี้ลา</b>":""}</div></div>
    <div class="switch"><button class="btn ${off?"g":"p"}" onclick="setDayoff('${p.who}',${off?"false":"true"})">${off?"ยกเลิกวันลา":"บันทึกลาวันนี้"}</button></div></div>`;}).join("");
  h+=`</div><div class="empty" style="text-align:left;padding:12px 15px;font-size:12.5px;margin-top:10px">เมื่อเซลล์ลา ระบบจะย้ายลูกค้าในมือไปให้อีกคนอัตโนมัติ และคืนกลับเมื่อยกเลิกวันลา · ต้องมีเซลล์ทำงานอย่างน้อย 1 คนเสมอ</div></div>`;
  if(admins.length){
    h+=`<div class="sec"><div class="sec-h">🌴 วันลา — ทีมแอดมิน (นับจำนวนอย่างเดียว)</div><div class="card" style="overflow:auto"><table>
      <tr><th>แอดมิน</th><th class="num">ลาเดือนนี้</th><th>วันนี้</th></tr>
      ${admins.map(p=>`<tr><td>${esc(p.name)}</td><td class="num">${fmt(p.monthCount)} วัน</td><td>${p.onToday?'<span class="pill st-lost">ลา</span>':'<span class="pill st-won">ทำงาน</span>'}</td></tr>`).join("")}
    </table></div></div>`;
  }
  return h;
}
window.setDayoff=async function(side,on){
  const j=await postJSON("/api/admin/dayoff",{side,off:on,type:"leave"});
  if(j&&j.ok){toast(on?`บันทึกวันลา ${side} แล้ว (ย้าย ${j.moved} ราย)`:`ยกเลิกวันลา ${side} แล้ว`);await load();render();}
  else toast((j&&j.message)||"ทำรายการไม่สำเร็จ");
};

// ================= RENDER =================
const TITLES={dash:"ภาพรวมทีม",tele:"KPI ทีมเซลล์",admin:"KPI ทีมแอดมิน",dist:"แจกรายชื่อ",leave:"วันลา / วันหยุด"};
async function load(){
  await loadCore();
  // pending list + leave summary (secondary)
  const[leads,leave]=await Promise.all([getJSON("/api/leads"),getJSON("/api/admin/leaves")]);
  D.leave=leave;
  // build pending rows from all leads (overdue-ish: followup past appt, or not won/lost & stale)
  const now=Date.now();const rows=[];
  for(const r of ((leads&&leads.active)||[])){
    const s=r.leadStatus||"new";if(s==="won"||s==="lost")continue;
    let overdue=false,when="";
    if(s==="followup"&&r.nextAppt){const t=Date.parse(r.nextAppt);if(!isNaN(t)){when="นัด "+new Date(t).toLocaleDateString("th-TH");if(t<now)overdue=true;}}
    if(!overdue){const la=Date.parse(r.lastActivity||r.updatedAt||0);if(la&&(now-la)>=3*86400000){overdue=true;when="เงียบ "+Math.floor((now-la)/86400000)+" วัน";}}
    if(overdue)rows.push({name:r.name,phone:r.phone,sales:r.sales,leadStatus:s,when});
  }
  rows.sort((a,b)=>0);
  D._pending=rows;
}
function render(){
  renderNav();$("#viewTitle").textContent=TITLES[VIEW]||"คอนโซล";
  let h="";
  if(VIEW==="dash")h=viewDash();
  else if(VIEW==="tele")h=viewTele();
  else if(VIEW==="admin")h=viewAdmin();
  else if(VIEW==="dist")h=viewDist();
  else if(VIEW==="leave")h=viewLeave();
  $("#content").innerHTML=h;
}
async function init(){
  const me=await getJSON("/api/me");if(!me)return;ME=me;
  if(me.role!=="admin"){location.href=(me.role==="adminsales"?"/distribute":(me.role==="chatadmin"?"/me":"/sales"));return;}
  renderNav();
  await load();render();
  setInterval(async()=>{await load();render();},60000);
}
// reload data when range changes: wrap render to reload core on range switch
const _render=render;
render=function(){_render();};
window.setRange=async function(r){RANGE=r;$("#content").innerHTML='<div class="empty">กำลังโหลด…</div>';await load();render();};
init();
</script>
