<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แชท — ตอบลูกค้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#2563eb;--brand-2:#3b82f6;--brand-deep:#1e3a8a;
    --grad:linear-gradient(135deg,#1e3a8a 0%,#2563eb 55%,#3b82f6 100%);
    --ink:#0f172a;--muted:#64748b;--line:#e6ecf5;--bg:#f4f7fc;
    --in:#fff;--out:#2563eb;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(30,58,138,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:"Noto Sans Thai","Tahoma",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#cbd6e6;border-radius:9px;border:2px solid transparent;background-clip:content-box}
  a{color:inherit;text-decoration:none}
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  .head{background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;box-shadow:0 8px 24px rgba(37,99,235,.20);z-index:20}
  .head h1{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:9px}
  .head .r{display:flex;align-items:center;gap:10px}
  .head .badge{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600}
  .head a.back{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:10px;padding:7px 13px;font-size:13.5px;font-weight:600}
  .head a.back:hover{background:rgba(255,255,255,.26)}
  .body{flex:1;display:flex;min-height:0}
  /* ---- left: conversation list ---- */
  .left{width:352px;flex:0 0 352px;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
  .pages{padding:10px 12px;border-bottom:1px solid var(--line)}
  .pages select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;font-weight:600;color:#0f172a;background:#f8fafc;outline:none;cursor:pointer}
  .pages select:focus{border-color:var(--brand-2);background:#fff}
  .pchip{flex:0 0 auto;border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:#334155;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s}
  .pchip .dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}
  .pchip.fb .dot{background:#1877f2}.pchip.line .dot{background:#06c755}.pchip.ig .dot{background:#e1306c}
  .pchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .pchip.on .dot{background:#fff}
  .pchip .cnt{background:#ef4444;color:#fff;border-radius:999px;font-size:11px;padding:0 6px;min-width:17px;text-align:center;line-height:16px;font-weight:700}
  .search{padding:10px 12px;border-bottom:1px solid var(--line)}
  .search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;background:#f8fafc;outline:none}
  .search input:focus{border-color:var(--brand-2);background:#fff}
  .clist{flex:1;overflow-y:auto;min-height:0}
  .citem{display:flex;gap:11px;padding:11px 13px;border-bottom:1px solid #f1f5f9;cursor:pointer;align-items:center;transition:background .12s}
  .citem:hover{background:#f6f9ff}
  .citem.on{background:#eaf2ff}
  .av{width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;position:relative}
  .av .pg{position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:50%;border:2px solid #fff;background:#94a3b8}
  .av .pg.fb{background:#1877f2}.av .pg.line{background:#06c755}.av .pg.ig{background:#e1306c}
  .ci-main{flex:1;min-width:0}
  .ci-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .ci-name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ci-time{font-size:11.5px;color:var(--muted);flex:0 0 auto}
  .ci-snip{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .citem.unread .ci-name{font-weight:700}
  .citem.unread .ci-snip{color:#0f172a;font-weight:500}
  .unreadDot{width:9px;height:9px;border-radius:50%;background:var(--brand);flex:0 0 auto}
  .ci-pg{font-size:11px;color:#94a3b8}
  /* ---- right: thread ---- */
  .right{flex:1;display:flex;flex-direction:column;min-width:0;background:#eef2f9;position:relative}
  .thead{background:#fff;border-bottom:1px solid var(--line);padding:11px 16px;display:flex;align-items:center;gap:12px;flex:0 0 auto}
  .thead .av{width:40px;height:40px;flex-basis:40px;font-size:15px}
  .thead .ti{flex:1;min-width:0}
  .thead .tn{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thead .tm{font-size:12.5px;color:var(--muted);margin-top:1px;display:flex;gap:10px;flex-wrap:wrap}
  .thead .tm b{color:#0f172a;font-weight:600}
  .thead .vip{background:#fef3c7;color:#b45309;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700}
  .msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:9px;min-height:0}
  .daysep{align-self:center;background:#dbe4f2;color:#475569;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 12px;margin:6px 0}
  .bubble{max-width:74%;padding:8px 12px;border-radius:15px;font-size:14.5px;line-height:1.42;word-wrap:break-word;white-space:pre-wrap;box-shadow:0 1px 1px rgba(16,24,40,.05)}
  .bubble.in{align-self:flex-start;background:var(--in);border-bottom-left-radius:5px;color:#0f172a}
  .bubble.out{align-self:flex-end;background:var(--out);border-bottom-right-radius:5px;color:#fff}
  .bubble img{max-width:220px;border-radius:10px;display:block;margin:3px 0;cursor:pointer}
  .bmeta{font-size:10.5px;color:var(--muted);margin-top:3px;padding:0 4px}
  .bmeta.out{align-self:flex-end}.bmeta.in{align-self:flex-start}
  .att-file{display:inline-block;background:rgba(0,0,0,.06);border-radius:8px;padding:5px 10px;font-size:13px;margin:2px 0}
  .out .att-file{background:rgba(255,255,255,.22);color:#fff}
  .reply{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);padding:11px 14px;display:flex;gap:10px;align-items:flex-end}
  .reply textarea{flex:1;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font:inherit;font-size:14.5px;resize:none;max-height:130px;outline:none;background:#f8fafc}
  .reply textarea:focus{border-color:var(--brand-2);background:#fff}
  .sendbtn{flex:0 0 auto;background:var(--brand);color:#fff;border:none;border-radius:50%;width:46px;height:46px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(37,99,235,.3);transition:.15s}
  .sendbtn:hover{background:#1d4ed8}
  .sendbtn:disabled{background:#cbd5e1;box-shadow:none;cursor:default}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;gap:12px;text-align:center;padding:24px}
  .empty svg{opacity:.5}
  .win{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12.5px;padding:7px 14px;text-align:center;flex:0 0 auto}
  .setup{max-width:640px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 28px;box-shadow:var(--shadow);line-height:1.65}
  .setup h2{margin:0 0 6px;font-size:19px}
  .setup code{background:#eef2f9;border-radius:6px;padding:2px 7px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
  .setup ol{padding-left:20px}.setup li{margin:9px 0}
  .setup .note{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:10px 14px;font-size:13.5px;color:#075985;margin-top:14px}
  .spin{width:22px;height:22px;border:3px solid #dbe4f2;border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading{flex:1;display:flex;align-items:center;justify-content:center}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:9px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .backMobile{display:none}
  @media(max-width:760px){
    .left{width:100%;flex-basis:100%}
    .right{display:none}
    .body.thread .left{display:none}
    .body.thread .right{display:flex}
    .backMobile{display:inline-flex}
    /* show every page — wrap instead of clipping off the right edge */
    .pages{flex-wrap:wrap;overflow-x:visible;max-height:30vh;overflow-y:auto;gap:6px}
    .pchip{padding:6px 11px;font-size:12.5px}
  }
  /* ---- admin add-ons: status/notes, templates, reply log ---- */
  .hbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .hbtn:hover{background:rgba(255,255,255,.26)}
  .metabar{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;flex:0 0 auto}
  .metabar .lbl{font-size:11.5px;color:#94a3b8;font-weight:700;margin-right:2px}
  .toolbtn{background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:700;color:#334155;cursor:pointer;display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;white-space:nowrap}
  .toolbtn:hover{background:#f6f9ff;border-color:#c7d5ea}
  .toolpanel{position:absolute;top:0;right:0;bottom:0;width:310px;max-width:86%;background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.10);transform:translateX(100%);transition:transform .22s ease;z-index:25;display:flex;flex-direction:column}
  .toolpanel.open{transform:translateX(0)}
  .tp-h{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;flex:0 0 auto}
  .tp-x{background:none;border:none;font-size:24px;color:#94a3b8;cursor:pointer;line-height:1}
  .tp-body{padding:6px 16px 16px;overflow-y:auto;flex:1}
  .tp-sec{font-size:12px;color:#94a3b8;font-weight:700;margin:16px 0 8px}
  .tp-cust{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.7}
  .tp-cust .nm{font-weight:700;font-size:14.5px}
  .tp-status{display:flex;flex-wrap:wrap;gap:7px}
  .tp-note{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:13.5px;background:#f8fafc;resize:vertical;min-height:90px;outline:none}
  .tp-note:focus{border-color:var(--brand-2);background:#fff}
  .gist{background:#fffbeb;border-bottom:1px solid #fde68a;color:#92400e;padding:7px 14px;font-size:12.5px;flex:0 0 auto;display:flex;gap:7px;align-items:baseline}
  .gist b{color:#b45309;font-weight:700;flex:0 0 auto}
  .gist span{color:#78350f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stchip{border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:#475569;cursor:pointer;transition:.12s}
  .stchip:hover{border-color:#c7d5ea}
  .stchip.on{color:#fff;border-color:transparent}
  .notebtn{margin-left:auto;font-size:12.5px;color:#2563eb;font-weight:700;cursor:pointer;background:none;border:none;display:inline-flex;align-items:center;gap:4px}
  .notewrap{width:100%;margin-top:7px;display:none}
  .notewrap.show{display:block}
  .notewrap textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font:inherit;font-size:13.5px;background:#f8fafc;resize:vertical;min-height:44px;outline:none}
  .notewrap textarea:focus{border-color:var(--brand-2);background:#fff}
  .ci-st{font-size:10px;font-weight:700;border-radius:5px;padding:1px 6px;margin-left:6px;color:#fff;vertical-align:middle;white-space:nowrap}
  .composer{flex:0 0 auto;background:#fff;border-top:1px solid var(--line)}
  .tplbar{display:flex;gap:7px;overflow-x:auto;padding:9px 14px 2px}
  .tpl{flex:0 0 auto;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid #dbe4f2;background:#f0f6ff;color:#1d4ed8;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500;cursor:pointer;transition:.12s}
  .tpl:hover{background:#dbeafe}
  .tpl.mng{background:#f1f5f9;color:#475569;border-color:var(--line);font-weight:700}
  .composer .reply{border-top:0}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
  .modal.show{display:flex}
  .modal .box{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal .mh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal .mh h3{margin:0;font-size:16px}
  .modal .mh .x{cursor:pointer;font-size:24px;color:#94a3b8;line-height:1;background:none;border:none}
  .modal .mb{padding:14px 18px;overflow-y:auto}
  .modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
  .btn{border:none;border-radius:10px;padding:9px 16px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
  .btn.pri{background:var(--brand);color:#fff}.btn.sec{background:#eef2f9;color:#334155}
  .tplrow{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
  .tplrow textarea{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:inherit;font-size:13.5px;background:#f8fafc;resize:vertical;min-height:38px;outline:none}
  .tplrow .del{flex:0 0 auto;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;padding:8px 11px;font-size:12.5px;cursor:pointer;font-weight:700}
  .logitem{border-bottom:1px solid #f1f5f9;padding:10px 2px}
  .logitem .lt{font-size:11.5px;color:#94a3b8;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:3px}
  .logitem .lt b{color:#334155}
  .logitem .lmsg{font-size:13.5px;color:#0f172a;white-space:pre-wrap;word-break:break-word}
  .filterbar{display:flex;gap:6px;padding:8px 12px 6px;border-bottom:1px solid var(--line);overflow-x:auto;flex-wrap:nowrap}
  .fchip{flex:0 0 auto;border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:#475569;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:.12s}
  .fchip:hover{border-color:#c7d5ea}
  .fchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .fchip .fc{background:#e2e8f0;color:#475569;border-radius:999px;font-size:10.5px;padding:0 6px;min-width:16px;text-align:center;font-weight:700}
  .fchip.on .fc{background:rgba(255,255,255,.28);color:#fff}
  .fchip.wait{border-color:#fecaca}.fchip.wait.on{background:#ef4444;border-color:#ef4444}
  .waitTag{font-size:10px;font-weight:700;background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:5px;padding:1px 6px;margin-left:6px;white-space:nowrap}
  .copybtn{background:#eef2f9;border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:11.5px;font-weight:700;color:#334155;cursor:pointer;margin-left:6px}
  .copybtn:hover{background:#e2e8f0}
  .claimTag{font-size:10px;font-weight:700;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;border-radius:5px;padding:1px 6px;margin-left:6px;white-space:nowrap}
  .fbwin{padding:6px 14px;font-size:12px;flex:0 0 auto;text-align:center;background:#eff6ff;color:#1e40af;border-bottom:1px solid #bfdbfe}
  .fbwin.warn{background:#fffbeb;color:#92400e;border-bottom-color:#fde68a}
  .fbwin.over{background:#fef2f2;color:#b91c1c;border-bottom-color:#fecaca}
  .claimbtn{width:100%;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:10px;padding:9px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .claimbtn:hover{background:#dbeafe}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1>
      <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>
      แชทลูกค้า
    </h1>
    <div class="r">
      <span class="badge" id="totBadge">—</span>
      <button class="hbtn" onclick="openMyKpi()" title="ภาพรวม KPI ของฉัน เดือนนี้">📊 KPI ของฉัน</button>
      <button class="hbtn" onclick="openLog()" title="ประวัติการตอบแชท">📋 ประวัติการตอบ</button>
      <a class="back" href="/">← กลับ</a>
    </div>
  </div>
  <div class="body" id="bodyWrap">
    <div class="left">
      <div class="pages" id="pages"></div>
      <div class="search"><input id="q" placeholder="ค้นหาชื่อ / เบอร์ / ข้อความ…" autocomplete="off"></div>
      <div class="filterbar" id="filterBar"></div>
      <div class="clist" id="clist"><div class="loading"><div class="spin"></div></div></div>
    </div>
    <div class="right" id="right">
      <div class="empty" id="emptyPane">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <div>เลือกบทสนทนาทางซ้ายเพื่อเริ่มตอบลูกค้า</div>
      </div>
    </div>
  </div>
</div>
<div class="modal" id="tplModal"><div class="box">
  <div class="mh"><h3>จัดการข้อความสำเร็จรูป</h3><button class="x" onclick="closeTpl()">×</button></div>
  <div class="mb" id="tplEdit"></div>
  <div class="mf"><button class="btn sec" onclick="addTplRow()">+ เพิ่มข้อความ</button><button class="btn pri" onclick="saveTpls()">บันทึก</button></div>
</div></div>
<div class="modal" id="logModal"><div class="box">
  <div class="mh"><h3>ประวัติการตอบแชท <span id="logCount" style="font-size:12px;color:#94a3b8;font-weight:400"></span></h3><button class="x" onclick="closeLog()">×</button></div>
  <div class="mb" id="logBody"><div class="loading"><div class="spin"></div></div></div>
</div></div>
<div class="modal" id="kpiModal"><div class="box">
  <div class="mh"><h3>📊 KPI ของฉัน — เดือนนี้</h3><button class="x" onclick="closeMyKpi()">×</button></div>
  <div class="mb" id="kpiBody"><div class="loading"><div class="spin"></div></div></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const $=(s,r)=>(r||document).querySelector(s);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PAGES=[], CUR_PAGE='', CONVS=[], OPEN=null, POLL_C=null, POLL_M=null, SENDING=false, TPLS=[], STATUSES=[], CUR_META={status:'',note:''}, CUR_MSGS=[], FILTER='all', LAST_UNREPLIED=-1, SOUND_ON=true;
const isUnreplied=(c)=>!c.lastByPage;

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);}
function plat(p){p=(p||'').toLowerCase();if(p.includes('face')||p.includes('fb'))return'fb';if(p.includes('line'))return'line';if(p.includes('insta')||p.includes('ig'))return'ig';return'';}
function shortName(n){n=String(n||'');let s=n.split(/\s[-–—]\s/)[0].replace(/\s*\(.*$/,'').trim();s=s.replace(/^Yanhee\s+/i,'');if(s.length>16)s=s.slice(0,16).trim()+'…';return s||n;}
function initial(n){n=(n||'').trim();return n?n[0].toUpperCase():'?';}
// Pancake ส่งเวลาแบบ UTC แต่ไม่มี timezone (เช่น 2026-08-08T05:47:46) → ต้องตีเป็น UTC แล้วแปลงเป็นเวลาไทย (+7) เอง
function _ms(iso){if(!iso)return NaN;let s=String(iso).trim();if(!/([Zz]|[+-]\d\d:?\d\d)$/.test(s)){s=s.replace(' ','T')+'Z';}return Date.parse(s);}
function _thd(iso){const t=_ms(iso);if(isNaN(t))return null;return new Date(t+7*3600000);} // อ่านค่าด้วย getUTC* = เวลาไทย
function thTime(iso){const d=_thd(iso);if(!d)return'';const now=_thd(new Date().toISOString());const p=x=>String(x).padStart(2,'0');const sd=d.getUTCFullYear()===now.getUTCFullYear()&&d.getUTCMonth()===now.getUTCMonth()&&d.getUTCDate()===now.getUTCDate();if(sd)return p(d.getUTCHours())+':'+p(d.getUTCMinutes());const y=new Date(now.getTime()-86400000);if(d.getUTCFullYear()===y.getUTCFullYear()&&d.getUTCMonth()===y.getUTCMonth()&&d.getUTCDate()===y.getUTCDate())return'เมื่อวาน';return p(d.getUTCDate())+'/'+p(d.getUTCMonth()+1);}
function thDayLabel(iso){const d=_thd(iso);if(!d)return'';const m=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];return d.getUTCDate()+' '+m[d.getUTCMonth()]+' '+(d.getUTCFullYear()+543);}

async function jget(u){const r=await fetch(u,{credentials:'same-origin'});if(r.status===401){location.href='/login';return null;}return r.json().catch(()=>null);}
async function jpost(u,b){const r=await fetch(u,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});return r.json().catch(()=>null);}

async function loadPages(){
  const j=await jget('/api/chat/pages');
  if(!j)return;
  if(!j.configured){renderSetup();return;}
  const t=await jget('/api/chat/templates');if(t){TPLS=t.templates||[];STATUSES=t.statuses||[];}
  PAGES=j.pages||[];
  renderPages();
  await loadConvs(true);
  startPolling();
}

}

async function loadConvs(showSpin){
  if(showSpin)$('#clist').innerHTML='<div class="loading"><div class="spin"></div></div>';
  const u='/api/chat/conversations'+(CUR_PAGE?('?page_id='+encodeURIComponent(CUR_PAGE)):'');
  const j=await jget(u);
  if(!j)return;
  CONVS=j.conversations||[];
  renderFilterBar();
  renderConvs();
  const tot=CONVS.length, un=CONVS.filter(c=>!c.seen).length, wait=CONVS.filter(isUnreplied).length;
  $('#totBadge').textContent=tot+' แชท'+(un?(' · '+un+' ใหม่'):'');
  document.title=(wait?('('+wait+') '):'')+'แชท — ตอบลูกค้า';
  if(LAST_UNREPLIED>=0&&wait>LAST_UNREPLIED&&SOUND_ON)beep();
  LAST_UNREPLIED=wait;
}
function filterConvs(){
  const q=($('#q').value||'').trim().toLowerCase();
  let list=CONVS;
  if(FILTER==='wait')list=list.filter(isUnreplied);
  else if(FILTER==='interested')list=list.filter(c=>c.status==='interested');
  else if(FILTER==='closed')list=list.filter(c=>c.status==='closed');
  if(q)list=list.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.phone||'').includes(q)||(c.snippet||'').toLowerCase().includes(q));
  return list;
}
function renderFilterBar(){
  const el=$('#filterBar');if(!el)return;
  const wait=CONVS.filter(isUnreplied).length;
  const interested=CONVS.filter(c=>c.status==='interested').length;
  const closed=CONVS.filter(c=>c.status==='closed').length;
  const chips=[['all','ทั้งหมด',CONVS.length,''],['wait','⏳ ยังไม่ตอบ',wait,'wait'],['interested','สนใจ',interested,''],['closed','ปิดได้',closed,'']];
  el.innerHTML=chips.map(a=>'<button class="fchip '+a[3]+(FILTER===a[0]?' on':'')+'" onclick="setFilter(\''+a[0]+'\')">'+a[1]+'<span class="fc">'+a[2]+'</span></button>').join('');
}
function setFilter(f){FILTER=f;renderFilterBar();renderConvs();}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(0.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(0.15,c.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.25);o.start();o.stop(c.currentTime+0.26);}catch(e){}}
function copyText(t){try{navigator.clipboard.writeText(String(t));toast('คัดลอกแล้ว');}catch(e){toast('คัดลอกไม่ได้');}}
function renderConvs(){
  const list=filterConvs();
  const el=$('#clist');
  if(!list.length){el.innerHTML='<div class="empty" style="padding:40px 20px"><div>ยังไม่มีบทสนทนา</div></div>';return;}
  let h='';
  for(const c of list){
    const pc=plat(c.platform);
    h+='<div class="citem '+(!c.seen?'unread':'')+' '+(OPEN&&OPEN.id===c.id&&OPEN.pageId===c.pageId?'on':'')+'" data-id="'+esc(c.id)+'" data-pg="'+esc(c.pageId)+'">'+
      '<div class="av">'+esc(initial(c.name))+'<span class="pg '+pc+'"></span></div>'+
      '<div class="ci-main"><div class="ci-top"><span class="ci-name">'+esc(c.name)+'</span>'+stTag(c.status)+(isUnreplied(c)?'<span class="waitTag">รอตอบ</span>':'')+(c.claimedBy?'<span class="claimTag">🙋'+esc(String(c.claimedBy).split(/\s+/)[0])+'</span>':'')+'<span class="ci-time" style="margin-left:auto">'+esc(thTime(c.updatedAt))+'</span></div>'+
      '<div class="ci-snip">'+(c.lastByPage?'<span style="color:#94a3b8">คุณ: </span>':'')+esc(c.snippet||(c.phone?('📞 '+c.phone):'[รูป/ไฟล์]'))+'</div>'+
      '<div class="ci-pg">'+esc(c.pageName)+(c.phone?(' · '+esc(c.phone)):'')+'</div></div>'+
      (!c.seen?'<div class="unreadDot"></div>':'')+
      '</div>';
  }
  el.innerHTML=h;
  el.querySelectorAll('.citem').forEach(it=>it.onclick=()=>openConv(it.dataset.pg,it.dataset.id));
}

async function openConv(pageId,id){
  const c=CONVS.find(x=>x.id===id&&x.pageId===pageId);
  if(!c)return;
  OPEN={id,pageId,conv:c};
  CUR_META={status:c.status||'',note:'',amount:''};
  renderConvs();
  $('#bodyWrap').classList.add('thread');
  renderThreadShell(c);
  loadMeta(pageId,id);
  await loadMsgs(true);
  // mark read locally + server
  if(!c.seen){c.seen=true;jpost('/api/chat/read',{page_id:pageId,conversation_id:id});}
  clearInterval(POLL_M);POLL_M=setInterval(()=>loadMsgs(false),8000);
}

async function loadMsgs(showSpin){
  if(!OPEN)return;
  const cur=OPEN;
  const j=await jget('/api/chat/messages?page_id='+encodeURIComponent(cur.pageId)+'&conversation_id='+encodeURIComponent(cur.id));
  if(!j||!OPEN||OPEN.id!==cur.id)return;
  CUR_MSGS=j.messages||[];
  renderMsgs(CUR_MSGS,showSpin);
  renderGist();
  renderWindow();
  if(j.customer){
    const cu=j.customer;const tm=$('#tmeta');if(tm){
      let h='<span>'+esc(cur.conv.pageName)+'</span>';
      if(cu.phone)h+='<span>📞 <b>'+esc(cu.phone)+'</b></span>';
      if(cu.orders)h+='<span>ซื้อ <b>'+cu.orders+'</b> ครั้ง</span>';
      if(cu.ltv)h+='<span>ยอดรวม <b>฿'+Number(cu.ltv).toLocaleString()+'</b></span>';
      if((cu.ltv>=8000)||(cu.succeed>=6))h+='<span class="vip">VIP</span>';
      tm.innerHTML=h;
    }
    const tc=$('#tpCust');if(tc){
      let ch='<div class="nm">'+esc(cu.name||cur.conv.name)+'</div>';
      if(cu.phone)ch+='<div>📞 '+esc(cu.phone)+'<button class="copybtn" onclick="copyText(\''+esc(cu.phone)+'\')">คัดลอก</button></div>';
      if(cu.orders)ch+='<div>ซื้อแล้ว <b>'+cu.orders+'</b> ครั้ง'+(cu.succeed?(' · สำเร็จ '+cu.succeed):'')+'</div>';
      if(cu.ltv)ch+='<div>ยอดรวม <b>฿'+Number(cu.ltv).toLocaleString()+'</b></div>';
      if((cu.ltv>=8000)||(cu.succeed>=6))ch+='<div style="margin-top:3px"><span class="vip">VIP</span></div>';
      ch+='<div style="color:#94a3b8;font-size:12.5px;margin-top:3px">'+esc(cur.conv.pageName)+'</div>';
      tc.innerHTML=ch;
    }
  }
  if(j.canInbox===false)$('#winNote')&&($('#winNote').style.display='block');
}
function renderMsgs(msgs,force){
  const el=$('#msgs');if(!el)return;
  const near=el.scrollHeight-el.scrollTop-el.clientHeight<140;
  let h='',lastDay='';
  for(const m of msgs){
    const day=m.at?new Date(m.at).toDateString():'';
    if(day&&day!==lastDay){h+='<div class="daysep">'+esc(thDayLabel(m.at))+'</div>';lastDay=day;}
    let inner='';
    for(const a of (m.atts||[])){
      const t=(a.type||'').toLowerCase();
      if(t.includes('photo')||t.includes('image')||t.includes('sticker')||t.includes('gif')||(a.mime||'').startsWith('image'))inner+='<img src="'+esc(a.url)+'"'+(t.includes('sticker')?' style="max-width:120px"':'')+' onclick="window.open(this.src)">';
      else inner+='<a class="att-file" href="'+esc(a.url)+'" target="_blank">📎 '+esc(t||'ไฟล์')+'</a>';
    }
    if(m.text)inner+=esc(m.text);
    if(!inner)inner='<span style="opacity:.6">[ไม่มีข้อความ]</span>';
    h+='<div class="bubble '+m.dir+'">'+inner+'</div>';
    h+='<div class="bmeta '+m.dir+'">'+(m.dir==='out'&&m.fromName?esc(m.fromName)+' · ':'')+esc(thTime(m.at))+'</div>';
  }
  el.innerHTML=h||'<div class="empty"><div>ยังไม่มีข้อความ</div></div>';
  if(near||force)el.scrollTop=el.scrollHeight;
}
// snippet ช่วยจำ (ฟรี ไม่ใช้ AI): ดึงข้อความแรกที่ลูกค้าทักมา ให้เห็นว่าแชทนี้เริ่มคุยเรื่องอะไร
function renderGist(){
  const el=$('#chatGist');if(!el)return;
  let first='';
  for(const m of CUR_MSGS){ if(m.dir==='in'&&m.text&&m.text.trim()){ first=m.text.trim(); break; } }
  if(!first){el.style.display='none';return;}
  el.innerHTML='<b>💬 ลูกค้าเริ่มถาม:</b><span title="'+esc(first)+'">'+esc(first)+'</span>';
  el.style.display='flex';
}

async function doSend(){
  if(SENDING||!OPEN)return;
  const rt=$('#rt');const txt=(rt.value||'').trim();if(!txt)return;
  SENDING=true;$('#sb').disabled=true;
  const cur=OPEN;
  // optimistic bubble
  const el=$('#msgs');
  if(el){el.insertAdjacentHTML('beforeend','<div class="bubble out" style="opacity:.55">'+esc(txt)+'</div><div class="bmeta out">กำลังส่ง…</div>');el.scrollTop=el.scrollHeight;}
  rt.value='';rt.style.height='auto';
  const _last=CUR_MSGS[CUR_MSGS.length-1];const _inAt=(_last&&_last.dir==='in')?_last.at:null; // ตอบตรงข้อความลูกค้า → วัดเวลาตอบ
  const j=await jpost('/api/chat/send',{page_id:cur.pageId,conversation_id:cur.id,message:txt,page_name:cur.conv.pageName,cust_name:cur.conv.name,in_at:_inAt});
  SENDING=false;$('#sb').disabled=false;
  if(j&&j.ok){await loadMsgs(false);loadConvs(false);}
  else{toast('ส่งไม่สำเร็จ: '+((j&&j.error)||'error'));rt.value=txt;await loadMsgs(false);}
}

function stTag(k){const m=stMeta(k);return m?'<span class="ci-st" style="background:'+m.color+'">'+esc(m.label)+'</span>':'';}

function toggleTools(){const p=$('#toolPanel');if(p)p.classList.toggle('open');}

}
async function claimChat(v){ if(!OPEN)return; CUR_META.claimedBy=v?((ME&&ME.name)||'ฉัน'):''; renderMeta(); const conv=CONVS.find(x=>x.id===OPEN.id&&x.pageId===OPEN.pageId); if(conv)conv.claimedBy=CUR_META.claimedBy; renderConvs(); await jpost('/api/chat/meta',{conversation_id:OPEN.id,claim:v}); toast(v?'รับผิดชอบแชทนี้แล้ว':'ปล่อยแชทแล้ว'); }
function renderWindow(){
  const el=$('#fbwin');if(!el)return;
  let lastIn=null; for(let i=CUR_MSGS.length-1;i>=0;i--){ if(CUR_MSGS[i].dir==='in'&&CUR_MSGS[i].at){ lastIn=CUR_MSGS[i].at; break; } }
  if(!lastIn){el.style.display='none';return;}
  const left=_ms(lastIn)+24*3600000-Date.now();
  if(left<=0){ el.style.display='block'; el.className='fbwin over'; el.innerHTML='⛔ เลย 24 ชม.แล้ว — ตอบข้อความปกติไม่ได้ (ต้องใช้ข้อความที่ FB อนุญาต)'; return; }
  const hh=Math.floor(left/3600000), mm=Math.floor((left%3600000)/60000);
  el.style.display='block'; el.className='fbwin'+(left<3*3600000?' warn':'');
  el.innerHTML='⏳ ตอบฟรีได้อีก <b>'+hh+' ชม '+mm+' นาที</b> (หน้าต่าง 24 ชม. ของ FB)';
}
async function saveAmount(){ if(!OPEN)return; const el=$('#closeAmt'); if(!el)return; let v=parseFloat(el.value); if(!isFinite(v)||v<0)v=0; CUR_META.amount=v; await jpost('/api/chat/meta',{conversation_id:OPEN.id,amount:v}); toast('บันทึกยอด ฿'+v.toLocaleString()); }
async function setStatus(k){
  if(!OPEN)return;
  const nk=CUR_META.status===k?'':k;
  CUR_META.status=nk;renderMeta();
  const conv=CONVS.find(x=>x.id===OPEN.id&&x.pageId===OPEN.pageId);if(conv)conv.status=nk;renderConvs();
  await jpost('/api/chat/meta',{conversation_id:OPEN.id,status:nk});
}
function toggleNote(){const w=$('#notewrap');if(!w)return;w.classList.toggle('show');const t=$('#noteta');if(w.classList.contains('show')&&t)t.focus();}
async function saveNote(){
  if(!OPEN)return;const t=$('#noteta');if(!t)return;const v=t.value;
  if(v===CUR_META.note)return;CUR_META.note=v;
  await jpost('/api/chat/meta',{conversation_id:OPEN.id,note:v});toast('บันทึกโน้ตแล้ว');
}
// ---- quick-reply templates ----
function renderTpls(){
  const el=$('#tplbar');if(!el)return;let h='';
  for(const t of TPLS)h+='<div class="tpl" title="'+esc(t.text)+'" onclick="insertTpl(\''+esc(t.id)+'\')">'+esc(t.text)+'</div>';
  h+='<div class="tpl mng" onclick="openTpl()">⚙ จัดการ</div>';
  el.innerHTML=h;
}
function insertTpl(id){
  const t=TPLS.find(x=>x.id===id);if(!t)return;const rt=$('#rt');if(!rt)return;
  const nm=(OPEN&&OPEN.conv&&OPEN.conv.name)?String(OPEN.conv.name).split(/\s+/)[0]:'';
  const txt=t.text.replace(/\{ชื่อ\}|\{name\}/g,nm||'ลูกค้า'); // เติมชื่อลูกค้าอัตโนมัติ
  rt.value=(rt.value?rt.value+' ':'')+txt;rt.focus();rt.dispatchEvent(new Event('input'));
}
function openTpl(){
  let h='';TPLS.forEach(t=>{h+='<div class="tplrow"><textarea>'+esc(t.text)+'</textarea><button class="del" onclick="this.parentNode.remove()">ลบ</button></div>';});
  $('#tplEdit').innerHTML=h||'<div style="color:#94a3b8;font-size:13px">ยังไม่มีข้อความ กด "เพิ่มข้อความ"</div>';
  $('#tplModal').classList.add('show');
}
function closeTpl(){$('#tplModal').classList.remove('show');}
function addTplRow(){$('#tplEdit').insertAdjacentHTML('beforeend','<div class="tplrow"><textarea placeholder="พิมพ์ข้อความสำเร็จรูป…"></textarea><button class="del" onclick="this.parentNode.remove()">ลบ</button></div>');const rows=$('#tplEdit').querySelectorAll('textarea');if(rows.length)rows[rows.length-1].focus();}
async function saveTpls(){
  const texts=[...$('#tplEdit').querySelectorAll('textarea')].map(t=>t.value.trim()).filter(Boolean);
  const j=await jpost('/api/chat/templates',{templates:texts.map((t,i)=>({id:'t'+(i+1),text:t}))});
  if(j&&j.ok){TPLS=j.templates||[];renderTpls();closeTpl();toast('บันทึกข้อความสำเร็จรูปแล้ว');}else toast('บันทึกไม่สำเร็จ');
}
// ---- reply log ----
function fullTime(iso){const d=_thd(iso);if(!d)return'';const p=x=>String(x).padStart(2,'0');return p(d.getUTCDate())+'/'+p(d.getUTCMonth()+1)+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes());}
async function openLog(){
  $('#logModal').classList.add('show');
  $('#logBody').innerHTML='<div class="loading"><div class="spin"></div></div>';
  const j=await jget('/api/chat/log?limit=300');
  if(!j){$('#logBody').innerHTML='<div style="color:#b91c1c">โหลดไม่สำเร็จ</div>';return;}
  $('#logCount').textContent='('+(j.total||0)+' ครั้ง)';
  const log=j.log||[];
  if(!log.length){$('#logBody').innerHTML='<div style="color:#94a3b8;font-size:13.5px;padding:10px 0">ยังไม่มีประวัติการตอบ</div>';return;}
  let h='';
  for(const e of log)h+='<div class="logitem"><div class="lt"><b>'+esc(e.by||'แอดมิน')+'</b><span>'+esc(fullTime(e.at))+'</span>'+(e.custName?'<span>→ '+esc(e.custName)+'</span>':'')+(e.pageName?'<span>· '+esc(e.pageName)+'</span>':'')+'</div><div class="lmsg">'+esc(e.message)+'</div></div>';
  $('#logBody').innerHTML=h;
}
function closeLog(){$('#logModal').classList.remove('show');}
window.setStatus=setStatus;window.toggleNote=toggleNote;window.toggleTools=toggleTools;window.saveNote=saveNote;window.saveAmount=saveAmount;window.insertTpl=insertTpl;window.openTpl=openTpl;window.closeTpl=closeTpl;window.addTplRow=addTplRow;window.saveTpls=saveTpls;window.openLog=openLog;window.closeLog=closeLog;window.setFilter=setFilter;window.copyText=copyText;window.claimChat=claimChat;
document.addEventListener('keydown',(e)=>{ if(!OPEN)return; if(e.altKey&&!e.ctrlKey&&!e.metaKey&&e.key>='1'&&e.key<='9'){ const idx=parseInt(e.key,10)-1; if(TPLS[idx]){ e.preventDefault(); insertTpl(TPLS[idx].id); } } });
function startPolling(){clearInterval(POLL_C);POLL_C=setInterval(()=>loadConvs(false),15000);}
$('#q').addEventListener('input',renderConvs);
window.closeThread=closeThread;
let ME=null;
async function initMe(){
  ME=await jget('/api/me');
  if(!ME)return;
  const r=document.querySelector('.head .r');
  if(ME.name&&r){const s=document.createElement('span');s.className='badge';s.textContent='👤 '+ME.name;r.insertBefore(s,r.firstChild);}
  if(ME.role==='chatadmin'){const back=document.querySelector('.head a.back');if(back){back.textContent='ออกจากระบบ';back.removeAttribute('href');back.style.cursor='pointer';back.onclick=()=>{const f=document.createElement('form');f.method='POST';f.action='/logout';document.body.appendChild(f);f.submit();};}}
  loadMyStats();
}
function loadMyStats(){
  if(!ME||!ME.name)return;
  jget('/api/chat/log?limit=500').then(j=>{
    if(!j||!j.log)return;
    const today=new Date().toDateString();
    const chats=new Set();
    for(const e of j.log){ if(e.by!==ME.name)continue; if(new Date(e.at).toDateString()!==today)continue; if(e.convId)chats.add(e.convId); }
    const r=document.querySelector('.head .r'); if(!r)return;
    let s=document.getElementById('myStat'); if(!s){s=document.createElement('span');s.className='badge';s.id='myStat';r.insertBefore(s,r.firstChild);}
    s.textContent='📊 วันนี้ตอบ '+chats.size+' แชท';
  });
}
function closeMyKpi(){const m=document.getElementById('kpiModal');if(m)m.classList.remove('show');}
async function openMyKpi(){
  const m=document.getElementById('kpiModal'),box=document.getElementById('kpiBody');
  if(m)m.classList.add('show');
  if(box)box.innerHTML='<div class="loading"><div class="spin"></div></div><div style="text-align:center;color:#94a3b8;font-size:12.5px;margin-top:8px">กำลังรวมยอดทั้งเดือน อาจใช้เวลาสักครู่…</div>';
  let j=null; try{ j=await jget('/api/chat/my-kpi'); }catch(_){}
  if(!box)return;
  if(!j||!j.ok){box.innerHTML='<div style="padding:18px;color:#ef4444">โหลดข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง</div>';return;}
  const baht=n=>'฿'+(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:0});
  const tgt=j.target||200000, rev=j.rev||0, left=Math.max(0,tgt-rev), pct=tgt?Math.min(100,Math.round(rev/tgt*100)):0;
  const barCol=pct>=100?'#16a34a':(pct>=60?'#2563eb':'#f59e0b');
  const tot=j.chatsTotal||0, ans=j.chatsAnswered||0, closed=j.closed||0;
  const tile=(n,l,c)=>`<div style="flex:1;min-width:120px;background:#0f172a;border:1px solid #1e293b;border-radius:13px;padding:13px 15px"><div style="font-size:25px;font-weight:800;color:${c||'#e2e8f0'};line-height:1.1">${n}</div><div style="font-size:12px;color:#94a3b8;margin-top:3px">${l}</div></div>`;
  box.innerHTML=`
    <div style="font-size:13px;color:#94a3b8;margin-bottom:12px">${esc(j.name||'')} · เดือน ${esc(j.month||'')}</div>
    <div style="background:linear-gradient(135deg,#0b1220,#0e1a14);border:1px solid #1e293b;border-radius:15px;padding:16px 18px;margin-bottom:13px">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:9px">
        <div><div style="font-size:12px;color:#94a3b8;font-weight:700">🎯 เป้ายอดขายเดือนนี้</div>
          <div style="font-size:27px;font-weight:800;color:#f1f5f9;line-height:1.15">${baht(rev)} <span style="font-size:14px;color:#94a3b8;font-weight:700">/ ${baht(tgt)}</span></div></div>
        <div style="text-align:right"><div style="font-size:12px;color:#94a3b8;font-weight:700">ขาดอีก</div>
          <div style="font-size:20px;font-weight:800;color:${left>0?'#fbbf24':'#4ade80'}">${left>0?baht(left):'ถึงเป้าแล้ว ✓'}</div></div>
      </div>
      <div style="height:12px;background:#1e293b;border-radius:8px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${barCol};transition:width .4s"></div></div>
      <div style="font-size:11.5px;color:#94a3b8;margin-top:6px;font-weight:700">${pct}% ของเป้า</div>
    </div>
    <div style="display:flex;gap:11px;flex-wrap:wrap;margin-bottom:8px">
      ${tile(ans,'ตอบแชทเดือนนี้ (แชท)','#60a5fa')}
      ${tile(tot,'ลูกค้าทักทั้งหมด (แชท)','#e2e8f0')}
      ${tile(closed,'ปิดการขายจากแชท (ออเดอร์)','#4ade80')}
    </div>
    <div style="background:#0b1220;border:1px solid #1e293b;border-radius:11px;padding:11px 13px;font-size:12.5px;color:#cbd5e1;font-weight:600">ตอบไปแล้ว ${ans} แชท จากที่ลูกค้าทักเข้ามาทั้งหมด ${tot} แชท เดือนนี้ · ปิดการขายได้ ${closed} ออเดอร์</div>
    <div style="font-size:11px;color:#64748b;margin-top:10px">* ยอดขาย/ปิดการขาย ดึงจาก Pancake (ออเดอร์ที่คุณเป็นผู้ปิด) · จำนวนแชทนับจากคนที่ตอบล่าสุดเป็นคุณ</div>`;
}
window.openMyKpi=openMyKpi;window.closeMyKpi=closeMyKpi;
initMe();
loadPages();
</script>
