<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — แบ่งลูกค้า W/K</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--brand:#2563eb;--brand-2:#3b82f6;--brand-deep:#1e3a8a;--grad:linear-gradient(135deg,#1e3a8a 0%,#2563eb 55%,#3b82f6 100%);--line:#e6ecf5}
  *{box-sizing:border-box}
  body{margin:0;font-family:"IBM Plex Sans Thai","Sarabun","Tahoma",system-ui,sans-serif;color:#0f172a;background:radial-gradient(1000px 500px at 50% -120px,#cddffb,transparent),#eef3fb;display:flex;min-height:100vh;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  button{transition:transform .12s ease,box-shadow .18s ease}button:active{transform:translateY(1px)}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 48px rgba(30,58,138,.14);padding:34px 30px 30px;width:350px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--grad)}
  .logo{width:52px;height:52px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:16px;box-shadow:0 8px 20px rgba(37,99,235,.28)}
  h1{font-size:19px;margin:0 0 4px;color:var(--brand-deep);font-weight:800}
  p{font-size:13px;color:#64748b;margin:0 0 22px}
  label{font-size:13px;font-weight:600;display:block;margin-bottom:6px;color:#334155}
  input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-family:inherit;font-size:14px;margin-bottom:14px}
  input:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  button{width:100%;background:var(--grad);color:#fff;border:0;border-radius:11px;padding:12px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(37,99,235,.24)}
  .err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:9px;padding:8px 10px;font-size:12.5px;margin-bottom:14px;display:none}
</style>
</head>
<body>
  <form class="card" method="POST" action="/login">
    <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6a1 1 0 0 1 1 1v1h1a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1z"/><path d="M9 4h6"/></svg></div>
    <h1>แบ่งรายชื่อลูกค้าให้เซลล์</h1>
    <p>สำหรับแอดมิน — เข้าสู่ระบบเพื่อจัดการ Sales(W)/Sales(K)</p>
    <div class="err" id="err">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>
    <label>ชื่อผู้ใช้</label>
    <input name="username" autocomplete="username" required>
    <label>รหัสผ่าน</label>
    <input name="password" type="password" autocomplete="current-password" required>
    <button type="submit">เข้าสู่ระบบ</button>
  </form>
  <script>if(location.search.indexOf('e')>=0||document.referrer.indexOf('/login')>=0){}</script>
</body>
</html>
