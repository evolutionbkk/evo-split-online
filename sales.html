<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>งานของฉัน — เซลล์</title>
<style>
  :root{--w:#1f6f3b;--k:#b45309;--ink:#111827;--muted:#6b7280;--line:#e6e8ec;--bg:#f3f5f8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Sarabun","Tahoma",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:16px}
  .wrap{max-width:760px;margin:0 auto;padding:12px 12px 90px}
  .head{position:sticky;top:0;z-index:10;border-radius:0 0 14px 14px;padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center;margin:-12px -12px 12px}
  .head.w{background:var(--w)}.head.k{background:var(--k)}
  .head h1{margin:0;font-size:18px}.head .lo{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:9px;padding:8px 13px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer}
  .switch{font-size:12.5px;color:var(--muted);margin:0 2px 10px}.switch a{color:inherit;text-decoration:underline;cursor:pointer}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
  .chip{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:8px 14px;font-size:13.5px;cursor:pointer;white-space:nowrap;font-weight:600}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip b{opacity:.75;font-weight:700;margin-left:2px}
  .search input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-family:inherit;font-size:15px;margin-bottom:12px;background:#fff}
  .lead{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.03)}
  .lead:active{background:#fbfcfd}
  .lead .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .lead .nm{font-weight:700;font-size:16.5px;line-height:1.25}
  .lead a.tel{display:inline-flex;align-items:center;gap:5px;background:#e6f6ee;color:#0b6b39;font-weight:700;font-size:15px;text-decoration:none;padding:7px 12px;border-radius:10px;white-space:nowrap}
  .lead.k a.tel{background:#fdf0e3;color:#9a4a08}
  .lead .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
  .badge{font-size:12px;padding:3px 9px;border-radius:20px;font-weight:600}
  .b-new{background:#eef2ff;color:#3730a3}.b-un{background:#fef2f2;color:#b42318}.b-nr{background:#fff7ed;color:#9a3412}
  .b-ap{background:#e0f2fe;color:#075985}.b-cl{background:#dcfce7;color:#166534}.b-reached{background:#e0f2fe;color:#075985}
  .b-calls{background:#f5f3ff;color:#6d28d9}.b-line{background:#e7f9ee;color:#15803d}.b-arch{background:#f1f3f5;color:#6b7280}
  .meta{font-size:12px;color:var(--muted);margin-top:8px}
  .empty{text-align:center;color:var(--muted);padding:30px;background:#fff;border:1px dashed var(--line);border-radius:14px}
  .mbg{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;justify-content:flex-end;z-index:40}
  .mbg.on{display:flex}
  .sheet{background:#fff;width:440px;max-width:100%;height:100vh;overflow:auto;padding:16px 18px 34px;box-shadow:-10px 0 34px rgba(0,0,0,.16);position:relative;animation:slideIn .2s ease}
  @keyframes slideIn{from{transform:translateX(30px);opacity:.4}to{transform:translateX(0);opacity:1}}
  @media(max-width:520px){.sheet{width:100%}}
  .closeX{position:absolute;top:12px;right:14px;background:#f1f3f5;border:0;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;color:#374151;line-height:1;z-index:2}
  .sheet h3{margin:0 0 2px;font-size:19px;padding-right:40px}
  .sheet .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .dialbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#0b6b39;color:#fff;text-decoration:none;font-weight:700;font-size:16px;border-radius:12px;padding:14px;margin-bottom:16px}
  .sec{font-size:13px;color:var(--muted);font-weight:700;margin:0 0 8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .out{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 10px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;justify-content:center;text-align:center}
  .out .em{font-size:18px}
  .out.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .out.cl.sel{border-color:#16a34a;box-shadow:inset 0 0 0 1px #16a34a;background:#f0fdf4}
  .out.ap.sel{border-color:#0284c7;box-shadow:inset 0 0 0 1px #0284c7;background:#f0f9ff}
  .out.un.sel{border-color:#dc2626;box-shadow:inset 0 0 0 1px #dc2626;background:#fef2f2}
  .apptbox{margin-top:10px;background:#f0f9ff;border:1px solid #cde8fa;border-radius:12px;padding:12px}
  .apptbox input{width:100%;border:1px solid #b9dcf3;border-radius:9px;padding:11px;font-family:inherit;font-size:15px;margin-bottom:10px}
  .row2{display:flex;gap:9px}
  .lineseg{display:flex;gap:9px;margin:14px 0}
  .lineseg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:12px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
  .lineseg button.on{border-color:#15803d;background:#f0fdf4;color:#15803d}
  .noteToggle{color:#0b6b39;font-weight:600;font-size:14px;cursor:pointer;display:inline-block;margin:2px 0 12px}
  textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;font-family:inherit;font-size:15px;resize:vertical}
  .act{font-family:inherit;font-weight:700;border:0;border-radius:11px;padding:13px;cursor:pointer;font-size:15px}
  .b-save{background:#166534;color:#fff}.b-cancel{background:#eef1f5;color:var(--ink)}.b-restore{background:#0e7490;color:#fff;width:100%}
  .rm{margin-top:16px;border-top:1px solid #f0f2f5;padding-top:14px}
  .rm .grid button{border:1px solid #f0c2c2;background:#fff;color:#b42318;border-radius:11px;padding:12px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:60;font-weight:600}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="head" id="head"><h1 id="title">งานของฉัน</h1><form method="POST" action="/logout"><button class="lo">ออกจากระบบ</button></form></div>
  <div class="switch" id="switch"></div>
  <div class="chips" id="chips"></div>
  <div class="search"><input type="text" id="search" placeholder="🔎 ค้นหา ชื่อ / เบอร์ / รหัส…" oninput="render()"></div>
  <div id="list"></div>
</div>
<div class="mbg" id="mbg" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const OUT=[
  {k:'closed',label:'ปิดการขาย',em:'✅',cls:'cl',patch:{contact:'reached',reachStatus:'closed'}},
  {k:'appointment',label:'นัดหมาย',em:'📅',cls:'ap'},
  {k:'not_ready',label:'ยังไม่พร้อม',em:'⏳',cls:'nr',patch:{contact:'reached',reachStatus:'not_ready'}},
  {k:'r:ไม่รับสาย',label:'ไม่รับสาย',em:'📵',cls:'un',patch:{contact:'unreachable',unreachableReason:'ไม่รับสาย',reachStatus:''}},
  {k:'r:ปิดเครื่อง',label:'ปิดเครื่อง',em:'🔕',cls:'un',patch:{contact:'unreachable',unreachableReason:'ปิดเครื่อง',reachStatus:''}},
  {k:'r:ไม่สะดวกคุย',label:'ไม่สะดวกคุย',em:'🙅',cls:'un',patch:{contact:'unreachable',unreachableReason:'ไม่สะดวกคุย',reachStatus:''}},
  {k:'r:พบช่องทางอื่นที่ถูกกว่า',label:'เจอที่ถูกกว่า',em:'💸',cls:'un',patch:{contact:'unreachable',unreachableReason:'พบช่องทางอื่นที่ถูกกว่า',reachStatus:''}},
  {k:'r:สะดวกสั่งซื้อช่องทางอื่น',label:'ซื้อช่องอื่น',em:'🛒',cls:'un',patch:{contact:'unreachable',unreachableReason:'สะดวกสั่งซื้อช่องทางอื่น',reachStatus:''}},
];
let ME={role:'',side:''},ACTIVE=[],ARCHIVED=[],FILTER='all',CURLIST=[],CUR=null;
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1600);}
function apptFmt(v){if(!v)return'';try{const d=new Date(v),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes()+'').padStart(2,'0');}catch(e){return'';}}
function curKey(r){if(r.contact==='unreachable'&&r.unreachableReason)return 'r:'+r.unreachableReason;if(r.reachStatus)return r.reachStatus;if(r.contact==='reached')return 'reached';return '';}
function advToast(adv){
  if(!adv)return false;
  if(adv.action==='transferred'){toast('🔁 ครบ 3 รอบ — ส่งต่อให้ '+adv.to+' อัตโนมัติ');return true;}
  if(adv.action==='recycled_out'){toast('🗑 ครบ 2 มือ — ย้ายไปถังคัดออกถาวร');return true;}
  return false;
}
function statusOf(r){
  if(r.archived){const t=r.archiveReason==='recycled_out'?'🗑 คัดออกถาวร (วนครบ)':(r.archiveReason==='unreachable'?'นำออก (เบอร์ติดต่อไม่ได้)':'นำออก (ข้อมูลเสีย)');return{cls:'b-arch',txt:t};}
  if(r.contact==='unreachable')return{cls:'b-un',txt:'✕ '+(r.unreachableReason||'ติดต่อไม่ได้')};
  if(r.reachStatus==='closed')return{cls:'b-cl',txt:'✅ ปิดการขาย'};
  if(r.reachStatus==='appointment')return{cls:'b-ap',txt:'📅 นัด '+apptFmt(r.nextAppt)};
  if(r.reachStatus==='not_ready')return{cls:'b-nr',txt:'⏳ ยังไม่พร้อม'};
  if(r.contact==='reached')return{cls:'b-reached',txt:'☎ ติดต่อได้'};
  return{cls:'b-new',txt:'● ยังไม่ติดต่อ'};
}
function pass(r,f){
  switch(f){
    case 'all':return !r.archived;
    case 'todo':return !r.archived&&(!r.contact||r.reachStatus==='appointment');
    case 'appointment':return !r.archived&&r.reachStatus==='appointment';
    case 'closed':return !r.archived&&r.reachStatus==='closed';
    case 'unreachable':return !r.archived&&r.contact==='unreachable';
    case 'line_not':return !r.archived&&r.line!=='added';
    case 'archived':return r.archived;
    default:return !r.archived;
  }
}
function cnt(f){const pool=f==='archived'?ARCHIVED:ACTIVE;return pool.filter(r=>pass(r,f)).length;}
function renderChips(){
  const defs=[['todo','🔥 ต้องติดต่อ'],['all','ทั้งหมด'],['appointment','📅 นัดหมาย'],['closed','✅ ปิดการขาย'],['unreachable','✕ ติดต่อไม่ได้'],['line_not','ยังไม่แอดไลน์'],['archived','🗑 นำออกแล้ว']];
  document.getElementById('chips').innerHTML=defs.map(([f,l])=>`<div class="chip ${FILTER===f?'on':''}" onclick="setFilter('${f}')">${l}<b>${cnt(f)}</b></div>`).join('');
}
function setFilter(f){FILTER=f;render();}
const q=()=>(document.getElementById('search').value||'').trim().toLowerCase();
function ms(r){const s=q();if(!s)return true;return[r.code,r.name,r.phone].some(v=>String(v==null?'':v).toLowerCase().includes(s));}
function rank(r){if(!r.contact)return 0;if(r.reachStatus==='appointment')return 1;if(r.reachStatus==='not_ready')return 2;if(r.contact==='reached')return 3;if(r.reachStatus==='closed')return 4;if(r.contact==='unreachable')return 5;return 6;}
function render(){
  renderChips();
  const pool=FILTER==='archived'?ARCHIVED:ACTIVE;
  let list=pool.filter(r=>pass(r,FILTER)&&ms(r));
  if(FILTER!=='archived')list=list.slice().sort((a,b)=>rank(a)-rank(b));
  CURLIST=list;
  const box=document.getElementById('list');
  if(!list.length){box.innerHTML='<div class="empty">ไม่มีรายชื่อในหมวดนี้ 👍</div>';return;}
  const kc=ME.side==='K'?'k':'';
  box.innerHTML=list.map((r,i)=>{
    const st=statusOf(r);
    const prog=r.archived?'':`<span class="badge b-calls">ติดตาม ${Math.min(r.callCount||0,3)}/3</span>`;
    const hand=(!r.archived&&r.stage>0)?'<span class="badge" style="background:#fef9c3;color:#854d0e">🔁 มือ 2</span>':'';
    const line=(!r.archived&&r.line==='added')?'<span class="badge b-line">ไลน์ ✓</span>':'';
    const stale=(!r.archived&&r.lastActivity)?(()=>{const d=Math.floor((Date.now()-Date.parse(r.lastActivity))/86400000);return d>=3?`<span class="badge" style="background:#fef2f2;color:#b91c1c">⏳ ค้าง ${d} วัน</span>`:'';})():'';
    return `<div class="lead ${kc}" onclick="openLead(${i})">
      <div class="top"><div class="nm">${esc(r.name)||'(ไม่มีชื่อ)'}</div>
        <a class="tel" href="tel:${esc(r.phone)}" onclick="logCall(${i},event)">📞 ${esc(r.phone)}</a></div>
      <div class="badges"><span class="badge ${st.cls}">${esc(st.txt)}</span>${prog}${hand}${stale}${line}</div>
      <div class="meta">${esc(r.code)}${r.note?' · 📝 '+esc(r.note.slice(0,42)):''}</div>
    </div>`;
  }).join('');
}
async function api(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});if(r.status===401){location.href='/login';return null;}return r.json().catch(()=>({}));}
function logCall(i,ev){ev&&ev.stopPropagation();const r=CURLIST[i];if(!r)return;api('/api/lead/call',{key:r.key}).then(j=>{if(!(j&&advToast(j.advanced)))toast('บันทึกการโทรแล้ว');reload();});/* ไม่ preventDefault ให้ tel: โทรออกได้ */}
function openLead(i){
  const r=CURLIST[i];if(!r)return;CUR=JSON.parse(JSON.stringify(r));
  const s=document.getElementById('sheet');
  if(r.archived){
    s.innerHTML=`<button class="closeX" onclick="closeSheet()">✕</button><h3>${esc(r.name)||'(ไม่มีชื่อ)'}</h3><div class="sub">${esc(r.code)} · ${esc(r.phone)} · Sales (${esc(r.sales)})</div>
      <div class="badge b-arch" style="display:inline-block;margin-bottom:14px">อยู่ในถังนำออก (${r.archiveReason==='unreachable'?'เบอร์ติดต่อไม่ได้':'ข้อมูลเสีย'})</div>
      <button class="act b-restore" onclick="doRestore()">↩ กู้คืนกลับรายชื่อ</button>`;
    document.getElementById('mbg').classList.add('on');return;
  }
  const ck=curKey(r);
  const outHtml=OUT.map(o=>`<button class="out ${o.cls} ${ck===o.k?'sel':''}" onclick="tapOut('${o.k}')"><span class="em">${o.em}</span>${o.label}</button>`).join('');
  s.innerHTML=`<button class="closeX" onclick="closeSheet()">✕</button>
    <h3>${esc(r.name)||'(ไม่มีชื่อ)'}</h3>
    <div class="sub">${esc(r.code)} · Sales (${esc(r.sales)}) · ติดตาม ${Math.min(r.callCount||0,3)}/3 รอบ · มือที่ ${(r.stage||0)+1}/2</div>
    <a class="dialbtn" href="tel:${esc(r.phone)}" onclick="sheetCall(event)">📞 โทรออก ${esc(r.phone)}</a>
    <div class="sec">ผลการโทร (แตะปุ่มเดียว บันทึกทันที)</div>
    <div class="grid">${outHtml}</div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:8px">ℹ️ ครบ 3 รอบยังไม่ปิด = ส่งต่ออีกฝั่งอัตโนมัติ · ถ้ามือที่ 2 ครบ 3 รอบอีก = คัดออกถาวร (แอดมินกู้ได้)</div>
    <div id="apptbox"></div>
    <div class="sec" style="margin-top:16px">สถานะไลน์</div>
    <div class="lineseg"><button class="${r.line==='added'?'on':''}" onclick="tapLine('added')">✅ แอดไลน์แล้ว</button><button class="${r.line==='not_added'?'on':''}" onclick="tapLine('not_added')">ยังไม่แอดไลน์</button></div>
    <span class="noteToggle" onclick="toggleNote()">📝 ${r.note?'แก้โน้ต':'เพิ่มโน้ต'}</span>
    <div id="notebox" style="display:${r.note?'block':'none'}">
      <textarea id="note" rows="2" placeholder="โน้ต…">${esc(r.note)}</textarea>
      <button class="act b-save" style="width:100%;margin-top:8px" onclick="saveNote()">บันทึกโน้ต</button>
    </div>
    <div style="margin-top:16px;border-top:1px solid #f0f2f5;padding-top:14px">
      <button class="act" style="width:100%;background:#fff7ed;color:#9a3412;border:1px solid #fdba74" onclick="doAdvance()">${(r.stage||0)===0?('🔁 ส่งต่อให้ '+(r.sales==='W'?'K':'W')+' เลย (ไม่รอครบ 3 รอบ)'):'🗑 คัดออกถาวรเลย'}</button>
    </div>
    <div class="rm"><div class="sec">นำออก (ย้ายไปถัง กู้คืนได้)</div>
      <div class="grid"><button onclick="doArchive('unreachable')">🗑 เบอร์ติดต่อไม่ได้</button><button onclick="doArchive('bad_data')">🗑 ข้อมูลไม่ครบ/เสีย</button></div></div>`;
  document.getElementById('mbg').classList.add('on');
}
function sheetCall(ev){ if(!CUR)return; api('/api/lead/call',{key:CUR.key}).then(j=>{ if(j&&advToast(j.advanced)){closeSheet();} else toast('บันทึกการโทรแล้ว'); reload();}); }
function closeSheet(){document.getElementById('mbg').classList.remove('on');CUR=null;}
async function tapOut(k){
  if(!CUR)return;
  const o=OUT.find(x=>x.k===k);if(!o)return;
  if(k==='appointment'){ showAppt(); return; }
  const j=await api('/api/lead/update',{key:CUR.key,patch:o.patch});
  if(j&&j.ok){ if(!advToast(j.advanced)) toast('บันทึกแล้ว: '+o.label); closeSheet(); reload(); }
}
function showAppt(){
  const box=document.getElementById('apptbox');
  let val=''; try{ const base=CUR.nextAppt?new Date(CUR.nextAppt):(()=>{const d=new Date();d.setDate(d.getDate()+1);d.setHours(10,0,0,0);return d;})(); const p=n=>String(n).padStart(2,'0'); val=base.getFullYear()+'-'+p(base.getMonth()+1)+'-'+p(base.getDate())+'T'+p(base.getHours())+':'+p(base.getMinutes()); }catch(e){}
  box.innerHTML=`<div class="apptbox"><div style="font-weight:600;margin-bottom:8px">📅 เลือกวัน-เวลานัดครั้งถัดไป</div><input type="datetime-local" id="appt" value="${val}"><div class="row2"><button class="act b-cancel" style="flex:1" onclick="document.getElementById('apptbox').innerHTML=''">ยกเลิก</button><button class="act b-save" style="flex:2" onclick="saveAppt()">ยืนยันนัดหมาย</button></div></div>`;
  box.scrollIntoView({behavior:'smooth',block:'center'});
}
async function saveAppt(){
  if(!CUR)return; const v=document.getElementById('appt').value;
  const iso=v?new Date(v).toISOString():'';
  const j=await api('/api/lead/update',{key:CUR.key,patch:{contact:'reached',reachStatus:'appointment',nextAppt:iso}});
  if(j&&j.ok){ toast('บันทึกนัดหมายแล้ว'); closeSheet(); reload(); }
}
async function tapLine(v){
  if(!CUR)return; const nv=CUR.line===v?'':v; CUR.line=nv;
  const j=await api('/api/lead/update',{key:CUR.key,patch:{line:nv}});
  if(j&&j.ok){ toast(nv==='added'?'ทำเครื่องหมายแอดไลน์แล้ว':(nv==='not_added'?'ยังไม่แอดไลน์':'ล้างสถานะไลน์')); reload();
    document.querySelectorAll('.lineseg button').forEach((b,i)=>b.className=((i===0&&nv==='added')||(i===1&&nv==='not_added'))?'on':''); }
}
function toggleNote(){const n=document.getElementById('notebox');n.style.display=n.style.display==='none'?'block':'none';}
async function saveNote(){ if(!CUR)return; const t=document.getElementById('note').value; const j=await api('/api/lead/update',{key:CUR.key,patch:{note:t}}); if(j&&j.ok){toast('บันทึกโน้ตแล้ว');reload();} }
async function doArchive(reason){ if(!CUR)return; if(!confirm('ย้ายไปถัง "นำออกแล้ว"? (กู้คืนได้)'))return; const j=await api('/api/lead/archive',{key:CUR.key,reason}); if(j&&j.ok){toast('นำออกแล้ว');closeSheet();reload();} }
async function doRestore(){ if(!CUR)return; const j=await api('/api/lead/restore',{key:CUR.key}); if(j&&j.ok){toast('กู้คืนแล้ว');closeSheet();reload();} }
async function doAdvance(){
  if(!CUR)return;
  const isTransfer=(CUR.stage||0)===0; const other=CUR.sales==='W'?'K':'W';
  if(!confirm(isTransfer?('ส่งต่อลูกค้ารายนี้ให้ '+other+' เลยใช่ไหม? (เริ่มนับรอบใหม่)'):'คัดลูกค้ารายนี้ออกถาวรเลยใช่ไหม? (แอดมินกู้คืนได้)'))return;
  const j=await api('/api/lead/advance',{key:CUR.key});
  if(j&&j.ok){ if(!advToast(j.advanced)) toast('ดำเนินการแล้ว'); closeSheet(); reload(); }
}
async function reload(){
  const url='/api/leads'+(ME.role==='admin'&&ME.side?('?side='+ME.side):'');
  const r=await fetch(url); if(r.status===401){location.href='/login';return;} const j=await r.json();
  ACTIVE=j.active||[]; ARCHIVED=j.archived||[]; render();
}
async function init(){
  const r=await fetch('/api/me'); if(r.status===401){location.href='/login';return;} ME=await r.json();
  let side=ME.side;
  if(ME.role==='admin'){ const u=new URLSearchParams(location.search).get('side'); side=(u==='K'?'K':'W'); ME.side=side;
    document.getElementById('switch').innerHTML='โหมดแอดมิน · ดูฝั่ง: <a onclick="location.search=\'?side=W\'">W</a> | <a onclick="location.search=\'?side=K\'">K</a> · <a href="/">กลับหน้าแอดมิน</a>'; }
  document.getElementById('head').classList.add((side||'w').toLowerCase());
  document.getElementById('title').textContent='งานของฉัน — Sales ('+(side||'?')+')';
  await reload();
}
init();
setInterval(()=>{ if(!document.getElementById('mbg').classList.contains('on')) reload(); }, 30000);
</script>
