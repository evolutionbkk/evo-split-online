<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>งานของฉัน — เซลล์</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0f172a;--muted:#64748b;--line:#e6ecf3;--brand:#2563eb;--brand-deep:#1e3a8a;
    --violet:#7c3aed;--cyan:#0e7490;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--bg:#eef2f8;--surface:#fff;--surface-2:#f7f9fc;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(30,41,59,.06);--shadow-lg:0 12px 40px rgba(15,23,42,.18)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,monospace}.tnum{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  .app{display:flex;min-height:100vh}
  .side{width:222px;flex:0 0 auto;background:#0f172a;color:#cbd5e1;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{color:#fff;font-weight:800;font-size:14px;padding:6px 10px 12px;border-bottom:1px solid #1e293b;margin-bottom:8px;line-height:1.3}
  .brand small{display:block;color:#64748b;font-weight:600;font-size:11px;margin-top:3px}
  .navlab{font-size:10px;font-weight:800;color:#64748b;letter-spacing:.6px;padding:11px 10px 4px}
  .nav-i{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;font-size:13px;font-weight:700;color:#cbd5e1;background:transparent;border:0;width:100%;text-align:left}
  .nav-i:hover{background:rgba(255,255,255,.06);color:#fff}.nav-i.on{background:var(--brand);color:#fff}
  .nav-i .ic{width:17px;text-align:center}.nav-i .badge{margin-left:auto;background:#db2777;color:#fff;font-size:11px;border-radius:8px;padding:1px 7px;font-weight:800}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;gap:12px}
  .topbar h2{margin:0;font-size:16px;font-weight:800}.spacer{flex:1}
  .lo{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-weight:700;font-size:13px;color:var(--ink);text-decoration:none}
  .content{padding:20px;max-width:1180px;width:100%;margin:0 auto}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;border-radius:999px;padding:5px 11px;white-space:nowrap}
  .st-new{background:#eef2ff;color:#4f46e5}.st-contacting{background:#ecfeff;color:#0e7490}.st-interested{background:#f5f3ff;color:#7c3aed}
  .st-followup{background:#e0f2fe;color:#075985}.st-awaiting_payment{background:#fff7ed;color:#c2660c}.st-won{background:#dcfce7;color:#166534}.st-lost{background:#fef2f2;color:#b91c1c}
  .phead{background:linear-gradient(135deg,#f0f7ff,var(--surface));border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:15px 17px;margin-bottom:14px}
  .ph-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .ph-title{font-size:17px;font-weight:800;display:flex;align-items:center;gap:9px}
  .ph-target{font-size:12px;color:var(--muted);font-weight:800;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:5px 11px}
  .ph-stats{display:flex;gap:11px;margin-top:12px;flex-wrap:wrap}
  .ph-st{flex:1;min-width:110px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
  .ph-st .n{font-size:21px;font-weight:800;line-height:1}.ph-st .l{font-size:11px;color:var(--muted);font-weight:600;margin-top:3px}
  .ph-bar{height:9px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:12px}.ph-bar>i{display:block;height:100%;background:linear-gradient(135deg,var(--brand-deep),var(--brand))}
  .fbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 13px;font-size:13px;font-weight:700;color:var(--muted);display:inline-flex;gap:7px;align-items:center}
  .chip.on{border-color:var(--brand);background:#eff5ff;color:var(--brand-deep)}.chip b{background:var(--surface-2);border-radius:7px;padding:1px 7px;font-size:12px}
  .chip.on b{background:var(--brand);color:#fff}
  .search{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 15px;font-size:14px;font-family:inherit;margin-bottom:14px;background:var(--surface)}
  .cards{display:flex;flex-direction:column;gap:9px}
  .lcard{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 15px;box-shadow:var(--shadow);width:100%;text-align:left;transition:transform .12s,border-color .12s}
  .lcard:hover{border-color:#c7d7f0;transform:translateY(-1px)}
  .av{width:42px;height:42px;border-radius:50%;color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .lc-main{flex:1;min-width:0}.lc-top{display:flex;align-items:center;gap:7px}.lc-name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lc-sub{font-size:12px;color:var(--muted);margin-top:2px}.lc-sub .tel{color:var(--brand);font-weight:700;text-decoration:none}
  .lc-urg{margin-top:4px;font-size:12px;font-weight:700}.u-over{color:var(--bad)}.u-appt{color:var(--cyan)}.u-new{color:#4338ca}.u-mut{color:var(--muted)}
  .lc-right{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}.lc-amt{font-weight:800;color:var(--ok);font-size:14px}
  .tgroup{margin-bottom:16px}
  .tg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;border-radius:12px;color:#fff;margin-bottom:9px}
  .tg-head.T1{background:linear-gradient(135deg,#1e3a8a,#2563eb)}.tg-head.T2{background:linear-gradient(135deg,#5b21b6,#7c3aed)}.tg-head.T3{background:linear-gradient(135deg,#9a3412,#ea580c)}
  .tg-name{font-weight:800;font-size:14px}.tg-goal{font-size:11.5px;opacity:.95;margin-top:2px}.tg-prog{font-size:12px;font-weight:800}
  .empty{color:var(--muted);padding:22px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
  .mbg{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);display:none;justify-content:flex-end;z-index:40}
  .mbg.on{display:flex}
  .sheet{background:var(--bg);width:1000px;max-width:100%;height:100vh;overflow:auto;box-shadow:var(--shadow-lg);animation:si .2s ease}
  @keyframes si{from{transform:translateX(30px);opacity:.4}to{transform:translateX(0);opacity:1}}
  .sh-in{padding:18px 20px 60px}
  .closeX{position:sticky;top:0;float:right;background:var(--surface);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:16px;color:var(--muted);z-index:2}
  .tk-name{font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .tk-id{font-size:12px;color:var(--muted);margin:3px 0 14px}
  .tagbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .ttag{font-size:12px;font-weight:700;border-radius:999px;padding:5px 11px;border:1px solid var(--violet);color:var(--violet);background:#f5f3ff}
  .ttag.add{border-style:dashed;border-color:var(--brand);color:var(--brand);background:transparent}
  .rb{border-radius:13px;padding:13px 15px;color:#fff;margin-bottom:14px}.rb.T1{background:linear-gradient(135deg,#1e3a8a,#2563eb)}.rb.T2{background:linear-gradient(135deg,#5b21b6,#7c3aed)}.rb.T3{background:linear-gradient(135deg,#9a3412,#ea580c)}
  .rb b{font-size:14px}.rb .g{font-size:12.5px;opacity:.96;margin-top:5px}.rb .ro{float:right;font-size:10.5px;font-weight:800;background:rgba(255,255,255,.18);border-radius:7px;padding:3px 9px}
  .box{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 15px;margin-bottom:12px}
  .box h4{margin:0 0 11px;font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:8px}
  .step-h{display:flex;align-items:center;gap:9px;margin-bottom:11px}.step-n{width:25px;height:25px;border-radius:50%;background:linear-gradient(135deg,var(--brand-deep),var(--brand));color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}.step-t{font-weight:800;font-size:15px}
  .dial{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--brand-deep),var(--brand));color:#fff;font-weight:800;font-size:15px;border-radius:12px;padding:13px;border:0;width:100%;text-decoration:none}
  .seg{display:flex;gap:8px;margin-top:10px}.seg button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px;font-weight:700;font-size:13px;color:var(--muted)}
  .seg button.on{border-color:var(--brand);background:#eff5ff;color:var(--brand-deep)}
  .toggle{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .tg2{border:2px solid var(--line);background:var(--surface);border-radius:11px;padding:12px;text-align:center;font-weight:800;font-size:14px;color:var(--muted)}
  .tg2.ok{border-color:var(--ok);background:#f0fdf4;color:var(--ok)}.tg2.no{border-color:var(--bad);background:#fef2f2;color:var(--bad)}
  .tk-av2{width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff;font-weight:800;font-size:21px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .tksheet{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
  @media(max-width:900px){.tksheet{grid-template-columns:1fr}}
  .pk-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .pk-tile{border:1px solid var(--line);border-radius:11px;padding:12px 13px;background:var(--surface-2,var(--surface))}
  .pk-tile .n{font-size:18px;font-weight:800;line-height:1.05}.pk-tile .l{font-size:11px;color:var(--muted);margin-top:5px;font-weight:600}
  .pk-kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.pk-kv span{color:var(--muted)}
  .listwrap{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
  @media(max-width:1000px){.listwrap{grid-template-columns:1fr}.calside{order:-1}}
  .calside{position:sticky;top:12px}
  .cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 13px 10px;box-shadow:var(--shadow)}
  .cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .cal-h b{font-size:14px;font-weight:800}
  .cal-nav{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;width:28px;height:28px;font-size:14px;color:var(--ink);cursor:pointer}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal-wd{text-align:center;font-size:10.5px;color:var(--muted);font-weight:700;padding:2px 0}
  .cal-cell{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink);background:transparent;border:1px solid transparent;cursor:default}
  .cal-cell.pad{cursor:default}
  .cal-cell.has{cursor:pointer;background:color-mix(in srgb,var(--brand) 12%,var(--surface));border-color:color-mix(in srgb,var(--brand) 30%,var(--surface))}
  .cal-cell.has:hover{background:color-mix(in srgb,var(--brand) 20%,var(--surface))}
  .cal-cell.today{outline:2px solid var(--warn);outline-offset:-2px}
  .cal-cell.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
  .cal-cnt{position:absolute;top:-5px;right:-4px;min-width:16px;height:16px;border-radius:9px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 3px}
  .cal-cell.sel .cal-cnt{background:#fff;color:var(--brand)}
  .cal-legend{font-size:10.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .opts{display:flex;flex-direction:column;gap:9px;margin-top:12px}
  .op{border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;align-items:center;gap:13px;background:var(--surface);text-align:left;width:100%;transition:border-color .12s,box-shadow .12s}
  .op:hover{border-color:#c7d7f0;box-shadow:0 1px 6px rgba(37,99,235,.06)}.op.sel{border-color:var(--ok);background:#f0fdf4;box-shadow:0 1px 8px rgba(16,185,129,.1)}
  .op .ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--surface-2);flex:0 0 auto}
  .op.sel .ico{background:#dcfce7}
  .op .tx{flex:1;min-width:0}.op .t{display:block;font-weight:800;font-size:14.5px}.op .d{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
  .op .rev{font-size:11px;font-weight:800;color:var(--violet);background:#f5f3ff;border:1px solid #ddd6fe;border-radius:8px;padding:5px 10px;flex:0 0 auto;white-space:nowrap}
  .reveal{margin:2px 0 4px 39px;border-left:2px solid #bbf7d0;padding:10px 0 2px 13px;display:none}.reveal.show{display:block}
  .inp{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13px}
  .reasons{display:flex;gap:7px;flex-wrap:wrap}.rchip{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .rchip.on{border-color:var(--bad);background:#fef2f2;color:var(--bad)}
  .btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;font-size:13px;font-family:inherit}.btn.p{background:var(--brand);color:#fff}.btn.g{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
  textarea.inp,input.inp{width:100%}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border-bottom:0}.kv .k{color:var(--muted)}.kv .v{font-weight:700;text-align:right}
  .ev{position:relative;padding:0 0 14px 26px}.ev:not(:last-child)::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
  .ev .eic{position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--surface-2);border:1px solid var(--line)}
  .ev .et{font-size:13px;font-weight:700}.ev .em{font-size:11px;color:var(--muted);margin-top:2px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.22s;z-index:100}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:860px){.side{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .2s}.side.open{transform:none}.menuBtn{display:inline-flex!important}.sheet{width:100%}}
  .menuBtn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;font-size:17px}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <div class="main">
    <div class="topbar">
      <button class="menuBtn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <h2 id="viewTitle">งานของฉัน</h2><div class="spacer"></div>
      <form method="POST" action="/logout" style="margin:0"><button class="lo">ออกจากระบบ</button></form>
    </div>
    <div class="content" id="content"><div class="empty">กำลังโหลด…</div></div>
  </div>
</div>
<div class="mbg" id="mbg" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sh-in" id="sheet"></div></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1700);}
function fmtB(n){return "฿"+Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});}
function fmtShort(v){if(!v)return"";try{const d=new Date(v),p=n=>String(n).padStart(2,"0");return p(d.getDate())+"/"+p(d.getMonth()+1)+" "+p(d.getHours())+":"+p(d.getMinutes());}catch(e){return"";}}
function daysIdle(r){if(!r.lastActivity)return 0;const t=Date.parse(r.lastActivity);return isNaN(t)?0:Math.floor((Date.now()-t)/864e5);}
function fmtDay(v){if(!v)return"";try{const d=new Date(v),p=n=>String(n).padStart(2,"0");return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+String(d.getFullYear()+543).slice(-2);}catch(e){return"";}}
// ฐานอ้างอิงของรอบ T1/T2/T3 = วันสั่งซื้อล่าสุด (lastOrderAt) ถ้าไม่มีใช้วันรับเข้าระบบ (receivedAt) — ตรงกับที่ระบบใช้คำนวณอายุออเดอร์
function orderBase(r){const raw=(r&&(r.lastOrderAt||r.receivedAt))||"";if(!raw)return null;const t=Date.parse(raw);if(isNaN(t))return null;return {label:r.lastOrderAt?"วันสั่งซื้อ":"วันรับเข้าระบบ",raw,day:fmtDay(raw),days:Math.max(0,Math.floor((Date.now()-t)/864e5))};}

const STLABEL={new:"ใหม่",contacting:"กำลังติดต่อ",interested:"สนใจ",followup:"นัดติดตาม",awaiting_payment:"รอชำระเงิน",won:"ปิดการขาย",lost:"ไม่สนใจ"};
const STCOL={new:"#4f46e5",contacting:"#0e7490",interested:"#7c3aed",followup:"#0e7490",awaiting_payment:"#c2660c",won:"#16a34a",lost:"#b91c1c"};
const ROUND_NAME={T1:"รายใหม่จากแอดมิน",T2:"ติดตามหลังรับของ",T3:"ตามซื้อซ้ำ (ของใกล้หมด)"};
const ROUND_GOAL={T1:"โทรครั้งแรก — ต้อนรับ/ยืนยันการสั่งซื้อ-จัดส่ง สร้างความสัมพันธ์",T2:"ถามว่าได้รับของยัง ใช้เป็นไง แล้วเสนอเพิ่ม/อัพเซล",T3:"เช็คของใกล้หมด ชวนสั่งซ้ำ เสนอโปรซื้อซ้ำ"};
const OUTCOMES=[
  {k:"won",ic:"✔",t:"ปิดการขายสำเร็จ",d:"ลูกค้าตกลงซื้อ",rev:"→ ใส่สินค้า/ยอด",field:"sale",patch:{contact:"reached",leadStatus:"won"}},
  {k:"pay",ic:"💳",t:"รอชำระเงิน",d:"ตกลงซื้อแล้ว ยังไม่จ่าย",rev:"→ ใส่สินค้า/ยอด",field:"sale",patch:{contact:"reached",leadStatus:"awaiting_payment"}},
  {k:"hot",ic:"🔥",t:"สนใจมาก · มีโอกาสซื้อสูง",d:"ควรติดตามเร็ว",patch:{contact:"reached",leadStatus:"interested",interest:"hot"}},
  {k:"warm",ic:"😊",t:"สนใจ · ขอเวลาตัดสินใจก่อน",patch:{contact:"reached",leadStatus:"interested",interest:"warm"}},
  {k:"info",ic:"📄",t:"ขอรายละเอียดเพิ่ม",d:"ส่งข้อมูลสินค้า/ราคา/โปร",patch:{contact:"reached",leadStatus:"interested",nextAction:"send_info"}},

function leadPanel(r){if(r.source==="refill")return"refill";return (r.source==="pancake"||r.source==="manual")?"mkt":"ecom";}
function neverCalled(r){return !((r.realCalls>0)||(r.callCount>0));}
function overdueDays(r){const s=r.source||"evolution";return (s==="pancake"||s==="manual"||s==="refill")?2:5;}
function isStale(r){const st=r.leadStatus||"new";if(r.archived||st==="won"||st==="lost")return false;if(st==="followup"&&r.nextAppt){const t=Date.parse(r.nextAppt);if(!isNaN(t)&&t>Date.now())return false;}return daysIdle(r)>=overdueDays(r);}
function isOverdue(r){const st=r.leadStatus||"new";if(r.archived||st==="won"||st==="lost")return false;if(st==="followup"&&r.nextAppt){const t=Date.parse(r.nextAppt);if(!isNaN(t)&&t<Date.now())return true;}return isStale(r);}
function endToday(){const d=new Date();d.setHours(23,59,59,999);return d.getTime();}
function dueToday(r){if((r.leadStatus||"new")==="followup"&&r.nextAppt){const t=Date.parse(r.nextAppt);return !isNaN(t)&&t<=endToday();}return false;}
function isToday(v){if(!v)return false;const d=new Date(v),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();}
function wonToday(r){if(r.archived||(r.leadStatus||"new")!=="won")return false;const h=r.history||[];for(let i=h.length-1;i>=0;i--){if(h[i].k==="status"&&h[i].v==="won")return isToday(h[i].at);}return isToday(r.updatedAt);}
function isToCall(r){if(r.archived)return false;const st=r.leadStatus||"new";if(st==="won"||st==="lost")return false;if(isOverdue(r))return true;if(dueToday(r))return true;if(st==="new"&&neverCalled(r))return true;return false;}
function calledToday(r){if(r.realLastCallAt&&isToday(r.realLastCallAt))return true;if(r.lastCallAt&&isToday(r.lastCallAt))return true;for(const e of (r.history||[]))if((e.k==="call"||e.k==="calls")&&isToday(e.at))return true;return false;}
function saleTotal(r){return (r.saleItems||[]).reduce((s,i)=>s+(Number(i.price)||0),0);}
function urgRank(r){const st=r.leadStatus||"new";if(st==="won"||st==="lost")return 9;if(isOverdue(r))return 0;if(dueToday(r))return 1;if(st==="new"&&neverCalled(r))return 2;if(st==="followup")return 3;if(st==="contacting")return 4;return 5;}
function urgCmp(a,b){const x=urgRank(a)-urgRank(b);if(x)return x;if(a.nextAppt&&b.nextAppt){const t=Date.parse(a.nextAppt)-Date.parse(b.nextAppt);if(t)return t;}return daysIdle(b)-daysIdle(a);}

  const applyAppt=arr=>{if(!APPTDATE)return arr;return pool.filter(r=>ms(r)&&apptDayKey(r)===APPTDATE).slice().sort((a,b)=>(Date.parse(a.nextAppt||"")||9e15)-(Date.parse(b.nextAppt||"")||9e15));};

  const miniCal=apptPool=>{

    const TZ=7*3600000,thNow=new Date(Date.now()+TZ),p2=n=>String(n).padStart(2,"0");

function pagerS(total,cur,fnName){if(total<=1)return "";
  const btn=(p,lab,on,dis)=>`<button onclick="${fnName}(${p})" ${dis?"disabled":""} style="min-width:34px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;font-weight:800;font-size:13px;cursor:${dis?"default":"pointer"};${on?"background:var(--brand);color:#fff;border-color:var(--brand)":"background:var(--surface);color:var(--ink)"};${dis?"opacity:.4":""}">${lab}</button>`;
  let nums=[];if(total<=7){for(let p=1;p<=total;p++)nums.push(p);}else{nums.push(1);let a=Math.max(2,cur-1),b=Math.min(total-1,cur+1);if(a>2)nums.push("…");for(let p=a;p<=b;p++)nums.push(p);if(b<total-1)nums.push("…");nums.push(total);}
  const mid=nums.map(p=>p==="…"?`<span style="min-width:22px;text-align:center;color:var(--muted)">…</span>`:btn(p,p,p===cur,false)).join("");
  return `<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">${btn(cur-1,"‹",false,cur<=1)}${mid}${btn(cur+1,"›",false,cur>=total)}</div>`;}

function mtMatch(r,q){if(!q)return true;const dq=q.replace(/\D/g,"");return [r.name,r.ticketId,r.code].some(v=>String(v||"").toLowerCase().includes(q))||(!!dq&&String(r.phone||"").replace(/\D/g,"").includes(dq));}

function saleCard(r){
  const items=r.saleItems||[];const label=(r.leadStatus==="awaiting_payment")?"🧾 รอชำระเงิน — รายการที่ตกลงซื้อ":"✅ ปิดการขายสำเร็จ";
  const rows=items.length?items.map(i=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)"><span><b>${esc(i.name)||"(ไม่ระบุ)"}</b></span><span class="tnum" style="font-weight:800;color:var(--ok)">${fmtB(i.price)}</span></div>`).join(""):`<div style="color:var(--muted);font-size:12.5px">ยังไม่มีรายการ</div>`;
  return `<div class="box" style="border:1.5px solid #86efac"><h4>${label}</h4>
    <div class="kv"><span class="k">วันที่</span><span class="v">${esc(fmtShort(r.updatedAt)||"วันนี้")}</span></div>
    <div style="margin-top:6px">${rows}</div>
    <div style="display:flex;justify-content:space-between;margin-top:9px;padding-top:8px;border-top:2px solid var(--line);font-weight:800"><span>ยอดขายรวม</span><span class="tnum" style="color:var(--ok);font-size:16px">${fmtB(saleTotal(r))}</span></div></div>`;
}
function latestSummary(r){return r.note?esc(r.note):"ยังไม่มีสรุป — โทรและบันทึกผล/โน้ต แล้วจะเห็นสรุปล่าสุดตรงนี้";}
function renderSheet(){
  const r=CUR;if(!r)return;
  const tags=(r.tags||[]).map((t,i)=>`<span class="ttag" title="คลิกเพื่อแก้ไข" onclick="editTag(${i})" style="cursor:pointer">${esc(t)}<b onclick="event.stopPropagation();delTag(${i})" title="ลบแท็ก" style="margin-left:7px;color:#ef4444;font-weight:900;cursor:pointer">×</b></span>`).join("");
  let fval="";try{const b=r.nextAppt?new Date(r.nextAppt):(()=>{const d=new Date();d.setDate(d.getDate()+1);d.setHours(10,0,0,0);return d;})();const p=n=>String(n).padStart(2,"0");fval=b.getFullYear()+"-"+p(b.getMonth()+1)+"-"+p(b.getDate())+"T"+p(b.getHours())+":"+p(b.getMinutes());}catch(e){}
  const days=v=>{const t=Date.parse(v);return isNaN(t)?null:Math.max(0,Math.floor((Date.now()-t)/864e5));};
  const lastD=days(r.lastOrderAt);
  const tile=(n,l)=>`<div class="pk-tile"><div class="n tnum">${n}</div><div class="l">${l}</div></div>`;
  const ac=(r.aiCalls&&r.aiCalls[0])||null;
  const sumMeta=`จาก 📞 สายโทร OneCall · ${ac?esc(fmtShort(ac.at)):"—"} · โดย${esc(ME.name||("Sales "+ME.side))}`;
  const sumText=ac?esc(ac.summary):(r.note?esc(r.note):(r.product?(esc(r.product)+(r.orderAmount?" "+fmtB(r.orderAmount):"")+" · "+(STLABEL[r.leadStatus||"new"]||"รอโทร")):"ยังไม่มีสรุป — โทรและบันทึกผล/โน้ต แล้วจะเห็นสรุปตรงนี้"));
  $("#content").innerHTML=`<button onclick="closeSheet()" style="border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--ink);margin-bottom:14px;cursor:pointer">← กลับ</button>
    <div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:12px">
      <div class="tk-av2">${esc((r.name||"?").trim()[0]||"?")}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap"><div class="tk-name" style="margin:0">${esc(r.name)||"(ไม่มีชื่อ)"}</div>${statusPill(r)}</div>
        <div class="tk-id" style="margin:3px 0 0">ตั๋ว <span class="mono" style="color:var(--brand);font-weight:700">${esc(r.ticketId||"")}</span> · ลูกค้า <span class="mono">${esc(r.code)}</span></div>
      </div>
    </div>
    <div class="tagbar" style="margin-bottom:14px">${r.fromExcel?`<span class="ttag" style="color:#b45309;border-color:#fde68a;background:#fffbeb">📋 รายชื่อเดิมจาก Excel</span>`:""}${r.prevSales?`<span class="ttag" style="color:#0369a1;border-color:#bae6fd;background:#f0f9ff">↩️ ลูกค้าเก่าของ ${r.prevSales==="K"?"พี่เขม (K)":"พี่หวาน (W)"} · ซื้อซ้ำ</span>`:""}🏷️ ${tags}<button class="ttag add" onclick="addTag()">+ สร้างแท็ก</button></div>
    <div class="tksheet">
      <div>
        <div class="box" style="border:1.5px solid #ddd6fe"><h4>🤖 สรุปล่าสุด (ระบบสรุปให้อัตโนมัติ)</h4><div style="font-size:11.5px;color:var(--muted);margin-bottom:7px">${sumMeta}</div><div style="font-size:13.5px;line-height:1.6">${sumText}</div></div>
        ${(r.leadStatus==="won"||r.leadStatus==="awaiting_payment")?saleCard(r):""}
        ${roundInfo(r)}
        <div class="box"><div class="step-h"><span class="step-n">1</span><span class="step-t">โทรหาลูกค้า</span></div>
          <a class="dial" href="tel:${esc(r.phone)}" onclick="logCall('${esc(r.key)}')">📞 โทรออก ${esc(r.phone)}</a>
          <div class="seg"><button class="${(r.callCount||0)>=1?"on":""}" onclick="setCalls(1)">ครั้งที่ 1</button><button class="${(r.callCount||0)>=2?"on":""}" onclick="setCalls(2)">2</button><button class="${(r.callCount||0)>=3?"on":""}" onclick="setCalls(3)">3</button><button onclick="setCalls(0)" style="flex:0 0 auto;min-width:54px;color:var(--muted)">ล้าง</button></div></div>
        <div class="box"><div class="step-h"><span class="step-n">2</span><span class="step-t">ผลการติดต่อ</span></div>
          <div class="toggle"><button class="tg2 ${r.contact==="reached"?"ok":""}" id="tgOk" onclick="pickReach(true)">✅ ติดต่อได้</button><button class="tg2 ${r.contact==="unreachable"?"no":""}" id="tgNo" onclick="pickReach(false)">📵 ติดต่อไม่ได้</button></div>
          <div id="reachBox"></div></div>
        <div class="box"><div class="step-h"><span class="step-n">3</span><span class="step-t">โน้ต / วันนัด</span></div>
          <textarea class="inp" id="noteInp" rows="2" placeholder="✍️ โน้ตการคุย (เห็นเฉพาะทีม)">${esc(r.note||"")}</textarea>
          <button class="btn g" style="margin-top:8px" onclick="saveNote()">บันทึกโน้ต</button>
          <div style="font-size:12px;color:var(--muted);font-weight:700;margin:12px 0 6px">วันนัดติดตามครั้งถัดไป</div>
          <input type="datetime-local" class="inp" id="fdate" value="${fval}"><button class="btn p" style="margin-top:8px" onclick="saveAppt()">บันทึกวันนัด</button></div>
        <div class="box"><div class="step-h"><span class="step-n">✏️</span><span class="step-t">แก้ไขข้อมูลลูกค้า (กรณีบันทึกผิด)</span></div>
          <div style="font-size:12px;color:var(--muted);font-weight:700;margin:2px 0 4px">ชื่อลูกค้า</div>
          <input class="inp" id="edName" value="${esc(r.name||"")}" placeholder="ชื่อลูกค้า">
          <div style="font-size:12px;color:var(--muted);font-weight:700;margin:10px 0 4px">เบอร์โทร</div>
          <input class="inp" id="edPhone" value="${esc(r.phone||"")}" placeholder="เบอร์โทร" inputmode="tel">
          <div style="font-size:12px;color:var(--muted);font-weight:700;margin:10px 0 4px">ที่อยู่</div>
          <textarea class="inp" id="edAddr" rows="2" placeholder="ที่อยู่จัดส่ง">${esc(r.address||"")}</textarea>
          <button class="btn g" style="margin-top:9px" onclick="saveEdit()">💾 บันทึกการแก้ไข</button></div>
        <div class="box"><div class="step-h"><span class="step-n">✔</span><span class="step-t">ปิดงาน / จัดเก็บ</span></div>
          <div style="font-size:12px;color:var(--muted);font-weight:700;margin:2px 0 6px">โน้ตตอนปิดงาน (เช่น ปิดการขายได้กี่ขวด · เหตุผลที่จัดเก็บ · สรุปสั้น ๆ)</div>
          <textarea class="inp" id="closeNote" rows="2" placeholder="✍️ รายละเอียดตอนปิดงาน — จะถูกเก็บไว้ในประวัติ และเห็นในเมนูถังขยะ/จัดเก็บ">${esc(r.archiveNote||"")}</textarea>
          <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:10px">
            <button class="btn" style="flex:1;min-width:130px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);font-weight:800" onclick="archiveLead('closed')">📁 จัดเก็บ (ปิดงาน)</button>
            <button class="btn" style="flex:1;min-width:130px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;font-weight:800" onclick="archiveLead('stopped')">🚫 ยกเลิกการติดต่อ</button>
            <button class="btn" style="flex:1;min-width:130px;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;font-weight:800" onclick="archiveLead('deleted')">🗑 ลบเข้าถังขยะ</button></div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:6px">🚫 <b>ยกเลิกการติดต่อ</b> = ลูกค้าที่จะไม่ตามต่อแล้ว (ต้องใส่เหตุผลในช่องด้านบน) → ย้ายไปเมนู "ยกเลิกการติดต่อ"</div>
          <div style="font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px">ลบ/จัดเก็บแล้ว ตั๋วจะออกจากคิว แต่ยังกู้คืนได้ที่เมนู "ถังขยะ" · สายที่โทรวันนี้ยังนับใน KPI</div></div>
      </div>
      <div>
        <div class="box"><h4>👤 ข้อมูลลูกค้า (Pancake)</h4>
          <div class="pk-tiles">${tile(r.ltv!=null?fmtB(r.ltv):"—","ยอดซื้อสะสม")}${tile(r.succeedOrders!=null?(r.succeedOrders+" ครั้ง"):"—","ออเดอร์สำเร็จ")}${tile(lastD!=null?(lastD+" วันก่อน"):"—","ซื้อล่าสุด")}${tile(r.step||"—","รอบปัจจุบัน")}</div>
          <div class="pk-kv"><span>เคยซื้อ</span><b>${esc(r.product||"—")}</b></div>
          ${r.page?`<div class="pk-kv"><span>เพจ</span><b>${esc(r.page)}</b></div>`:""}
          <div class="pk-kv"><span>เบอร์</span><b class="mono">${esc(r.phone||"—")}</b></div>
          ${r.nextAppt?`<div class="pk-kv"><span>นัดถัดไป</span><b>${esc(fmtShort(r.nextAppt))}</b></div>`:""}
          ${r.address?`<div class="pk-kv" style="align-items:flex-start"><span>ที่อยู่</span><b style="text-align:right;max-width:62%">${esc(r.address)}</b></div>`:""}
        </div>
        <div class="box"><h4>🕑 ไทม์ไลน์การติดต่อ</h4><div>${timeline(r)}</div></div>
      </div>
    </div>`;
  if(r.contact==="reached")pickReach(true);
  else if(r.contact==="unreachable")pickReach(false);
}
window.saveEdit=async function(){
  const name=($("#edName").value||"").trim(),phone=($("#edPhone").value||"").trim(),address=($("#edAddr").value||"").trim();
  if(!name){toast("กรอกชื่อลูกค้า");return;}
  await save({name,phone,address},"แก้ไขข้อมูลแล้ว");
};
window.archiveLead=async function(reason){
  if(!CUR)return;
  const note=(($("#closeNote")||{}).value||"").trim();
  if(reason==="stopped"&&!note){toast("กรุณาใส่เหตุผลที่ยกเลิกการติดต่อ (ช่องด้านบน)");const el=$("#closeNote");if(el)el.focus();return;}
  const lab=reason==="deleted"?"ลบเข้าถังขยะ":(reason==="stopped"?"ยกเลิกการติดต่อ":"จัดเก็บ (ปิดงาน)");
  const key=CUR.key;
  const j=await api("/api/lead/archive",{key,reason,note});
  if(j&&j.ok){closeSheet();await reload();toast(lab+"แล้ว"+(note?" · บันทึกเหตุผลแล้ว":"")+" · กู้คืนได้ในเมนูที่เกี่ยวข้อง");}
  else toast((j&&j.message)||"ทำรายการไม่สำเร็จ");
};
const EVIC={call:"📞",status:"◐",result:"📞",interest:"⭐",action:"➡️",followup:"📅",note:"📝",sale:"🛒",name:"✏️",phone:"✏️",address:"🏠",calls:"📞",tracking:"📦",tstage:"🔄",transfer:"🔁",archive:"📁",delete:"🗑️",close:"📁",restore:"↩️",aisum:"🤖",import:"📥",distribute:"📤",recycle:"♻️",dayoff_move:"🌴",dayoff_return:"↩️",tag:"🏷️"};
const EVLAB={import:"นำเข้ารายชื่อ",distribute:"แจกให้เซลล์",recycle:"คัดออกถาวร",dayoff_move:"ย้าย (วันลา)",dayoff_return:"คืน (ยกเลิกวันลา)",transfer:"โอนให้อีกฝั่ง",tag:"เพิ่มแท็ก"};
function evText(e){const v=e.v||"";switch(e.k){case"call":return"โทรออก";case"status":return"เปลี่ยนสถานะ → "+(STLABEL[v]||v);case"result":return"ผลการโทร: "+v;case"interest":return"ความสนใจ: "+v;case"followup":return v?"นัดติดตาม "+fmtShort(v):"ล้างวันนัด";case"note":return"อัปเดตโน้ต";case"sale":return"อัปเดตสินค้า/ยอด ("+v+" รายการ)";case"calls":return"ปรับจำนวนโทรเป็น "+v;case"name":return"แก้ชื่อ → "+v;case"phone":return"แก้เบอร์โทร → "+v;case"address":return"แก้ที่อยู่";case"tstage":return"ปรับรอบ → "+v;case"tracking":return"ใส่เลขพัสดุ "+v;case"archive":return"เก็บเข้าคลัง"+(v?(" · "+v):"");case"delete":return"ลบเข้าถังขยะ"+(v?(" · "+v):"");case"close":return"ปิดงาน/จัดเก็บ"+(v?(" · "+v):"");case"restore":return"กู้คืนตั๋ว";case"aisum":return"AI สรุปสาย";case"transfer":return"โอนให้ฝั่ง "+v;case"import":return"นำเข้ารายชื่อ"+(v?(" · รอบ "+v):"");case"tag":return v?("อัปเดตแท็ก → "+v):"ล้างแท็กทั้งหมด";default:return EVLAB[e.k]||e.k;}}
function timeline(r){const h=(r.history||[]).slice().reverse();if(!h.length)return `<div style="color:var(--muted);font-size:12.5px">ยังไม่มีประวัติ</div>`;return h.map(e=>`<div class="ev"><span class="eic">${EVIC[e.k]||"•"}</span><div><div class="et">${esc(evText(e))}</div><div class="em">${esc(fmtShort(e.at))}${e.by?" · "+esc(e.by):""}</div></div></div>`).join("");}

window.pickReach=function(ok){
  const r=CUR;$("#tgOk").classList.toggle("ok",ok);$("#tgNo").classList.toggle("no",!ok);
  const box=$("#reachBox");
  if(ok){
    box.innerHTML=`<div class="opts">${OUTCOMES.map(o=>{const sel=isOutcomeSel(r,o);return `<button class="op ${sel?"sel":""}" data-k="${o.k}" onclick="pickOutcome('${o.k}')"><span class="ico">${o.ic}</span><span class="tx"><span class="t">${o.t}</span>${o.d?`<span class="d">${o.d}</span>`:""}</span>${o.rev?`<span class="rev">${o.rev}</span>`:""}</button><div class="reveal ${sel&&o.rev?"show":""}" id="rev-${o.k}">${revealHTML(o)}</div>`;}).join("")}</div>`;
  }else{
    box.innerHTML=`<div style="margin-top:12px"><div style="font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:8px">เลือกสาเหตุที่ติดต่อไม่ได้</div><div class="reasons">${NOREACH.map(x=>`<button class="rchip ${r.unreachableReason===x?"on":""}" onclick="pickNoReach('${x}')">${x}</button>`).join("")}</div></div>`;
  }
};
function isOutcomeSel(r,o){const st=r.leadStatus;if(o.k==="won")return st==="won";if(o.k==="pay")return st==="awaiting_payment";if(o.k==="hot")return st==="interested"&&r.interest==="hot";if(o.k==="warm")return st==="interested"&&r.interest==="warm";if(o.k==="later")return st==="interested"&&r.interest==="cold";if(o.k==="info")return st==="interested"&&r.nextAction==="send_info";if(o.k==="reject")return st==="lost";if(o.k==="think"||o.k==="appt")return st==="followup";return false;}
function revealHTML(o){
  if(o.field==="sale")return `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input class="inp" id="saleName" style="flex:1;min-width:130px" placeholder="ชื่อสินค้า/เซต"><input class="inp" id="salePrice" style="width:90px" placeholder="ราคา"><button class="btn p" onclick="addSaleItem()">+ เพิ่ม</button></div><div id="saleMini" style="font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.7">${(CUR.saleItems||[]).map(i=>"• "+esc(i.name)+" = "+fmtB(i.price)).join("<br>")}${(CUR.saleItems||[]).length?("<br>รวม "+fmtB(saleTotal(CUR))):""}</div>`;
  if(o.field==="date")return `<input type="datetime-local" class="inp" id="revDate" style="width:100%"><button class="btn p" style="margin-top:8px" onclick="saveApptFromReveal()">บันทึกวันนัด</button>`;
  if(o.field==="reason")return `<div class="reasons">${REJECT_REASONS.map(x=>`<button class="rchip ${CUR.lostReason===x?"on":""}" onclick="pickReason('${x}')">${x}</button>`).join("")}</div>`;
  return "";
}
window.pickOutcome=async function(k){
  const o=OUTCOMES.find(x=>x.k===k);
  document.querySelectorAll(".op").forEach(b=>b.classList.toggle("sel",b.dataset.k===k));
  document.querySelectorAll(".reveal").forEach(x=>x.classList.remove("show"));
  if(o.rev){const rv=$("#rev-"+k);if(rv)rv.classList.add("show");}
  await save(Object.assign({},o.patch),"บันทึก: "+o.t);
};
window.pickNoReach=async function(x){
  document.querySelectorAll("#reachBox .rchip").forEach(c=>c.classList.toggle("on",c.textContent===x));
  const cr=(x==="เบอร์ผิด"||x==="เบอร์ไม่ใช้งาน")?"wrong_number":"no_answer";
  await save({contact:"unreachable",unreachableReason:x,callResult:cr,leadStatus:"contacting"},"บันทึก: "+x);
};
window.pickReason=async function(x){await save({leadStatus:"lost",lostReason:x,contact:"reached"},"เหตุผล: "+x);};
window.saveApptFromReveal=async function(){const v=$("#revDate").value;if(!v){toast("เลือกวันก่อน");return;}await save({leadStatus:"followup",contact:"reached",nextAppt:new Date(v).toISOString()},"บันทึกวันนัดแล้ว");};
window.saveAppt=async function(){const v=$("#fdate").value;if(!v){toast("เลือกวันก่อน");return;}await save({leadStatus:"followup",nextAppt:new Date(v).toISOString()},"บันทึกวันนัดแล้ว");};
window.saveNote=async function(){await save({note:$("#noteInp").value},"บันทึกโน้ตแล้ว");};
window.setCalls=async function(n){await save({callCount:n},n===0?"ล้างจำนวนโทร":"โทรครั้งที่ "+n);};
window.addSaleItem=async function(){const name=($("#saleName").value||"").trim();const price=Number($("#salePrice").value||0)||0;if(!name&&!price){toast("กรอกสินค้า/ราคา");return;}const items=(CUR.saleItems||[]).slice();items.push({name,price});await save({saleItems:items},"เพิ่มรายการแล้ว");};
window.addTag=async function(){const t=prompt("สร้างแท็กใหม่ (เช่น ผิวแพ้ง่าย)");if(!t||!t.trim())return;const tags=(CUR.tags||[]).slice();tags.push(t.trim());await save({tags},"เพิ่มแท็ก: "+t.trim());};
window.editTag=async function(i){const cur=(CUR.tags||[])[i];if(cur==null)return;const t=prompt("แก้ไขแท็ก (เว้นว่างเพื่อลบ)",cur);if(t==null)return;const v=t.trim();const tags=(CUR.tags||[]).slice();if(!v)tags.splice(i,1);else tags[i]=v;await save({tags},v?("แก้ไขแท็ก → "+v):"ลบแท็ก");};
window.delTag=async function(i){const cur=(CUR.tags||[])[i];if(cur==null)return;if(!confirm("ลบแท็ก \""+cur+"\" ?"))return;const tags=(CUR.tags||[]).slice();tags.splice(i,1);await save({tags},"ลบแท็ก: "+cur);};
window.logCall=function(key){api("/api/lead/call",{key}).then(()=>{toast("บันทึกการโทรแล้ว");reload();});};

async function save(patch,msg){
  if(!CUR)return;
  const j=await api("/api/lead/update",{key:CUR.key,patch});
  if(j&&j.ok){
    if(j.replaced){ // Marketplace ติดต่อไม่ได้ → นำออก + เติมรายใหม่ทันที
      toast(j.replaced.poolEmpty?"นำออกแล้ว · คลัง Marketplace หมด ยังไม่มีรายใหม่":"ติดต่อไม่ได้ · ดึงรายใหม่มาแทนแล้ว");
      closeSheet();await reload();return;
    }
    toast(msg||"บันทึกแล้ว");if(j.lead)CUR=j.lead;
    const i=ACTIVE.findIndex(x=>x.key===CUR.key);if(i>=0)ACTIVE[i]=CUR;
    renderSheet();renderList();renderNav();
  }else toast((j&&j.error)||"บันทึกไม่สำเร็จ");
}

async function reload(){
  const r=await fetch("/api/leads");if(r.status===401){location.href="/login";return;}
  const j=await r.json();ACTIVE=j.active||[];ARCHIVED=j.archived||[];
  if(CUR){const f=findLead(CUR.key);if(f)CUR=JSON.parse(JSON.stringify(f));}
  render();
}
async function init(){
  const r=await fetch("/api/me");if(r.status===401){location.href="/login";return;}
  ME=await r.json();
  if(ME.role==="admin"){const u=new URLSearchParams(location.search).get("side");ME.side=(u==="K"?"K":"W");}
  await reload();
}
init();
setInterval(()=>{if(VIEW!=="ticket")reload();},30000);
</script>
