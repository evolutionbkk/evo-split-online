<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>งานของฉัน — เซลล์</title>
<style>
  :root{
    --brand:#2563eb;--brand-2:#3b82f6;--brand-deep:#1e3a8a;
    --grad-w:linear-gradient(135deg,#1e3a8a 0%,#2563eb 55%,#3b82f6 100%);
    --grad-k:linear-gradient(135deg,#111c3a 0%,#26327a 55%,#4f46e5 100%);
    --ink:#0f172a;--muted:#64748b;--line:#e6ecf5;
    --shadow:0 4px 18px rgba(30,58,138,.07);--shadow-sm:0 1px 3px rgba(30,58,138,.05)
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Sarabun","Tahoma",system-ui,sans-serif;color:var(--ink);background:radial-gradient(1100px 380px at 50% -150px,#dbe7fb,transparent),#f4f7fc;font-size:16px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:12px 12px 90px}
  .ic{display:inline-block;vertical-align:-2px;flex:0 0 auto}
  .head{position:sticky;top:0;z-index:10;border-radius:0 0 18px 18px;padding:15px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;margin:-12px -12px 14px;box-shadow:0 10px 26px rgba(37,99,235,.20)}
  .head.w{background:var(--grad-w)}.head.k{background:var(--grad-k)}
  .head h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
  .head .lo{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:8px 14px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;backdrop-filter:blur(4px)}
  .switch{font-size:12.5px;color:var(--muted);margin:0 2px 12px}.switch a{color:var(--brand);text-decoration:none;font-weight:600;cursor:pointer}
  .chips{display:block;margin-bottom:10px}
  .fgroup{margin-bottom:11px}
  .flabel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700;margin:0 2px 7px}
  .flabel .ic{color:var(--brand)}
  .frow{display:flex;gap:7px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 13px;font-size:13.5px;cursor:pointer;white-space:nowrap;font-weight:600;color:#334155;box-shadow:var(--shadow-sm);transition:.15s}
  .chip b{background:#eef2f8;color:#475569;font-weight:700;border-radius:6px;padding:1px 6px;font-size:12px;min-width:18px;text-align:center}
  .chip.on{background:var(--grad-w);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(37,99,235,.30)}
  .chip.on b{background:rgba(255,255,255,.24);color:#fff}
  .search{position:relative;margin-bottom:12px}
  .search .si{position:absolute;left:14px;top:22px;transform:translateY(-50%);color:#94a3b8;pointer-events:none}
  .search input{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 14px 12px 40px;font-family:inherit;font-size:15px;background:#fff;box-shadow:var(--shadow-sm)}
  .search input:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  .lead{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:11px;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
  .lead:active{transform:scale(.995);background:#fbfcfe}
  .lead .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .lead .nm{font-weight:700;font-size:16.5px;line-height:1.25;color:#0f172a}
  .lead a.tel{display:inline-flex;align-items:center;gap:6px;background:#eaf1fe;color:#1d4ed8;font-weight:700;font-size:15px;text-decoration:none;padding:8px 13px;border-radius:11px;white-space:nowrap}
  .lead.k a.tel{background:#eef0fe;color:#4338ca}
  .lead .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 10px;border-radius:8px;font-weight:600}
  .b-new{background:#eef2ff;color:#3730a3}.b-un{background:#fef2f2;color:#b42318}.b-nr{background:#fff7ed;color:#9a3412}
  .b-ap{background:#e0f2fe;color:#075985}.b-cl{background:#dcfce7;color:#166534}.b-reached{background:#e0f2fe;color:#075985}
  .b-calls{background:#eef2ff;color:#4338ca}.b-line{background:#e7f9ee;color:#15803d}.b-arch{background:#f1f5f9;color:#64748b}
  .meta{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-top:9px}
  .empty{text-align:center;color:var(--muted);padding:34px;background:#fff;border:1px dashed var(--line);border-radius:16px;box-shadow:var(--shadow-sm)}
  .tblwrap{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow-x:auto}
  .ltbl{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
  .ltbl th{position:sticky;top:0;background:#f7f9fc;text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
  .ltbl td{padding:10px 12px;border-bottom:1px solid #f0f3f8;vertical-align:middle}
  .ltbl tbody tr:last-child td{border-bottom:0}
  .ltbl tbody tr:nth-child(even){background:#fbfcfe}
  .lrow{cursor:pointer}
  .lrow:hover td{background:#eef4ff}
  .ltbl td.num{color:var(--muted);text-align:center;width:42px;font-size:12.5px}
  .ltbl td.nmc{font-weight:700;color:#0f172a;white-space:nowrap}
  .ltbl td.codec{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .ltbl td.stc{white-space:nowrap}
  .ltbl td.stc .badge{margin-right:4px}
  .ltbl td.prog{text-align:center;color:#475569;font-weight:600;white-space:nowrap}
  .ltbl td.linec{text-align:center}
  .ltbl td.notec{color:#475569;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  .ltbl a.tel{display:inline-flex;align-items:center;gap:5px;color:#1d4ed8;font-weight:700;text-decoration:none;white-space:nowrap}
  .lrow.k a.tel{color:#4338ca}
  .dash{color:#cbd5e1}
  .mbg{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);display:none;justify-content:flex-end;z-index:40}
  .mbg.on{display:flex}
  .sheet{background:#fff;width:440px;max-width:100%;height:100vh;overflow:auto;padding:18px 20px 40px;box-shadow:-16px 0 44px rgba(15,23,42,.20);position:relative;animation:slideIn .22s ease}
  @keyframes slideIn{from{transform:translateX(34px);opacity:.3}to{transform:translateX(0);opacity:1}}
  @media(max-width:520px){.sheet{width:100%}}
  .closeX{position:absolute;top:14px;right:16px;background:#f1f5f9;border:0;border-radius:50%;width:34px;height:34px;cursor:pointer;color:#475569;display:inline-flex;align-items:center;justify-content:center;z-index:2}
  .sheet h3{margin:0 0 3px;font-size:20px;padding-right:44px;color:#0f172a}
  .sheet .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .dialbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--grad-w);color:#fff;text-decoration:none;font-weight:700;font-size:16px;border-radius:13px;padding:14px;margin-bottom:16px;box-shadow:0 8px 20px rgba(37,99,235,.26)}
  .sec{font-size:13px;color:var(--muted);font-weight:700;margin:0 0 9px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .out{border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:13px 10px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;justify-content:center;text-align:center;color:#334155}
  .out .em{display:inline-flex;align-items:center;color:var(--brand)}
  .out.sel{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:#eff5ff}
  .out.cl.sel{border-color:#16a34a;box-shadow:inset 0 0 0 1px #16a34a;background:#f0fdf4}.out.cl.sel .em{color:#16a34a}
  .out.ap.sel{border-color:#0284c7;box-shadow:inset 0 0 0 1px #0284c7;background:#f0f9ff}.out.ap.sel .em{color:#0284c7}
  .out.un.sel{border-color:#dc2626;box-shadow:inset 0 0 0 1px #dc2626;background:#fef2f2}.out.un.sel .em{color:#dc2626}
  .apptbox{margin-top:10px;background:#eff6ff;border:1px solid #cfe4fb;border-radius:13px;padding:13px}
  .apptbox input{width:100%;border:1px solid #bcd9f5;border-radius:10px;padding:11px;font-family:inherit;font-size:15px;margin-bottom:10px}
  .row2{display:flex;gap:9px}
  .lineseg{display:flex;gap:9px;margin:14px 0}
  .lineseg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#334155}
  .lineseg button.on{border-color:#15803d;background:#f0fdf4;color:#15803d}
  .noteToggle{display:inline-flex;align-items:center;gap:6px;color:var(--brand);font-weight:600;font-size:14px;cursor:pointer;margin:2px 0 12px}
  textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-family:inherit;font-size:15px;resize:vertical}
  .act{font-family:inherit;font-weight:700;border:0;border-radius:12px;padding:13px;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
  .b-save{background:var(--brand);color:#fff}.b-cancel{background:#eef2f7;color:var(--ink)}.b-restore{background:var(--brand-deep);color:#fff;width:100%}
  .rm{margin-top:16px;border-top:1px solid #eef2f7;padding-top:14px}
  .rm .grid button{border:1px solid #f3cccc;background:#fff;color:#b42318;border-radius:12px;padding:12px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:60;font-weight:600}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="head" id="head"><h1><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6a1 1 0 0 1 1 1v1h1a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1z"/><path d="M9 4h6"/></svg><span id="title">งานของฉัน</span></h1><form method="POST" action="/logout"><button class="lo">ออกจากระบบ</button></form></div>
  <div class="switch" id="switch"></div>
  <div class="chips" id="chips"></div>
  <div class="search"><span class="si"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span><input type="text" id="search" placeholder="ค้นหา ชื่อ / เบอร์ / รหัส…" oninput="render()"></div>
  <div id="list"></div>
</div>
<div class="mbg" id="mbg" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICONS={
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
  phoneOff:'<path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 3.07 8.63M2 2l20 20"/>',
  power:'<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/>',
  userX:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m17 8 5 5M22 8l-5 5"/>',
  tag:'<path d="M12.5 2H21a1 1 0 0 1 1 1v8.5a2 2 0 0 1-.59 1.42l-8.5 8.5a2 2 0 0 1-2.82 0l-7-7a2 2 0 0 1 0-2.82l8.5-8.5A2 2 0 0 1 12.5 2z"/><circle cx="7.5" cy="7.5" r="1.3"/>',
  bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  hourglass:'<path d="M5 22h14M5 2h14M17 22v-4.17a2 2 0 0 0-.59-1.41L12 12l-4.41 4.41A2 2 0 0 0 7 17.83V22M7 2v4.17a2 2 0 0 0 .59 1.41L12 12l4.41-4.41A2 2 0 0 0 17 6.17V2"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  message:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  checkCircle:'<circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  xCircle:'<circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/>',
  repeat:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/>',
  pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  slash:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  undo:'<path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  dot:'<circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/>'
};
function ic(name,size){size=size||16;const p=ICONS[name]||'';return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;}
const OUT=[
  {k:'closed',label:'ปิดการขาย',icon:'checkCircle',cls:'cl',patch:{contact:'reached',reachStatus:'closed'}},
  {k:'appointment',label:'นัดหมาย',icon:'calendar',cls:'ap'},
  {k:'not_ready',label:'ยังไม่พร้อม',icon:'hourglass',cls:'nr',patch:{contact:'reached',reachStatus:'not_ready'}},
  {k:'r:ไม่รับสาย',label:'ไม่รับสาย',icon:'phoneOff',cls:'un',patch:{contact:'unreachable',unreachableReason:'ไม่รับสาย',reachStatus:''}},
  {k:'r:ปิดเครื่อง',label:'ปิดเครื่อง',icon:'power',cls:'un',patch:{contact:'unreachable',unreachableReason:'ปิดเครื่อง',reachStatus:''}},
  {k:'r:ไม่สะดวกคุย',label:'ไม่สะดวกคุย',icon:'userX',cls:'un',patch:{contact:'unreachable',unreachableReason:'ไม่สะดวกคุย',reachStatus:''}},
  {k:'r:พบช่องทางอื่นที่ถูกกว่า',label:'เจอที่ถูกกว่า',icon:'tag',cls:'un',patch:{contact:'unreachable',unreachableReason:'พบช่องทางอื่นที่ถูกกว่า',reachStatus:''}},
  {k:'r:สะดวกสั่งซื้อช่องทางอื่น',label:'ซื้อช่องอื่น',icon:'bag',cls:'un',patch:{contact:'unreachable',unreachableReason:'สะดวกสั่งซื้อช่องทางอื่น',reachStatus:''}},
];
let ME={role:'',side:''},ACTIVE=[],ARCHIVED=[],FILTER='all',CURLIST=[],CUR=null;
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1600);}
function apptFmt(v){if(!v)return'';try{const d=new Date(v),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes()+'').padStart(2,'0');}catch(e){return'';}}
function curKey(r){if(r.contact==='unreachable'&&r.unreachableReason)return 'r:'+r.unreachableReason;if(r.reachStatus)return r.reachStatus;if(r.contact==='reached')return 'reached';return '';}
function advToast(adv){
  if(!adv)return false;
  if(adv.action==='transferred'){toast('ครบ 3 รอบ — ส่งต่อให้ '+adv.to+' อัตโนมัติ');return true;}
  if(adv.action==='recycled_out'){toast('ครบ 2 มือ — ย้ายไปถังคัดออกถาวร');return true;}
  return false;
}
function statusOf(r){
  if(r.archived){const t=r.archiveReason==='recycled_out'?'คัดออกถาวร (วนครบ)':(r.archiveReason==='unreachable'?'นำออก (เบอร์ติดต่อไม่ได้)':'นำออก (ข้อมูลเสีย)');return{cls:'b-arch',icon:'trash',txt:t};}
  if(r.contact==='unreachable')return{cls:'b-un',icon:'xCircle',txt:(r.unreachableReason||'ติดต่อไม่ได้')};
  if(r.reachStatus==='closed')return{cls:'b-cl',icon:'checkCircle',txt:'ปิดการขาย'};
  if(r.reachStatus==='appointment')return{cls:'b-ap',icon:'calendar',txt:'นัด '+apptFmt(r.nextAppt)};
  if(r.reachStatus==='not_ready')return{cls:'b-nr',icon:'hourglass',txt:'ยังไม่พร้อม'};
  if(r.contact==='reached')return{cls:'b-reached',icon:'phone',txt:'ติดต่อได้'};
  return{cls:'b-new',icon:'dot',txt:'ยังไม่ติดต่อ'};
}
function daysIdle(r){if(!r.lastActivity)return 0;const d=Date.parse(r.lastActivity);if(isNaN(d))return 0;return Math.floor((Date.now()-d)/86400000);}
function isStale(r){if(r.archived||r.reachStatus==='closed')return false;if(r.reachStatus==='appointment'&&r.nextAppt){const t=Date.parse(r.nextAppt);if(!isNaN(t)&&t>Date.now())return false;}return daysIdle(r)>=3;}
function pass(r,f){
  switch(f){
    case 'all':return !r.archived;
    case 'todo':return !r.archived&&(!r.contact||r.reachStatus==='appointment');
    case 'new':return !r.archived&&!r.contact;
    case 'appointment':return !r.archived&&r.reachStatus==='appointment';
    case 'stale':return isStale(r);
    case 'not_ready':return !r.archived&&r.reachStatus==='not_ready';
    case 'closed':return !r.archived&&r.reachStatus==='closed';
    case 'unreachable':return !r.archived&&r.contact==='unreachable';
    case 'hand2':return !r.archived&&(r.stage||0)>0;
    case 'line_added':return !r.archived&&r.line==='added';
    case 'line_not':return !r.archived&&r.line!=='added';
    case 'archived':return r.archived;
    default:return !r.archived;
  }
}
function cnt(f){const pool=f==='archived'?ARCHIVED:ACTIVE;return pool.filter(r=>pass(r,f)).length;}
const FILTER_GROUPS=[
  {icon:'inbox',label:'งานที่ต้องทำ',items:[['todo','ต้องติดต่อ'],['new','ยังไม่ติดต่อ'],['appointment','นัดหมาย'],['stale','ค้างนาน']]},
  {icon:'activity',label:'สถานะ',items:[['all','ทั้งหมด'],['not_ready','ยังไม่พร้อม'],['unreachable','ติดต่อไม่ได้'],['closed','ปิดการขาย'],['hand2','รับต่อมือ2'],['archived','นำออกแล้ว']]},
  {icon:'message',label:'ไลน์',items:[['line_added','แอดแล้ว'],['line_not','ยังไม่แอด']]}
];
function renderChips(){
  document.getElementById('chips').innerHTML=FILTER_GROUPS.map(g=>`<div class="fgroup"><div class="flabel">${ic(g.icon,14)}<span>${g.label}</span></div><div class="frow">${g.items.map(([f,l])=>`<div class="chip ${FILTER===f?'on':''}" onclick="setFilter('${f}')"><span>${l}</span><b>${cnt(f)}</b></div>`).join('')}</div></div>`).join('');
}
function setFilter(f){FILTER=f;render();}
const q=()=>(document.getElementById('search').value||'').trim().toLowerCase();
function ms(r){const s=q();if(!s)return true;return[r.code,r.name,r.phone].some(v=>String(v==null?'':v).toLowerCase().includes(s));}
function rank(r){if(!r.contact)return 0;if(r.reachStatus==='appointment')return 1;if(r.reachStatus==='not_ready')return 2;if(r.contact==='reached')return 3;if(r.reachStatus==='closed')return 4;if(r.contact==='unreachable')return 5;return 6;}
function render(){
  renderChips();
  const pool=FILTER==='archived'?ARCHIVED:ACTIVE;
  let list=pool.filter(r=>pass(r,FILTER)&&ms(r));
  if(FILTER!=='archived')list=list.slice().sort((a,b)=>rank(a)-rank(b));
  CURLIST=list;
  const box=document.getElementById('list');
  if(!list.length){box.innerHTML='<div class="empty">ไม่มีรายชื่อในหมวดนี้</div>';return;}
  const kc=ME.side==='K'?'k':'';
  const rows=list.map((r,i)=>{
    const st=statusOf(r);
    const flags=[];
    if(!r.archived&&r.stage>0)flags.push(`<span class="badge" style="background:#fef9c3;color:#854d0e">${ic('repeat',12)}มือ2</span>`);
    if(!r.archived&&r.lastActivity){const d=Math.floor((Date.now()-Date.parse(r.lastActivity))/86400000);if(d>=3)flags.push(`<span class="badge" style="background:#fef2f2;color:#b91c1c">${ic('clock',12)}${d} วัน</span>`);}
    const lineCell=(!r.archived&&r.line==='added')?`<span class="badge b-line">${ic('check',12)}</span>`:'<span class="dash">–</span>';
    const prog=r.archived?'<span class="dash">–</span>':`${Math.min(r.callCount||0,3)}/3`;
    return `<tr class="lrow ${kc}" onclick="openLead(${i})">
      <td class="num">${i+1}</td>
      <td class="nmc">${esc(r.name)||'(ไม่มีชื่อ)'}</td>
      <td class="phc"><a class="tel" href="tel:${esc(r.phone)}" onclick="logCall(${i},event)">${ic('phone',14)}${esc(r.phone)}</a></td>
      <td class="codec">${esc(r.code)}</td>
      <td class="stc"><span class="badge ${st.cls}">${ic(st.icon,12)}${esc(st.txt)}</span>${flags.join('')}</td>
      <td class="prog">${prog}</td>
      <td class="linec">${lineCell}</td>
      <td class="notec" title="${esc(r.note)}">${r.note?esc(r.note):''}</td>
    </tr>`;
  }).join('');
  box.innerHTML=`<div class="tblwrap"><table class="ltbl"><thead><tr><th class="num">#</th><th>ชื่อ-นามสกุล</th><th>เบอร์โทร</th><th>รหัส</th><th>สถานะ</th><th>ติดตาม</th><th>ไลน์</th><th>โน้ต</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function api(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});if(r.status===401){location.href='/login';return null;}return r.json().catch(()=>({}));}
function logCall(i,ev){ev&&ev.stopPropagation();const r=CURLIST[i];if(!r)return;api('/api/lead/call',{key:r.key}).then(j=>{if(!(j&&advToast(j.advanced)))toast('บันทึกการโทรแล้ว');reload();});/* ไม่ preventDefault ให้ tel: โทรออกได้ */}
function openLead(i){ const r=CURLIST[i]; if(r) openLeadByKey(r.key); }
function openLeadByKey(key){
  const r=ACTIVE.concat(ARCHIVED).find(x=>x.key===key);if(!r)return;CUR=JSON.parse(JSON.stringify(r));
  const s=document.getElementById('sheet');
  if(r.archived){
    s.innerHTML=`<button class="closeX" onclick="closeSheet()">${ic('x',16)}</button><h3>${esc(r.name)||'(ไม่มีชื่อ)'}</h3><div class="sub">${esc(r.code)} · ${esc(r.phone)} · Sales (${esc(r.sales)})</div>
      <div class="badge b-arch" style="margin-bottom:14px">${ic('trash',13)}อยู่ในถังนำออก (${r.archiveReason==='unreachable'?'เบอร์ติดต่อไม่ได้':'ข้อมูลเสีย'})</div>
      <button class="act b-restore" onclick="doRestore()">${ic('undo',17)}กู้คืนกลับรายชื่อ</button>`;
    document.getElementById('mbg').classList.add('on');return;
  }
  const ck=curKey(r);
  const outHtml=OUT.map(o=>`<button class="out ${o.cls} ${ck===o.k?'sel':''}" onclick="tapOut('${o.k}')"><span class="em">${ic(o.icon,18)}</span>${o.label}</button>`).join('');
  s.innerHTML=`<button class="closeX" onclick="closeSheet()">${ic('x',16)}</button>
    <h3>${esc(r.name)||'(ไม่มีชื่อ)'}</h3>
    <div class="sub">${esc(r.code)} · Sales (${esc(r.sales)}) · ติดตาม ${Math.min(r.callCount||0,3)}/3 รอบ · มือที่ ${(r.stage||0)+1}/2</div>
    <a class="dialbtn" href="tel:${esc(r.phone)}" onclick="sheetCall(event)">${ic('phone',18)}โทรออก ${esc(r.phone)}</a>
    <div class="sec">โทรออกครั้งที่ (แตะเพื่อปรับ)</div>
    <div class="lineseg" id="callpills" style="gap:8px">
      <button data-t="1" class="${(r.callCount||0)>=1?'on':''}" onclick="setCalls(1)">T1</button>
      <button data-t="2" class="${(r.callCount||0)>=2?'on':''}" onclick="setCalls(2)">T2</button>
      <button data-t="3" class="${(r.callCount||0)>=3?'on':''}" onclick="setCalls(3)">T3</button>
      <button onclick="setCalls(0)" style="flex:0 0 auto;color:#6b7280;min-width:60px">ล้าง</button>
    </div>
    <div class="sec" style="margin-top:16px">ผลการโทร (แตะปุ่มเดียว บันทึกทันที)</div>
    <div class="grid">${outHtml}</div>
    <div style="display:flex;gap:6px;font-size:11.5px;color:var(--muted);margin-top:8px">${ic('info',14)}<span>ครบ 3 รอบยังไม่ปิด = ส่งต่ออีกฝั่งอัตโนมัติ · ถ้ามือที่ 2 ครบ 3 รอบอีก = คัดออกถาวร (แอดมินกู้ได้)</span></div>
    <div id="apptbox"></div>
    <div class="sec" style="margin-top:16px">สถานะไลน์</div>
    <div class="lineseg"><button class="${r.line==='added'?'on':''}" onclick="tapLine('added')">${ic('check',16)}แอดไลน์แล้ว</button><button class="${r.line==='not_added'?'on':''}" onclick="tapLine('not_added')">ยังไม่แอดไลน์</button></div>
    <span class="noteToggle" onclick="toggleNote()">${ic('pencil',15)}${r.note?'แก้โน้ต':'เพิ่มโน้ต'}</span>
    <div id="notebox" style="display:${r.note?'block':'none'}">
      <textarea id="note" rows="2" placeholder="โน้ต…">${esc(r.note)}</textarea>
      <button class="act b-save" style="width:100%;margin-top:8px" onclick="saveNote()">บันทึกโน้ต</button>
    </div>
    <div style="margin-top:16px;border-top:1px solid #eef2f7;padding-top:14px">
      <button class="act" style="width:100%;background:#fff7ed;color:#9a3412;border:1px solid #fdba74" onclick="doAdvance()">${(r.stage||0)===0?(ic('repeat',16)+'ส่งต่อให้ '+(r.sales==='W'?'K':'W')+' เลย (ไม่รอครบ 3 รอบ)'):(ic('trash',16)+'คัดออกถาวรเลย')}</button>
    </div>
    <div class="rm"><div class="sec">นำออก (ย้ายไปถัง กู้คืนได้)</div>
      <div class="grid"><button onclick="doArchive('unreachable')">${ic('trash',15)}เบอร์ติดต่อไม่ได้</button><button onclick="doArchive('bad_data')">${ic('trash',15)}ข้อมูลไม่ครบ/เสีย</button></div></div>`;
  document.getElementById('mbg').classList.add('on');
}
function sheetCall(ev){ if(!CUR)return; api('/api/lead/call',{key:CUR.key}).then(async j=>{ if(j&&advToast(j.advanced)){closeSheet();await reload();return;} toast('บันทึกการโทรแล้ว'); await reload(); openLeadByKey(CUR.key); }); }
async function setCalls(n){
  if(!CUR)return;
  const j=await api('/api/lead/update',{key:CUR.key,patch:{callCount:n}});
  if(j&&j.ok){
    if(advToast(j.advanced)){ closeSheet(); reload(); return; }
    toast(n===0?'ล้างจำนวนโทรแล้ว':('ปรับเป็นโทรครั้งที่ '+n));
    await reload(); openLeadByKey(CUR.key);
  }
}
function closeSheet(){document.getElementById('mbg').classList.remove('on');CUR=null;}
async function tapOut(k){
  if(!CUR)return;
  const o=OUT.find(x=>x.k===k);if(!o)return;
  if(k==='appointment'){ showAppt(); return; }
  const j=await api('/api/lead/update',{key:CUR.key,patch:o.patch});
  if(j&&j.ok){ if(!advToast(j.advanced)) toast('บันทึกแล้ว: '+o.label); closeSheet(); reload(); }
}
function showAppt(){
  const box=document.getElementById('apptbox');
  let val=''; try{ const base=CUR.nextAppt?new Date(CUR.nextAppt):(()=>{const d=new Date();d.setDate(d.getDate()+1);d.setHours(10,0,0,0);return d;})(); const p=n=>String(n).padStart(2,'0'); val=base.getFullYear()+'-'+p(base.getMonth()+1)+'-'+p(base.getDate())+'T'+p(base.getHours())+':'+p(base.getMinutes()); }catch(e){}
  box.innerHTML=`<div class="apptbox"><div style="display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:8px">${ic('calendar',16)}เลือกวัน-เวลานัดครั้งถัดไป</div><input type="datetime-local" id="appt" value="${val}"><div class="row2"><button class="act b-cancel" style="flex:1" onclick="document.getElementById('apptbox').innerHTML=''">ยกเลิก</button><button class="act b-save" style="flex:2" onclick="saveAppt()">ยืนยันนัดหมาย</button></div></div>`;
  box.scrollIntoView({behavior:'smooth',block:'center'});
}
async function saveAppt(){
  if(!CUR)return; const v=document.getElementById('appt').value;
  const iso=v?new Date(v).toISOString():'';
  const j=await api('/api/lead/update',{key:CUR.key,patch:{contact:'reached',reachStatus:'appointment',nextAppt:iso}});
  if(j&&j.ok){ toast('บันทึกนัดหมายแล้ว'); closeSheet(); reload(); }
}
async function tapLine(v){
  if(!CUR)return; const nv=CUR.line===v?'':v; CUR.line=nv;
  const j=await api('/api/lead/update',{key:CUR.key,patch:{line:nv}});
  if(j&&j.ok){ toast(nv==='added'?'ทำเครื่องหมายแอดไลน์แล้ว':(nv==='not_added'?'ยังไม่แอดไลน์':'ล้างสถานะไลน์')); reload();
    document.querySelectorAll('.lineseg button').forEach((b,i)=>b.className=((i===0&&nv==='added')||(i===1&&nv==='not_added'))?'on':''); }
}
function toggleNote(){const n=document.getElementById('notebox');n.style.display=n.style.display==='none'?'block':'none';}
async function saveNote(){ if(!CUR)return; const t=document.getElementById('note').value; const j=await api('/api/lead/update',{key:CUR.key,patch:{note:t}}); if(j&&j.ok){toast('บันทึกโน้ตแล้ว');reload();} }
async function doArchive(reason){ if(!CUR)return; if(!confirm('ย้ายไปถัง "นำออกแล้ว"? (กู้คืนได้)'))return; const j=await api('/api/lead/archive',{key:CUR.key,reason}); if(j&&j.ok){toast('นำออกแล้ว');closeSheet();reload();} }
async function doRestore(){ if(!CUR)return; const j=await api('/api/lead/restore',{key:CUR.key}); if(j&&j.ok){toast('กู้คืนแล้ว');closeSheet();reload();} }
async function doAdvance(){
  if(!CUR)return;
  const isTransfer=(CUR.stage||0)===0; const other=CUR.sales==='W'?'K':'W';
  if(!confirm(isTransfer?('ส่งต่อลูกค้ารายนี้ให้ '+other+' เลยใช่ไหม? (เริ่มนับรอบใหม่)'):'คัดลูกค้ารายนี้ออกถาวรเลยใช่ไหม? (แอดมินกู้คืนได้)'))return;
  const j=await api('/api/lead/advance',{key:CUR.key});
  if(j&&j.ok){ if(!advToast(j.advanced)) toast('ดำเนินการแล้ว'); closeSheet(); reload(); }
}
async function reload(){
  const url='/api/leads'+(ME.role==='admin'&&ME.side?('?side='+ME.side):'');
  const r=await fetch(url); if(r.status===401){location.href='/login';return;} const j=await r.json();
  ACTIVE=j.active||[]; ARCHIVED=j.archived||[]; render();
}
async function init(){
  const r=await fetch('/api/me'); if(r.status===401){location.href='/login';return;} ME=await r.json();
  let side=ME.side;
  if(ME.role==='admin'){ const u=new URLSearchParams(location.search).get('side'); side=(u==='K'?'K':'W'); ME.side=side;
    document.getElementById('switch').innerHTML='โหมดแอดมิน · ดูฝั่ง: <a onclick="location.search=\'?side=W\'">W</a> | <a onclick="location.search=\'?side=K\'">K</a> · <a href="/">กลับหน้าแอดมิน</a>'; }
  document.getElementById('head').classList.add((side||'w').toLowerCase());
  document.getElementById('title').textContent='งานของฉัน — Sales ('+(side||'?')+')';
  await reload();
}
init();
setInterval(()=>{ if(!document.getElementById('mbg').classList.contains('on')) reload(); }, 30000);
</script>
</body>
</html>
