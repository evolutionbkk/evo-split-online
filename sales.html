<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>งานของฉัน — เซลล์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#2563eb;--brand-2:#3b82f6;--brand-deep:#1e3a8a;
    --grad-w:linear-gradient(135deg,#1e3a8a 0%,#2563eb 55%,#3b82f6 100%);
    --grad-k:linear-gradient(135deg,#111c3a 0%,#26327a 55%,#4f46e5 100%);
    --ink:#0f172a;--muted:#64748b;--line:#e6ecf5;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(30,58,138,.06);--shadow-sm:0 1px 2px rgba(16,24,40,.04),0 2px 6px rgba(30,58,138,.05);--shadow-lg:0 2px 6px rgba(16,24,40,.05),0 18px 44px rgba(30,58,138,.13)
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Noto Sans Thai","Sarabun","Tahoma",system-ui,sans-serif;color:var(--ink);background:radial-gradient(1100px 380px at 50% -150px,#dbe7fb,transparent),#f4f7fc;font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  ::selection{background:#c7dcff;color:#0f172a}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:#cbd6e6;border-radius:9px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#adc0dc}
  ::-webkit-scrollbar-track{background:transparent}
  .chip,.pchip,.act,.dialbtn,.lo,.lineseg button,a.tel,.editname,.closeX{transition:background .16s ease,box-shadow .18s ease,transform .12s ease,border-color .16s ease,color .16s ease}
  .lrow td{transition:background .14s ease}
  .act:active,.dialbtn:active,.lo:active,.chip:active,.pchip:active{transform:translateY(1px)}
  .wrap{max-width:1180px;margin:0 auto;padding:12px 12px 90px}
  .ic{display:inline-block;vertical-align:-2px;flex:0 0 auto}
  .head{position:sticky;top:0;z-index:10;border-radius:0 0 18px 18px;padding:15px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;margin:-12px -12px 14px;box-shadow:0 10px 30px rgba(37,99,235,.22),inset 0 1px 0 rgba(255,255,255,.16)}
  .head.w{background:var(--grad-w)}.head.k{background:var(--grad-k)}
  .head h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
  .head .lo{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:8px 14px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;backdrop-filter:blur(4px)}
  .switch{font-size:12.5px;color:var(--muted);margin:0 2px 12px}.switch a{color:var(--brand);text-decoration:none;font-weight:600;cursor:pointer}
  .chips{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:2px 16px;margin-bottom:12px}
  .fgroup{display:flex;align-items:flex-start;gap:14px;padding:11px 0;border-bottom:1px solid #f0f3f8}
  .fgroup:last-child{border-bottom:0}
  .flabel{flex:0 0 116px;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:700;margin:0;padding-top:8px}
  .flabel .ic{color:var(--brand)}
  .frow{flex:1;display:flex;gap:7px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap;font-weight:600;color:#334155;transition:.15s}
  .chip:hover{background:#eef4ff;border-color:#c7d7f0}
  @media(max-width:560px){.chips{padding:2px 12px}.fgroup{flex-direction:column;gap:7px;padding:10px 0}.flabel{flex-basis:auto;padding-top:0}}
  .chip b{background:#eef2f8;color:#475569;font-weight:700;border-radius:6px;padding:1px 6px;font-size:12px;min-width:18px;text-align:center}
  .chip.on{background:var(--grad-w);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(37,99,235,.30)}
  .chip.on b{background:rgba(255,255,255,.24);color:#fff}
  .buckets{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .bkt{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 15px;cursor:pointer;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:5px}
  .bkt .bn{font-size:26px;font-weight:800;color:#0f172a;line-height:1}
  .bkt .bl{font-size:12.5px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px}
  .bkt .bl .ic{color:var(--brand)}
  .bkt.on{border-color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand),0 8px 20px rgba(37,99,235,.14)}
  .bkt.on .bn{color:var(--brand-deep)}
  .bkt.b-over.on{border-color:#dc2626;box-shadow:inset 0 0 0 1.5px #dc2626,0 8px 20px rgba(220,38,38,.13)}
  .bkt.b-over.on .bn{color:#b91c1c}.bkt.b-over .bl .ic{color:#dc2626}
  .bkt.b-won.on{border-color:#16a34a;box-shadow:inset 0 0 0 1.5px #16a34a,0 8px 20px rgba(22,163,74,.13)}
  .bkt.b-won.on .bn{color:#166534}.bkt.b-won .bl .ic{color:#16a34a}
  @media(max-width:640px){.buckets{grid-template-columns:repeat(2,1fr)}}
  .orderbox{background:#f7faff;border:1px solid #dbe7fb;border-radius:13px;padding:6px 14px;margin-bottom:16px}
  .orow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:13.5px}
  .orow+.orow{border-top:1px dashed #e6ecf5}
  .orow .ok{color:#64748b;font-weight:600;flex:0 0 auto}
  .orow .ov{color:#0f172a;font-weight:700;text-align:right;word-break:break-word}
  .b-step{background:#eef2ff;color:#4338ca;font-weight:700}
  .search{position:relative;margin-bottom:12px}
  .search .si{position:absolute;left:14px;top:22px;transform:translateY(-50%);color:#94a3b8;pointer-events:none}
  .search input{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 14px 12px 40px;font-family:inherit;font-size:15px;background:#fff;box-shadow:var(--shadow-sm)}
  .search input:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 10px;border-radius:8px;font-weight:600}
  .b-new{background:#eef2ff;color:#3730a3}.b-un{background:#fef2f2;color:#b42318}.b-nr{background:#e0f2fe;color:#075985}
  .b-ap{background:#e0f2fe;color:#075985}.b-cl{background:#dcfce7;color:#166534}.b-reached{background:#ecfdf5;color:#047857}
  .b-line{background:#e7f9ee;color:#15803d}.b-arch{background:#f1f5f9;color:#64748b}
  .i-hot{background:#fee2e2;color:#b91c1c}.i-warm{background:#ffedd5;color:#9a3412}.i-cold{background:#e0f2fe;color:#075985}
  .empty{text-align:center;color:var(--muted);padding:34px;background:#fff;border:1px dashed var(--line);border-radius:16px;box-shadow:var(--shadow-sm)}
  .tblwrap{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow-x:auto}
  .ltbl{width:max-content;min-width:100%;border-collapse:collapse;font-size:14px}
  .ltbl th{position:sticky;top:0;background:#f7f9fc;text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:11px 15px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
  .ltbl td{padding:10px 15px;border-bottom:1px solid #f0f3f8;vertical-align:middle;font-size:13px}
  .ltbl td.codecell,.ltbl th:nth-child(2){padding-right:26px}
  .ltbl td.nmc,.ltbl th:nth-child(3){padding-left:8px}
  .ltbl tbody tr:last-child td{border-bottom:0}
  .ltbl tbody tr:nth-child(even){background:#fbfcfe}
  .lrow{cursor:pointer}
  .lrow:hover td{background:#eef4ff}
  .ltbl td.num{color:var(--muted);text-align:center;width:42px;font-size:12.5px}
  .ltbl td.nmc{font-weight:700;color:#0f172a;white-space:nowrap}
  .ltbl td.codec{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .ltbl td.codecell{font-weight:700;color:#1d4ed8;white-space:nowrap;font-size:13px}
  .ltbl td.stc{white-space:nowrap;vertical-align:top;padding-top:12px}
  .ltbl td.stc .badge{margin-right:4px}
  .pagebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 4px 4px;margin-top:8px}
  .pgnums{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .pgright{display:flex;align-items:center;gap:12px}
  .pgbtn{min-width:34px;height:34px;padding:0 9px;border:1px solid var(--line);background:#fff;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;color:#334155;cursor:pointer}
  .pgbtn:hover:not(:disabled){background:#f1f5f9}
  .pgbtn.on{background:#2563eb;border-color:#2563eb;color:#fff}
  .pgbtn:disabled{opacity:.4;cursor:default}
  .pgdot{color:#94a3b8;padding:0 4px}
  .pginfo{font-size:12.5px;color:#64748b}
  .pgsel{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;background:#fff;cursor:pointer}
  .ltbl td.prog{text-align:center;color:#475569;font-weight:600;white-space:nowrap}
  .ltbl td.linec{text-align:center}
  .ltbl td.notec{color:#475569;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  .ltbl td.ordc{max-width:250px;white-space:normal;overflow:visible;color:#334155}
  .ltbl td.ordc>span{display:block;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ltbl a.tel{display:inline-flex;align-items:center;gap:5px;color:#1d4ed8;font-weight:700;text-decoration:none;white-space:nowrap}
  .lrow.k a.tel{color:#4338ca}
  .dash{color:#cbd5e1}
  .mbg{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);display:none;justify-content:flex-end;z-index:40}
  .mbg.on{display:flex}
  .sheet{background:#fff;width:460px;max-width:100%;height:100vh;overflow:auto;padding:18px 20px 40px;box-shadow:-16px 0 44px rgba(15,23,42,.20);position:relative;animation:slideIn .22s ease}
  @keyframes slideIn{from{transform:translateX(34px);opacity:.3}to{transform:translateX(0);opacity:1}}
  @media(max-width:520px){.sheet{width:100%}}
  .closeX{position:absolute;top:14px;right:16px;background:#f1f5f9;border:0;border-radius:50%;width:34px;height:34px;cursor:pointer;color:#475569;display:inline-flex;align-items:center;justify-content:center;z-index:2}
  .sheet h3{margin:0 0 3px;font-size:20px;padding-right:44px;color:#0f172a;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .editname{background:#eef4ff;border:1px solid #dbe7fb;border-radius:8px;width:30px;height:30px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brand);padding:0}
  .sheet h3 input{flex:1;min-width:0;border:1.5px solid var(--brand);border-radius:9px;padding:7px 10px;font-family:inherit;font-size:18px;font-weight:700}
  .sheet .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .dialbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--grad-w);color:#fff;text-decoration:none;font-weight:700;font-size:16px;border-radius:13px;padding:14px;margin-bottom:16px;box-shadow:0 8px 20px rgba(37,99,235,.26)}
  .sec{font-size:13px;color:var(--muted);font-weight:700;margin:0 0 9px}
  .pchips{display:flex;flex-wrap:wrap;gap:6px}
  .pchips.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pchips.g3 .pchip{justify-content:center;padding-left:6px;padding-right:6px}
  @media(max-width:400px){.pchips.g3{grid-template-columns:repeat(2,1fr)}}
  .pchip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:#334155;white-space:nowrap}
  .pchip svg.ic{width:14px;height:14px}
  .pchip .ic{color:inherit;opacity:.75}
  .pchip.on{border-color:var(--brand);background:#eff5ff;color:var(--brand-deep);box-shadow:inset 0 0 0 1px var(--brand)}
  .pchip.on .ic{opacity:1}
  .pchip.s-won.on{border-color:#16a34a;background:#f0fdf4;color:#166534;box-shadow:inset 0 0 0 1px #16a34a}
  .pchip.s-lost.on{border-color:#dc2626;background:#fef2f2;color:#b42318;box-shadow:inset 0 0 0 1px #dc2626}
  .pchip.s-followup.on{border-color:#0284c7;background:#f0f9ff;color:#075985;box-shadow:inset 0 0 0 1px #0284c7}
  .pchip.i-hot.on{border-color:#dc2626;background:#fef2f2;color:#b91c1c;box-shadow:inset 0 0 0 1px #dc2626}
  .pchip.i-warm.on{border-color:#ea580c;background:#fff7ed;color:#9a3412;box-shadow:inset 0 0 0 1px #ea580c}
  .pchip.i-cold.on{border-color:#0284c7;background:#f0f9ff;color:#075985;box-shadow:inset 0 0 0 1px #0284c7}
  .salebox{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:13px;padding:12px}
  .saleitem{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #dcfce7}
  .saleitem+.saleitem{}
  .saleitem .sn{flex:1;font-weight:600;font-size:14px;color:#0f172a;word-break:break-word}
  .saleitem .sp{font-weight:700;color:#166534;white-space:nowrap}
  .saleitem .sx{background:#fff;border:1px solid #e2e8f0;border-radius:8px;width:28px;height:28px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#b42318;padding:0}
  .saleadd{display:flex;gap:8px;margin-top:10px}
  .saleadd input{border:1px solid #bbf7d0;border-radius:9px;padding:10px;font-family:inherit;font-size:14px;background:#fff}
  .saleadd #sname{flex:1;min-width:0}
  .saleadd #sprice{width:92px;flex:0 0 auto}
  .saletotal{margin-top:11px;padding-top:9px;border-top:1px dashed #bbf7d0;font-size:14px;color:#166534;font-weight:600;text-align:right}
  .saletotal b{font-size:17px}
  .apptbox{margin-top:2px;background:#eff6ff;border:1px solid #cfe4fb;border-radius:13px;padding:13px}
  .apptbox input{width:100%;border:1px solid #bcd9f5;border-radius:10px;padding:11px;font-family:inherit;font-size:15px;margin-bottom:10px}
  .row2{display:flex;gap:9px}
  .lineseg{display:flex;gap:9px;margin:0 0 2px}
  .lineseg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#334155}
  .lineseg button.on{border-color:#15803d;background:#f0fdf4;color:#15803d}
  textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-family:inherit;font-size:15px;resize:vertical}
  .act{font-family:inherit;font-weight:700;border:0;border-radius:12px;padding:13px;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
  .b-save{background:var(--brand);color:#fff}.b-cancel{background:#eef2f7;color:var(--ink)}.b-restore{background:var(--brand-deep);color:#fff;width:100%}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .rm{margin-top:16px;border-top:1px solid #eef2f7;padding-top:14px}
  .rm .grid button{border:1px solid #f3cccc;background:#fff;color:#b42318;border-radius:12px;padding:12px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .tl{position:relative}
  .tlitem{display:flex;gap:11px;padding:7px 0;position:relative}
  .tlitem:not(:last-child)::before{content:'';position:absolute;left:13px;top:29px;bottom:-7px;width:2px;background:#e6ecf5}
  .tlic{flex:0 0 auto;width:27px;height:27px;border-radius:50%;background:#eff5ff;color:var(--brand);display:inline-flex;align-items:center;justify-content:center;z-index:1}
  .tlbody{flex:1;min-width:0;padding-top:2px}
  .tltxt{font-size:13.5px;font-weight:600;color:#0f172a;line-height:1.3}
  .tlmeta{font-size:11.5px;color:#94a3b8;margin-top:2px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:60;font-weight:600}
  .toast.on{opacity:1}
  .applayout{margin:0;max-width:none;padding:0}
  .side{position:fixed;top:0;left:0;height:100vh;width:248px;background:#0f172a;padding:20px 14px;overflow-y:auto;box-shadow:2px 0 24px rgba(15,23,42,.10);z-index:20}
  .side .brand{color:#fff;font-weight:800;font-size:15px;padding:4px 10px 14px;line-height:1.3;border-bottom:1px solid #1e293b;margin-bottom:10px}
  .side .brand small{display:block;color:#94a3b8;font-weight:600;font-size:11.5px;margin-top:3px}
  .side .nav{display:flex;flex-direction:column;gap:3px}
  .side .nav button{display:flex;align-items:center;justify-content:flex-start;gap:10px;width:100%;text-align:left;background:transparent;border:none;color:#cbd5e1;font-size:14px;font-weight:600;padding:12px 12px;border-radius:10px;cursor:pointer;transition:background .15s}
  .side .nav button>span:not(.rfn){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side .nav button svg{flex:0 0 auto}
  .side .nav button:hover{background:#1e293b;color:#fff}
  .side .nav button.on{background:#2563eb;color:#fff}
  .side .nav button .rfn{margin-left:auto;background:#db2777;color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:0 7px}
  .applayout .wrap{margin:0 0 0 248px;max-width:1180px;padding:18px 22px 90px}
  [data-sec]{display:none}[data-sec].shown{display:block}
  @media(max-width:900px){.side{position:static;height:auto;width:100%;box-shadow:none}.side .nav{flex-direction:row;flex-wrap:wrap}.side .nav button{width:auto;flex:1;min-width:120px}.applayout .wrap{margin:0;padding:12px 12px 90px}}
</style>
</head>
<body>
<div class="applayout">
  <nav class="side">
    <div class="brand" id="brandbox">งานของฉัน<small id="brandsub">Telesales</small></div>
    <div class="nav" id="navmenu"></div>
  </nav>
  <div class="wrap">
  <div class="head" id="head"><h1><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6a1 1 0 0 1 1 1v1h1a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1z"/><path d="M9 4h6"/></svg><span id="title">งานของฉัน</span></h1><form method="POST" action="/logout"><button class="lo">ออกจากระบบ</button></form></div>
  <div class="switch" id="switch"></div>

  <div data-sec="overview"><div id="ovBody"></div></div>

  <div data-sec="leads">
    <div class="buckets" id="buckets"></div>
    <div id="srcseg" style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap"></div>
    <div class="chips" id="chips"></div>
    <div class="search"><span class="si"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span><input type="text" id="search" placeholder="ค้นหา ชื่อ / เบอร์ / รหัส…" oninput="render()"></div>
    <div id="list"></div>
  </div>

  <div data-sec="refill">
    <h2 style="font-size:16px;margin:0 0 4px">ลูกค้าเดิม · ควรโทรชวนซื้อซ้ำ</h2>
    <div style="font-size:12.5px;color:#64748b;margin-bottom:12px">ลูกค้าที่เคยซื้อ (เซรั่มน่าจะใช้หมดแล้ว) และถูกส่งเข้าคิวให้คุณ · โทรชวนสั่งซ้ำ ปิดง่ายกว่าลูกค้าใหม่</div>
    <div id="rfBody2"></div>
  </div>
  </div>
</div>
<div class="mbg" id="mbg" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICONS={
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
  phoneOff:'<path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 3.07 8.63M2 2l20 20"/>',
  slash:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  star:'<path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77 5.82 21l1.18-6.88-5-4.87 6.91-1.01z"/>',
  send:'<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  message:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  checkCircle:'<circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  xCircle:'<circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/>',
  repeat:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  undo:'<path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  dot:'<circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/>'
};
function ic(name,size){size=size||16;const p=ICONS[name]||'';return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;}

// ---- CRM option sets ----
const LEAD_STATUS=[
  {k:'new',label:'ใหม่',icon:'dot',chip:'',badge:'b-new'},
  {k:'contacting',label:'กำลังติดต่อ',icon:'phone',chip:'',badge:'b-ap'},
  {k:'interested',label:'สนใจ',icon:'star',chip:'',badge:'b-reached'},
  {k:'followup',label:'นัดติดตาม',icon:'calendar',chip:'s-followup',badge:'b-nr'},
  {k:'won',label:'ปิดการขาย',icon:'checkCircle',chip:'s-won',badge:'b-cl'},
  {k:'lost',label:'ไม่ปิดการขาย',icon:'xCircle',chip:'s-lost',badge:'b-un'}
];
const CALL_RESULTS=[
  {k:'connected',label:'ติดต่อได้',icon:'phone'},
  {k:'no_answer',label:'ไม่รับสาย',icon:'phoneOff'},
  {k:'hung_up',label:'วางสาย',icon:'phoneOff'},
  {k:'wrong_number',label:'เบอร์ผิด',icon:'slash'}
];
const INTEREST=[
  {k:'hot',label:'มาก (100%)',chip:'i-hot',badge:'i-hot'},
  {k:'warm',label:'ปานกลาง (50%)',chip:'i-warm',badge:'i-warm'},
  {k:'cold',label:'ต่ำ (25%)',chip:'i-cold',badge:'i-cold'}
];
const NEXT_ACTIONS=[
  {k:'callback',label:'โทรกลับ',icon:'phone'},
  {k:'send_info',label:'ส่งข้อมูล',icon:'send'},
  {k:'meeting',label:'นัดประชุม',icon:'calendar'}
];
const LOST_REASONS=['ราคาแพง','ซื้อที่อื่น','ไม่มีงบ','ติดต่อไม่ได้','ไม่สนใจ','อื่นๆ'];
// รายการสินค้า/เซตโปรโมชั่นสำหรับเลือกตอนปิดการขาย (แก้ไข/เพิ่มรายการจริงได้ที่นี่ · เซลล์พิมพ์เพิ่มเองได้)
const PRODUCTS=['เซตโปรโมชั่น A','เซตโปรโมชั่น B','เซตโปรโมชั่น C','สินค้าเดี่ยว'];
function optMeta(arr,k){return arr.find(x=>x.k===k)||null;}
function optLabel(arr,k){const o=optMeta(arr,k);return o?o.label:'';}
function saleTotal(r){return (r.saleItems||[]).reduce((s,i)=>s+(Number(i.price)||0),0);}
function fmtBaht(n){return (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2});}

let ME={role:'',side:''},ACTIVE=[],ARCHIVED=[],FILTER='new',CURLIST=[],CUR=null,SRC='all';
let PAGE=1,PER=30,LAST_SIG='';
// แหล่งที่มาของลีด: Marketplace = Facebook/Pancake (source pancake/manual) · E-commerce = เว็บ Evolution (ที่เหลือ)
function srcGroup(r){return (r.source==='pancake'||r.source==='manual'||r.source==='refill')?'mkt':'ecom';}
function setSrc(s){SRC=s;render();}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1600);}
function fmtShort(v){if(!v)return'';try{const d=new Date(v),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes());}catch(e){return'';}}
function fmtFull(v){if(!v)return'';try{const d=new Date(v),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+String((d.getFullYear()+543)%100).padStart(2,'0')+' '+p(d.getHours())+':'+p(d.getMinutes());}catch(e){return'';}}
function histLabel(e){
  const v=e.v||'';
  switch(e.k){
    case 'call':return{ic:'phone',txt:'โทรออก'};
    case 'status':return{ic:'activity',txt:'เปลี่ยนสถานะ → '+(optLabel(LEAD_STATUS,v)||v||'-')};
    case 'result':return{ic:'phone',txt:'ผลการโทร: '+(optLabel(CALL_RESULTS,v)||'ล้าง')};
    case 'interest':return{ic:'star',txt:'ความสนใจ: '+(optLabel(INTEREST,v)||'ล้าง')};
    case 'action':return{ic:'send',txt:'ขั้นถัดไป: '+(optLabel(NEXT_ACTIONS,v)||'ล้าง')};
    case 'followup':return{ic:'calendar',txt:v?('นัดติดตาม: '+fmtShort(v)):'ล้างวันนัด'};
    case 'lost':return{ic:'xCircle',txt:'เหตุผลไม่ปิด: '+(v||'ล้าง')};
    case 'note':return{ic:'pencil',txt:'อัปเดตหมายเหตุการสนทนา'};
    case 'name':return{ic:'pencil',txt:'แก้ชื่อเป็น '+(v||'-')};
    case 'address':return{ic:'pencil',txt:'อัปเดตที่อยู่ลูกค้า'};
    case 'sale':return{ic:'plus',txt:'อัปเดตสินค้า/ยอดขาย ('+(v||0)+' รายการ)'};
    case 'calls':return{ic:'phone',txt:'ปรับจำนวนโทรเป็น '+(v||0)};
    case 'archive':return{ic:'trash',txt:'นำออก'+(v==='unreachable'?' (เบอร์ติดต่อไม่ได้)':(v==='recycled_out'?' (คัดออกถาวร)':' (ข้อมูลเสีย)'))};
    case 'restore':return{ic:'undo',txt:'กู้คืนกลับรายชื่อ'};
    case 'transfer':return{ic:'repeat',txt:'ส่งต่อให้ '+(v||'')};
    case 'recycle':return{ic:'trash',txt:'คัดออกถาวร (วนครบ)'};
    default:return{ic:'dot',txt:e.k};
  }
}
function whoLabel(by){return by==='ระบบ'?'ระบบอัตโนมัติ':(by?('โดย '+by):'');}
function buildTimeline(r){
  const h=(r.history||[]).slice().reverse();
  if(!h.length)return '<div style="font-size:12.5px;color:#94a3b8;padding:2px 0">ยังไม่มีประวัติการติดต่อ</div>';
  return '<div class="tl">'+h.map(e=>{const m=histLabel(e);return `<div class="tlitem"><span class="tlic">${ic(m.ic,14)}</span><div class="tlbody"><div class="tltxt">${esc(m.txt)}</div><div class="tlmeta">${esc(fmtFull(e.at))}${e.by?(' · '+esc(whoLabel(e.by))):''}</div></div></div>`;}).join('')+'</div>';
}
function advToast(adv){
  if(!adv)return false;
  if(adv.action==='transferred'){toast('ครบ 3 ครั้ง — ส่งต่อให้ '+adv.to+' อัตโนมัติ');return true;}
  if(adv.action==='recycled_out'){toast('ครบ 2 มือ — ย้ายไปถังคัดออกถาวร');return true;}
  return false;
}
function daysIdle(r){if(!r.lastActivity)return 0;const d=Date.parse(r.lastActivity);if(isNaN(d))return 0;return Math.floor((Date.now()-d)/86400000);}
function isStale(r){const st=r.leadStatus||'new';if(r.archived||st==='won')return false;if(st==='followup'&&r.nextAppt){const t=Date.parse(r.nextAppt);if(!isNaN(t)&&t>Date.now())return false;}return daysIdle(r)>=3;}
function isToday(v){if(!v)return false;const d=new Date(v);if(isNaN(d))return false;const n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();}
function wonToday(r){if(r.archived||(r.leadStatus||'new')!=='won')return false;const h=r.history||[];for(let i=h.length-1;i>=0;i--){if(h[i].k==='status'&&h[i].v==='won')return isToday(h[i].at);}return isToday(r.lastActivity);}
function isOverdue(r){const st=r.leadStatus||'new';if(r.archived||st==='won'||st==='lost')return false;if(st==='followup'&&r.nextAppt){const t=Date.parse(r.nextAppt);if(!isNaN(t)&&t<Date.now())return true;}return isStale(r);}
function pass(r,f){
  const st=r.leadStatus||'new';
  switch(f){
    case 'all':return !r.archived;
    case 'todo':return !r.archived&&st!=='won'&&st!=='lost';
    case 'new':return !r.archived&&st==='new';
    case 'contacting':return !r.archived&&st==='contacting';
    case 'interested':return !r.archived&&st==='interested';
    case 'followup':return !r.archived&&st==='followup';
    case 'won':return !r.archived&&st==='won';
    case 'lost':return !r.archived&&st==='lost';
    case 'stale':return isStale(r);
    case 'overdue':return isOverdue(r);
    case 'won_today':return wonToday(r);
    case 'hot':return !r.archived&&r.interest==='hot';
    case 'warm':return !r.archived&&r.interest==='warm';
    case 'cold':return !r.archived&&r.interest==='cold';
    case 'hand2':return !r.archived&&(r.stage||0)>0;
    case 'line_added':return !r.archived&&r.line==='added';
    case 'line_not':return !r.archived&&r.line!=='added';
    case 'archived':return r.archived;
    default:return !r.archived;
  }
}
function cnt(f){const pool=f==='archived'?ARCHIVED:ACTIVE;return pool.filter(r=>pass(r,f)).length;}
const FILTER_GROUPS=[
  {icon:'inbox',label:'งานที่ต้องทำ',items:[['todo','ต้องติดตาม'],['new','ใหม่'],['followup','นัดติดตาม'],['stale','ค้างนาน']]},
  {icon:'activity',label:'สถานะลูกค้า',items:[['all','ทั้งหมด'],['contacting','กำลังติดต่อ'],['interested','สนใจ'],['won','ปิดการขาย'],['lost','ไม่ปิดการขาย'],['hand2','รับต่อมือ2'],['archived','นำออกแล้ว']]},
  {icon:'star',label:'ความสนใจ',items:[['hot','มาก'],['warm','ปานกลาง'],['cold','ต่ำ']]}
];
const BUCKETS=[
  {f:'new',label:'ลูกค้าใหม่',icon:'inbox',cls:''},
  {f:'followup',label:'ต้องโทรติดตาม',icon:'calendar',cls:''},
  {f:'overdue',label:'เกินกำหนด',icon:'clock',cls:'b-over'},
  {f:'won_today',label:'ปิดการขายวันนี้',icon:'checkCircle',cls:'b-won'}
];
function renderBuckets(){
  document.getElementById('buckets').innerHTML=BUCKETS.map(b=>`<div class="bkt ${b.cls} ${FILTER===b.f?'on':''}" onclick="setFilter('${b.f}')"><span class="bn">${cnt(b.f)}</span><span class="bl">${ic(b.icon,14)}${b.label}</span></div>`).join('');
}
function renderChips(){
  document.getElementById('chips').innerHTML=FILTER_GROUPS.map(g=>`<div class="fgroup"><div class="flabel">${ic(g.icon,14)}<span>${g.label}</span></div><div class="frow">${g.items.map(([f,l])=>`<div class="chip ${FILTER===f?'on':''}" onclick="setFilter('${f}')"><span>${l}</span><b>${cnt(f)}</b></div>`).join('')}</div></div>`).join('');
}
function setFilter(f){FILTER=f;render();}
function renderSrcSeg(all,ecom,mkt){
  const segs=[['all','ทั้งหมด',all,'#334155'],['ecom','E-commerce (Evolution)',ecom,'#2563eb'],['mkt','Marketplace (Facebook)',mkt,'#db2777']];
  document.getElementById('srcseg').innerHTML=segs.map(([k,l,n,col])=>{
    const on=SRC===k;
    return `<button onclick="setSrc('${k}')" style="flex:1;min-width:130px;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 10px;border-radius:12px;border:1.5px solid ${on?col:'#e2e8f0'};background:${on?col:'#fff'};color:${on?'#fff':'#334155'};font-weight:700;font-size:13.5px;cursor:pointer"><span>${l}</span><b style="background:${on?'rgba(255,255,255,.25)':'#f1f5f9'};color:${on?'#fff':col};border-radius:8px;padding:1px 8px;font-size:12px">${n}</b></button>`;
  }).join('');
}
const q=()=>(document.getElementById('search').value||'').trim().toLowerCase();
function ms(r){const s=q();if(!s)return true;return[r.code,r.name,r.phone,r.address].some(v=>String(v==null?'':v).toLowerCase().includes(s));}
function rank(r){const m={new:0,contacting:1,followup:2,interested:3,won:4,lost:5};const v=m[r.leadStatus||'new'];return v==null?6:v;}
function render(){
  renderBuckets();
  renderChips();
  const pool=FILTER==='archived'?ARCHIVED:ACTIVE;
  let list=pool.filter(r=>pass(r,FILTER)&&ms(r));
  if(FILTER!=='archived')list=list.slice().sort((a,b)=>rank(a)-rank(b));
  // แยกกลุ่มแหล่งที่มา: E-commerce (Evolution) vs Marketplace (Facebook/Pancake)
  renderSrcSeg(list.length, list.filter(r=>srcGroup(r)==='ecom').length, list.filter(r=>srcGroup(r)==='mkt').length);
  if(SRC!=='all')list=list.filter(r=>srcGroup(r)===SRC);
  // pagination — reset to page 1 when the filter/search/source changes
  const sig=FILTER+'|'+SRC+'|'+q();
  if(sig!==LAST_SIG){PAGE=1;LAST_SIG=sig;}
  const total=list.length;
  const pages=Math.max(1,Math.ceil(total/PER));
  if(PAGE>pages)PAGE=pages; if(PAGE<1)PAGE=1;
  const offset=(PAGE-1)*PER;
  const pageList=list.slice(offset,offset+PER);
  CURLIST=pageList;
  const box=document.getElementById('list');
  if(!total){box.innerHTML='<div class="empty">ไม่มีรายชื่อในกลุ่มนี้</div>';return;}
  const kc=ME.side==='K'?'k':'';
  const rows=pageList.map((r,i)=>{
    const sm=optMeta(LEAD_STATUS,r.leadStatus||'new')||LEAD_STATUS[0];
    const sg=srcGroup(r);
    const STCOL={new:'#2563eb',contacting:'#0891b2',interested:'#7c3aed',followup:'#0e7490',won:'#16a34a',lost:'#b91c1c'};
    const stItems=[];
    if(r.step)stItems.push({t:r.step,c:'#7c3aed'});
    stItems.push({t:sm.label,c:STCOL[r.leadStatus||'new']||'#334155'});
    stItems.push(sg==='mkt'?{t:'FB',c:'#9d174b'}:{t:'E-commerce',c:'#1e40af'});
    if(r.vip&&(r.vip.key==='gold'||r.vip.key==='silver'))stItems.push({t:r.vip.label,c:r.vip.color});
    if(r.realCalls>0)stItems.push({t:'โทรแล้ว '+r.realCalls+(r.realTalkCalls?(' · คุย '+r.realTalkCalls):''),c:'#166534'});
    if(!r.archived&&r.stage>0)stItems.push({t:'มือ 2',c:'#854d0e'});
    if(isStale(r)){const d=daysIdle(r);stItems.push({t:'ค้าง '+d+' วัน',c:'#b91c1c'});}
    const stCell=stItems.map(x=>`<div style="color:${x.c};font-weight:600;font-size:12px;line-height:1.65;white-space:nowrap">• ${esc(x.t)}</div>`).join('');
    const im=optMeta(INTEREST,r.interest);
    const interestCell=im?`<span class="badge ${im.badge}">${im.label}</span>`:'<span class="dash">–</span>';
    const cr=optLabel(CALL_RESULTS,r.callResult), na=optLabel(NEXT_ACTIONS,r.nextAction);
    const ordCell=(r.product||r.orderAmount>0)
      ? `${r.product?('<span title="'+esc(r.product)+'">'+esc(r.product)+'</span>'):''}${r.orderAmount>0?('<div style="color:#166534;font-weight:700;margin-top:2px">฿'+fmtBaht(r.orderAmount)+'</div>'):''}`
      : '<span class="dash">–</span>';
    return `<tr class="lrow ${kc}" onclick="openLead(${i})">
      <td class="num">${offset+i+1}</td>
      <td class="codecell">${esc(r.code)}</td>
      <td class="nmc">${esc(r.name)||'(ไม่มีชื่อ)'}</td>
      <td class="notec ordc">${ordCell}</td>
      <td><a class="tel" href="tel:${esc(r.phone)}" onclick="logCall(${i},event)">${ic('phone',14)}${esc(r.phone)}</a></td>
      <td class="stc">${stCell}</td>
      <td class="codec">${r.closer?esc(r.closer):'<span class="dash">–</span>'}</td>
      <td>${cr?esc(cr):'<span class="dash">–</span>'}</td>
      <td class="linec">${interestCell}</td>
      <td>${na?esc(na):'<span class="dash">–</span>'}</td>
      <td class="codec">${r.nextAppt?esc(fmtShort(r.nextAppt)):'<span class="dash">–</span>'}</td>
      <td class="prog">${esc(r.sales)}</td>
      <td class="codec">${r.lostReason?esc(r.lostReason):'<span class="dash">–</span>'}</td>
      <td class="codec">${r.lastCallAt?esc(fmtShort(r.lastCallAt)):'<span class="dash">–</span>'}</td>
      <td class="prog">${r.callCount||0}</td>
      <td class="codec">${(r.saleItems&&r.saleItems.length)?esc(r.saleItems.length+' รายการ · ฿'+fmtBaht(saleTotal(r))):'<span class="dash">–</span>'}</td>
      <td class="notec" title="${esc(r.address)}">${r.address?esc(r.address):'<span class="dash">–</span>'}</td>
      <td class="notec" title="${esc(r.note)}">${r.note?esc(r.note):''}</td>
    </tr>`;
  }).join('');
  box.innerHTML=`<div class="tblwrap"><table class="ltbl"><thead><tr><th class="num">#</th><th>รหัสลูกค้า</th><th>ชื่อ-นามสกุล</th><th>สินค้าที่สั่งซื้อ / ราคา</th><th>เบอร์โทร</th><th>สถานะลูกค้า</th><th>ปิดการขายโดย</th><th>ผลการโทร</th><th>ความสนใจ</th><th>Next Action</th><th>นัดถัดไป</th><th>ผู้รับผิดชอบ</th><th>เหตุผลไม่ปิด</th><th>โทรล่าสุด</th><th>ครั้งที่ติดต่อ</th><th>ยอดที่ปิดได้</th><th>ที่อยู่</th><th>หมายเหตุการสนทนา</th></tr></thead><tbody>${rows}</tbody></table></div>`+pageBar(total,pages);
}
function pageNumBtn(n){return `<button class="pgbtn ${n===PAGE?'on':''}" onclick="gotoPage(${n})">${n}</button>`;}
function pageBar(total,pages){
  if(total<=PER&&pages<=1){ return `<div class="pagebar"><span class="pginfo">ทั้งหมด ${total} รายชื่อ</span><select class="pgsel" onchange="setPer(this.value)">${[30,50,100,150,200,500,1000].map(n=>`<option value="${n}" ${n===PER?'selected':''}>${n} / หน้า</option>`).join('')}</select></div>`; }
  let lo=Math.max(1,PAGE-2),hi=Math.min(pages,PAGE+2);
  if(PAGE<=3){lo=1;hi=Math.min(pages,5);}
  if(PAGE>=pages-2){hi=pages;lo=Math.max(1,pages-4);}
  const b=[];
  b.push(`<button class="pgbtn" ${PAGE<=1?'disabled':''} onclick="gotoPage(${PAGE-1})">‹</button>`);
  if(lo>1){b.push(pageNumBtn(1)); if(lo>2)b.push('<span class="pgdot">…</span>');}
  for(let n=lo;n<=hi;n++)b.push(pageNumBtn(n));
  if(hi<pages){ if(hi<pages-1)b.push('<span class="pgdot">…</span>'); b.push(pageNumBtn(pages)); }
  b.push(`<button class="pgbtn" ${PAGE>=pages?'disabled':''} onclick="gotoPage(${PAGE+1})">›</button>`);
  const sel=`<select class="pgsel" onchange="setPer(this.value)">${[30,50,100,150,200,500,1000].map(n=>`<option value="${n}" ${n===PER?'selected':''}>${n} / หน้า</option>`).join('')}</select>`;
  return `<div class="pagebar"><div class="pgnums">${b.join('')}</div><div class="pgright"><span class="pginfo">ทั้งหมด ${total} · หน้า ${PAGE}/${pages}</span>${sel}</div></div>`;
}
function gotoPage(p){PAGE=p;render();try{document.querySelector('[data-sec="leads"], #list').scrollIntoView({block:'start'});}catch(e){}window.scrollTo(0,0);}
function setPer(v){PER=Number(v)||30;PAGE=1;render();}
async function api(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});if(r.status===401){location.href='/login';return null;}return r.json().catch(()=>({}));}
function logCall(i,ev){ev&&ev.stopPropagation();const r=CURLIST[i];if(!r)return;api('/api/lead/call',{key:r.key}).then(j=>{if(!(j&&advToast(j.advanced)))toast('บันทึกการโทรแล้ว');reload();});/* ไม่ preventDefault ให้ tel: โทรออกได้ */}
function openLead(i){ const r=CURLIST[i]; if(r) openLeadByKey(r.key); }
function openLeadByKey(key){
  const r=ACTIVE.concat(ARCHIVED).find(x=>x.key===key);if(!r)return;CUR=JSON.parse(JSON.stringify(r));

  const lostSection=(r.leadStatus==='lost')?`<div class="sec" style="margin-top:16px">เหตุผลที่ไม่ปิดการขาย</div><div class="pchips g3">${lostChips}</div>`:'';
  const wonSection=(r.leadStatus==='won')?buildWonSection(r):'';

  s.innerHTML=`<button class="closeX" onclick="closeSheet()">${ic('x',16)}</button>
    <h3 id="h3name"><span>${esc(r.name)||'(ไม่มีชื่อ)'}</span><button class="editname" onclick="editName()" title="แก้ไขชื่อลูกค้า">${ic('pencil',15)}</button></h3>
    <div class="sub">${esc(r.code)} · ผู้รับผิดชอบ Sales (${esc(r.sales)}) · ติดต่อ ${r.callCount||0} ครั้ง · มือที่ ${(r.stage||0)+1}/2${r.lastCallAt?' · โทรล่าสุด '+esc(fmtShort(r.lastCallAt)):''}</div>
    <a class="dialbtn" href="tel:${esc(r.phone)}" onclick="sheetCall(event)">${ic('phone',18)}โทรออก ${esc(r.phone)}</a>
    ${realCallBox(r)}
    ${orderBox(r)}
    <div id="cust360" style="margin:14px 0"></div>
    <div class="sec">โทรออกครั้งที่ (แตะเพื่อปรับจำนวน · ครบ 3 ครั้งส่งต่ออีกฝั่ง)</div>
    <div class="lineseg" style="gap:8px">
      <button class="${(r.callCount||0)>=1?'on':''}" onclick="setCalls(1)">ครั้งที่ 1</button>
      <button class="${(r.callCount||0)>=2?'on':''}" onclick="setCalls(2)">2</button>
      <button class="${(r.callCount||0)>=3?'on':''}" onclick="setCalls(3)">3</button>
      <button onclick="setCalls(0)" style="flex:0 0 auto;color:#6b7280;min-width:60px">ล้าง</button>
    </div>
    <div class="sec" style="margin-top:16px">สถานะลูกค้า (Lead Status)</div>
    <div class="pchips g3">${stChips}</div>
    <div style="display:flex;gap:6px;font-size:11.5px;color:var(--muted);margin-top:6px">${ic('info',14)}<span>ครบ 3 ครั้งยังไม่ "ปิดการขาย" และไม่มีนัด → ส่งต่ออีกฝั่งอัตโนมัติ · มือ 2 ครบอีก = คัดออกถาวร (แอดมินกู้ได้)</span></div>

    <div class="pchips">${crChips}</div>

    <div class="pchips">${inChips}</div>
    <div class="sec" style="margin-top:16px">ขั้นถัดไป (Next Action)</div>
    <div class="pchips">${naChips}</div>
    <div class="sec" style="margin-top:16px">วันติดตามครั้งถัดไป</div>

    ${lostSection}
    <div class="sec" style="margin-top:16px">ที่อยู่ลูกค้า</div>
    ${r.address ? `
    <div id="addrView" style="background:#f8fafc;border:1px solid #e5e9f0;border-radius:10px;padding:10px 12px;font-size:13.5px;color:#334155;white-space:pre-wrap;line-height:1.5">${esc(r.address)}</div>
    <button id="addrEditBtn" class="act b-b" style="width:100%;margin-top:8px" onclick="editAddr()">${ic('pencil',15)}แก้ไขที่อยู่</button>
    <div id="addrEdit" style="display:none">
      <textarea id="addr" rows="2" placeholder="บ้านเลขที่ / ถนน / ตำบล / อำเภอ / จังหวัด / รหัสไปรษณีย์…">${esc(r.address)}</textarea>
      <button class="act b-save" style="width:100%;margin-top:8px" onclick="saveAddr()">บันทึกที่อยู่</button>
    </div>` : `
    <textarea id="addr" rows="2" placeholder="บ้านเลขที่ / ถนน / ตำบล / อำเภอ / จังหวัด / รหัสไปรษณีย์…"></textarea>
    <button class="act b-save" style="width:100%;margin-top:8px" onclick="saveAddr()">บันทึกที่อยู่</button>`}

    <textarea id="note" rows="3" placeholder="บันทึกรายละเอียดการคุย…">${esc(r.note)}</textarea>
    <button class="act b-save" style="width:100%;margin-top:8px" onclick="saveNote()">บันทึกหมายเหตุ</button>

    <div style="margin-top:16px;border-top:1px solid #eef2f7;padding-top:14px">
      <button class="act" style="width:100%;background:#fff7ed;color:#9a3412;border:1px solid #fdba74" onclick="doAdvance()">${(r.stage||0)===0?(ic('repeat',16)+'ส่งต่อให้ '+(r.sales==='W'?'K':'W')+' เลย (ไม่รอครบ 3 รอบ)'):(ic('trash',16)+'คัดออกถาวรเลย')}</button>
    </div>
    <div class="rm"><div class="sec">นำออก (ย้ายไปถัง กู้คืนได้)</div>
      <div class="grid"><button onclick="doArchive('unreachable')">${ic('trash',15)}เบอร์ติดต่อไม่ได้</button><button onclick="doArchive('bad_data')">${ic('trash',15)}ข้อมูลไม่ครบ/เสีย</button></div></div>`;

// ===== Customer 360 (โปรไฟล์ลูกค้าเชิงลึกจาก Pancake) =====
function loadCust360(phone){
  const box=document.getElementById('cust360'); if(!box)return;
  box.innerHTML='<div style="border:1px solid #e5e9f0;border-radius:12px;padding:12px;color:#94a3b8;font-size:12.5px">'+ic('activity',14)+' กำลังโหลดประวัติลูกค้าจาก Pancake…</div>';
  fetch('/api/customer/profile?phone='+encodeURIComponent(phone)).then(r=>r.json()).then(j=>renderCust360(j,phone)).catch(()=>{box.innerHTML='';});
}
function d360(s){ if(!s)return '–'; const t=Date.parse(String(s).replace(' ','T')); if(isNaN(t))return '–'; const d=new Date(t); const p=n=>String(n).padStart(2,'0'); return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+(d.getFullYear()+543); }
function baht360(n){ return '฿'+(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:0}); }
function renderCust360(j,phone){
  const box=document.getElementById('cust360'); if(!box)return;
  if(!j||j.error||!j.ok){
    box.innerHTML='<div style="border:1px solid #e5e9f0;border-radius:12px;padding:12px;color:#94a3b8;font-size:12.5px">'+(j&&j.error==='no_api_key'?'ยังไม่ได้เชื่อม Pancake':'ไม่พบประวัติลูกค้ารายนี้ใน Pancake')+'</div>';
    return;
  }
  const v=j.vip||{label:'',color:'#64748b'};
  const stat=(label,val)=>`<div style="flex:1;min-width:78px"><div style="font-size:16px;font-weight:800;color:#0f172a">${val}</div><div style="font-size:11px;color:#64748b">${label}</div></div>`;
  const cyc=j.avgCycleDays?('ทุก ~'+j.avgCycleDays+' วัน'):'–';
  const oh=(j.orders||[]).map(o=>`<tr style="${o.canceled?'opacity:.5':''}">
    <td style="white-space:nowrap;font-size:12px">${d360(o.date)}</td>
    <td style="font-size:12px">${esc(o.items||'')||'<span class="dash">–</span>'}</td>
    <td style="text-align:right;font-weight:700;color:${o.canceled?'#94a3b8':'#166534'};white-space:nowrap">${o.canceled?'ยกเลิก':baht360(o.amount)}</td>
  </tr>`).join('');
  box.innerHTML=`<div style="border:1px solid #dbe3ef;border-radius:12px;overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:linear-gradient(90deg,#f0f7ff,#f8fafc)">
      <div style="font-weight:800;color:#0f172a;font-size:13.5px">${ic('star',15)} โปรไฟล์ลูกค้า (Pancake)</div>
      <span class="badge" style="background:${v.color}1a;color:${v.color};font-weight:800">${v.label}</span>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;padding:12px">
      ${stat('ยอดซื้อสะสม',baht360(j.ltv))}
      ${stat('ออเดอร์สำเร็จ',j.succeed+(j.returned?(' <span style=\"color:#b91c1c;font-size:11px\">(คืน '+j.returned+')</span>'):''))}
      ${stat('ลูกค้าตั้งแต่',d360(j.firstAt))}
      ${stat('ซื้อล่าสุด',d360(j.lastAt))}
      ${stat('ซื้อซ้ำเฉลี่ย',cyc)}
      ${j.rewardPoint?stat('แต้มสะสม',j.rewardPoint.toLocaleString('en-US')):''}
    </div>
    ${oh?`<div style="padding:0 12px 12px"><div style="font-size:12px;font-weight:700;color:#334155;margin-bottom:5px">ประวัติการซื้อ (${j.orderTotal} ออเดอร์)</div>
      <div class="tblwrap" style="max-height:220px"><table style="width:100%;font-size:12px"><thead><tr><th style="text-align:left">วันที่</th><th style="text-align:left">รายการ</th><th style="text-align:right">ยอด</th></tr></thead><tbody>${oh}</tbody></table></div></div>`:''}
  </div>`;
}
function orderBox(r){
  const stepLabel={T1:'T1 · จากแอดมิน (โทรครั้งแรก)',T2:'T2 · ออเดอร์ E-Commerce (Follow up / Up-sell)',T3:'T3 · ของใกล้หมด (ติดตามซื้อเพิ่ม)'}[r.step]||'';
  const rows=[];
  if(stepLabel)rows.push(['ประเภทการโทร',stepLabel]);
  if(r.product)rows.push(['สินค้าที่สั่ง',r.product]);
  if(r.orderAmount)rows.push(['ยอดสั่งซื้อ','฿'+fmtBaht(r.orderAmount)]);
  if(r.page)rows.push(['ช่องทาง / เพจ',r.page]);
  if(r.closer)rows.push(['ผู้ปิดการขาย (ออนไลน์)',r.closer]);
  if(!rows.length)return '';
  return `<div class="orderbox">${rows.map(([k,v])=>`<div class="orow"><span class="ok">${esc(k)}</span><span class="ov">${esc(v)}</span></div>`).join('')}</div>`;
}
function realCallBox(r){
  if(!r.realCalls)return '';
  return `<div style="margin-bottom:16px;padding:11px 13px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:13px;font-size:13.5px;color:#166534;line-height:1.5">
    ${ic('phone',15)} <b>โทรแล้ว ${r.realCalls} ครั้ง</b> <span style="color:#15803d">(บันทึกอัตโนมัติจาก OneCall)</span> · คุยเกิน 7 วิ <b>${r.realTalkCalls}</b> ครั้ง${r.realLastCallAt?(' · ล่าสุด '+esc(fmtShort(r.realLastCallAt))):''}</div>`;
}
function sheetCall(ev){ if(!CUR)return; api('/api/lead/call',{key:CUR.key}).then(async j=>{ if(j&&advToast(j.advanced)){closeSheet();await reload();return;} toast('บันทึกการโทรแล้ว'); await reload(); openLeadByKey(CUR.key); }); }
async function setCalls(n){
  if(!CUR)return;
  const j=await api('/api/lead/update',{key:CUR.key,patch:{callCount:n}});
  if(j&&j.ok){ toast(n===0?'ล้างจำนวนโทรแล้ว':('ปรับเป็นโทรครั้งที่ '+n)); await reload(); openLeadByKey(CUR.key); }
}
function buildWonSection(r){
  const items=r.saleItems||[];
  const rows=items.length?items.map((it,idx)=>`<div class="saleitem"><span class="sn">${esc(it.name)||'(ไม่ระบุชื่อ)'}</span><span class="sp">฿${fmtBaht(it.price)}</span><button class="sx" onclick="removeSaleItem(${idx})">${ic('x',14)}</button></div>`).join(''):'<div style="font-size:12.5px;color:#64748b;padding:2px 0 6px">ยังไม่มีรายการ — เพิ่มสินค้า/เซตโปรที่ปิดได้ด้านล่าง</div>';
  return `<div class="sec" style="margin-top:16px">สินค้า / เซตโปรโมชั่นที่ปิดการขาย</div>
    <div class="salebox">
      ${rows}
      <div class="saleadd">
        <input list="prodlist" id="sname" placeholder="เลือกหรือพิมพ์ชื่อสินค้า/เซตโปร" autocomplete="off">
        <input type="number" id="sprice" min="0" step="1" placeholder="ราคา" inputmode="decimal">
        <button class="act b-save" style="padding:10px 13px" onclick="addSaleItem()">${ic('plus',15)}เพิ่ม</button>
      </div>
      <div class="saletotal">ยอดขายรวม <b>฿${fmtBaht(saleTotal(r))}</b></div>
    </div>
    <datalist id="prodlist">${PRODUCTS.map(p=>`<option value="${esc(p)}"></option>`).join('')}</datalist>`;
}
async function addSaleItem(){
  if(!CUR)return;
  const name=(document.getElementById('sname').value||'').trim();
  const price=parseFloat(document.getElementById('sprice').value)||0;
  if(!name&&!price){toast('กรอกชื่อสินค้าหรือราคาก่อน');return;}
  const items=(CUR.saleItems||[]).slice(); items.push({name,price});
  const j=await api('/api/lead/update',{key:CUR.key,patch:{saleItems:items}});
  if(j&&j.ok){toast('เพิ่มรายการแล้ว');await reload();openLeadByKey(CUR.key);}
}
async function removeSaleItem(idx){
  if(!CUR)return;
  const items=(CUR.saleItems||[]).slice(); items.splice(idx,1);
  const j=await api('/api/lead/update',{key:CUR.key,patch:{saleItems:items}});
  if(j&&j.ok){toast('ลบรายการแล้ว');await reload();openLeadByKey(CUR.key);}
}
async function setStatus(v){
  if(!CUR)return;
  const j=await api('/api/lead/update',{key:CUR.key,patch:{leadStatus:v}});
  if(j&&j.ok){ toast('อัปเดตสถานะ: '+optLabel(LEAD_STATUS,v)); await reload(); openLeadByKey(CUR.key); }
}
async function setField(field,value){
  if(!CUR)return;
  const cur=CUR[field]||''; const nv=(cur===value)?'':value;
  const patch={}; patch[field]=nv;
  const j=await api('/api/lead/update',{key:CUR.key,patch});
  if(j&&j.ok){ toast(nv?'บันทึกแล้ว':'ล้างแล้ว'); await reload(); openLeadByKey(CUR.key); }
}
function closeSheet(){document.getElementById('mbg').classList.remove('on');CUR=null;}
async function saveFollowup(){
  if(!CUR)return; const v=document.getElementById('fdate').value;
  const iso=v?new Date(v).toISOString():'';
  const patch=iso?{nextAppt:iso,leadStatus:'followup'}:{nextAppt:''};
  const j=await api('/api/lead/update',{key:CUR.key,patch});
  if(j&&j.ok){ toast(iso?'บันทึกวันติดตามแล้ว':'ล้างวันนัดแล้ว'); await reload(); openLeadByKey(CUR.key); }
}
async function clearFollowup(){ if(!CUR)return; const j=await api('/api/lead/update',{key:CUR.key,patch:{nextAppt:''}}); if(j&&j.ok){toast('ล้างวันนัดแล้ว');await reload();openLeadByKey(CUR.key);} }
async function tapLine(v){
  if(!CUR)return; const nv=CUR.line===v?'':v; CUR.line=nv;
  const j=await api('/api/lead/update',{key:CUR.key,patch:{line:nv}});
  if(j&&j.ok){ toast(nv==='added'?'ทำเครื่องหมายแอดไลน์แล้ว':(nv==='not_added'?'ยังไม่แอดไลน์':'ล้างสถานะไลน์')); reload();
    document.querySelectorAll('.lineseg button').forEach(b=>{}); openLeadByKey(CUR.key); }
}
async function saveNote(){ if(!CUR)return; const t=document.getElementById('note').value; const j=await api('/api/lead/update',{key:CUR.key,patch:{note:t}}); if(j&&j.ok){toast('บันทึกหมายเหตุแล้ว');reload();} }
function editAddr(){ const e=document.getElementById('addrEdit'),v=document.getElementById('addrView'),b=document.getElementById('addrEditBtn'); if(e)e.style.display='block'; if(v)v.style.display='none'; if(b)b.style.display='none'; const t=document.getElementById('addr'); if(t)t.focus(); }
async function saveAddr(){ if(!CUR)return; const t=document.getElementById('addr').value; const j=await api('/api/lead/update',{key:CUR.key,patch:{address:t}}); if(j&&j.ok){toast('บันทึกที่อยู่แล้ว');CUR.address=t;await reload();if(CUR)openLeadByKey(CUR.key);} }
function editName(){
  if(!CUR)return; const h=document.getElementById('h3name'); if(!h)return;
  h.innerHTML=`<input id="cname" value="${esc(CUR.name)}" placeholder="ชื่อลูกค้า"><button class="act b-save" style="padding:8px 12px" onclick="saveName()">${ic('check',16)}</button><button class="act b-cancel" style="padding:8px 12px" onclick="openLeadByKey(CUR.key)">${ic('x',16)}</button>`;
  const inp=document.getElementById('cname'); inp.focus(); inp.select();
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')saveName(); if(e.key==='Escape')openLeadByKey(CUR.key); });
}
async function saveName(){
  if(!CUR)return; const v=(document.getElementById('cname').value||'').trim();
  const j=await api('/api/lead/update',{key:CUR.key,patch:{name:v}});
  if(j&&j.ok){ const nk=(j.lead&&j.lead.key)||CUR.key; toast('บันทึกชื่อลูกค้าแล้ว'); await reload(); openLeadByKey(nk); }
}
async function doArchive(reason){ if(!CUR)return; if(!confirm('ย้ายไปถัง "นำออกแล้ว"? (กู้คืนได้)'))return; const j=await api('/api/lead/archive',{key:CUR.key,reason}); if(j&&j.ok){toast('นำออกแล้ว');closeSheet();reload();} }
async function doRestore(){ if(!CUR)return; const j=await api('/api/lead/restore',{key:CUR.key}); if(j&&j.ok){toast('กู้คืนแล้ว');closeSheet();reload();} }
async function doAdvance(){
  if(!CUR)return;
  const isTransfer=(CUR.stage||0)===0; const other=CUR.sales==='W'?'K':'W';
  if(!confirm(isTransfer?('ส่งต่อลูกค้ารายนี้ให้ '+other+' เลยใช่ไหม? (เริ่มนับรอบใหม่)'):'คัดลูกค้ารายนี้ออกถาวรเลยใช่ไหม? (แอดมินกู้คืนได้)'))return;
  const j=await api('/api/lead/advance',{key:CUR.key});
  if(j&&j.ok){ if(!advToast(j.advanced)) toast('ดำเนินการแล้ว'); closeSheet(); reload(); }
}
async function reload(){
  const url='/api/leads'+(ME.role==='admin'&&ME.side?('?side='+ME.side):'');
  const r=await fetch(url); if(r.status===401){location.href='/login';return;} const j=await r.json();
  ACTIVE=j.active||[]; ARCHIVED=j.archived||[]; render(); renderOverview(); renderRefillSales();
}
// ===== Sidebar (sales) =====
let CURSEC='overview',REFILL_COUNT=0;
function salesSections(){return [
  {k:'overview',label:'ภาพรวมของฉัน',icon:'activity'},
  {k:'leads',label:'รายชื่อลูกค้า',icon:'inbox'},
  {k:'refill',label:'ลูกค้าเดิม · ซื้อซ้ำ',icon:'repeat',badge:REFILL_COUNT},
];}
function renderNav(){
  document.getElementById('navmenu').innerHTML=salesSections().map(s=>`<button class="${CURSEC===s.k?'on':''}" onclick="showSec('${s.k}')">${ic(s.icon,17)}<span>${s.label}</span>${s.badge?('<span class="rfn">'+s.badge+'</span>'):''}</button>`).join('');
}
function showSec(sec){CURSEC=sec;document.querySelectorAll('[data-sec]').forEach(el=>el.classList.toggle('shown',el.dataset.sec===sec));renderNav();window.scrollTo(0,0);}
function ovTile(n,l,color){return `<div style="flex:1;min-width:130px;background:#fff;border:1px solid var(--line,#e2e8f0);border-radius:14px;padding:14px 16px"><div style="font-size:26px;font-weight:800;color:${color||'#0f172a'};line-height:1.1">${n}</div><div style="font-size:12.5px;color:#64748b;margin-top:3px">${l}</div></div>`;}
function renderOverview(){
  const box=document.getElementById('ovBody'); if(!box)return;
  const A=ACTIVE.filter(r=>!r.archived);
  const total=A.length;
  const called=A.filter(r=>(r.realCalls>0)||(r.callCount>0)).length;
  const st=k=>A.filter(r=>(r.leadStatus||'new')===k).length;
  const won=st('won'),lost=st('lost'),interested=st('interested'),contacting=st('contacting'),followup=st('followup'),fresh=st('new');
  const overdue=A.filter(r=>isOverdue(r)).length;
  const wonT=A.filter(r=>wonToday(r)).length;
  const rev=A.filter(r=>(r.leadStatus||'new')==='won').reduce((s,r)=>s+saleTotal(r),0);
  const talk=A.reduce((s,r)=>s+(r.realTalkCalls||0),0);
  const ecom=A.filter(r=>srcGroup(r)==='ecom').length,mkt=A.filter(r=>srcGroup(r)==='mkt').length,refill=A.filter(r=>r.source==='refill').length;
  const conv=total?Math.round(won/total*100):0;
  const baht=n=>'฿'+(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:0});
  const chip=(l,n,c)=>`<span style="display:inline-flex;gap:6px;align-items:center;background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:5px 11px;font-size:12.5px;color:#334155">${l} <b style="color:${c||'#0f172a'}">${n}</b></span>`;
  box.innerHTML=`
    <div style="font-size:17px;font-weight:800;color:#0f172a;margin-bottom:2px">ภาพรวมของฉัน — Sales (${esc(ME.side||'?')})</div>
    <div style="font-size:12.5px;color:#64748b;margin-bottom:14px">สรุปงานและลูกค้าในมือของคุณ</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">
      ${ovTile(total,'ลูกค้าทั้งหมด','#2563eb')}
      ${ovTile(total-called,'ยังไม่ได้โทร','#b45309')}
      ${ovTile(wonT,'ปิดการขายวันนี้','#166534')}
      ${ovTile(overdue,'เกินกำหนด/ค้าง','#b91c1c')}
    </div>
    <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;color:#166534;font-weight:700">Conversion ${conv}% · ปิดได้ทั้งหมด ${won} ราย · ยอดขายรวม ${baht(rev)} · คุยจริง >7วิ ${talk} สาย</div>
    <div style="font-size:13px;font-weight:700;color:#334155;margin-bottom:8px">สถานะลูกค้า</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      ${chip('ใหม่',fresh)}${chip('กำลังติดต่อ',contacting)}${chip('สนใจ',interested,'#6d28d9')}${chip('นัดติดตาม',followup,'#0e7490')}${chip('ปิดได้',won,'#166534')}${chip('ไม่ปิด',lost,'#b91c1c')}
    </div>
    <div style="font-size:13px;font-weight:700;color:#334155;margin-bottom:8px">แหล่งที่มา</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${chip('E-commerce (Evolution)',ecom,'#1e40af')}${chip('Marketplace (Facebook)',mkt,'#9d174b')}${chip('· ในนั้นเป็นลูกค้าเดิม/refill',refill,'#db2777')}
    </div>`;
}
function daysSinceOrder(r){
  var t=r&&r.lastOrderAt?Date.parse(String(r.lastOrderAt).replace(' ','T')):NaN;
  if(isNaN(t))return null;
  return Math.max(0,Math.floor((Date.now()-t)/86400000));
}
function refillTier(days){
  var d=Number(days)||0;
  if(d<25)return{label:'ยังไม่ถึงกำหนด',color:'#64748b',rank:4};
  if(d<=40)return{label:'ควรโทรเชิงรุก',color:'#16a34a',rank:2};
  if(d<=60)return{label:'ช่วงทอง · ปิดง่าย',color:'#ca8a04',rank:0};
  if(d<=90)return{label:'เริ่มขาด',color:'#ea580c',rank:1};
  return{label:'หายนาน · ดึงกลับ',color:'#dc2626',rank:3};
}
function renderRefillSales(){
  const box=document.getElementById('rfBody2'); if(!box)return;
  const A=ACTIVE.filter(r=>!r.archived&&r.source==='refill'&&(r.leadStatus||'new')!=='won'&&(r.leadStatus||'new')!=='lost');
  // sort by urgency tier (ช่วงทอง first), then most-overdue within tier; null last
  A.sort((a,b)=>{ const da=daysSinceOrder(a),db=daysSinceOrder(b);
    if(da==null&&db==null)return 0; if(da==null)return 1; if(db==null)return -1;
    const ra=refillTier(da).rank,rb=refillTier(db).rank; if(ra!==rb)return ra-rb; return db-da; });
  REFILL_COUNT=A.length; renderNav();
  if(!A.length){box.innerHTML='<div class="empty">ยังไม่มีลูกค้าเดิมในคิวของคุณ — ระบบจะส่งลูกค้าที่ถึงกำหนดซื้อซ้ำมาให้อัตโนมัติ</div>';return;}
  const rows=A.map((r,i)=>{
    const sm=optMeta(LEAD_STATUS,r.leadStatus||'new')||LEAD_STATUS[0];
    const ds=daysSinceOrder(r);
    const t=ds==null?null:refillTier(ds);
    const dsc=ds==null?'<span class="dash">–</span>':('<b style="color:'+(t?t.color:'#334155')+'">'+ds+'</b> วัน');
    const tb=t?('<span class="badge" style="background:'+t.color+'1a;color:'+t.color+';font-weight:700">'+t.label+'</span>'):'<span class="dash">–</span>';
    const vb=(r.vip&&(r.vip.key==='gold'||r.vip.key==='silver'))?(' <span class="badge" style="background:'+r.vip.color+'1a;color:'+r.vip.color+';font-weight:800">'+ic('star',11)+r.vip.label+'</span>'):'';
    return `<tr class="lrow" onclick="openLeadByKey('${r.key}')">
      <td class="num">${i+1}</td>
      <td class="nmc">${esc(r.name)||'(ไม่มีชื่อ)'}${vb}</td>
      <td><a class="tel" href="tel:${esc(r.phone)}" onclick="event.stopPropagation()">${ic('phone',14)}${esc(r.phone)}</a></td>
      <td class="codec">${dsc}</td>
      <td class="stc">${tb}</td>
      <td class="notec">${esc(r.product||'')}</td>
      <td class="stc"><span class="badge ${sm.badge}">${ic(sm.icon,12)}${sm.label}</span></td>
      <td class="codec">${r.lastCallAt?esc(fmtShort(r.lastCallAt)):'<span class="dash">–</span>'}</td>
    </tr>`;
  }).join('');
  box.innerHTML='<div class="tblwrap"><table class="ltbl"><thead><tr><th class="num">#</th><th>ชื่อ-นามสกุล</th><th>เบอร์โทร</th><th>ซื้อล่าสุด</th><th>ระดับความเร่งด่วน</th><th>รายละเอียด (เคยซื้อ)</th><th>สถานะ</th><th>โทรล่าสุด</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
async function init(){
  const r=await fetch('/api/me'); if(r.status===401){location.href='/login';return;} ME=await r.json();
  let side=ME.side;
  if(ME.role==='admin'){ const u=new URLSearchParams(location.search).get('side'); side=(u==='K'?'K':'W'); ME.side=side;
    document.getElementById('switch').innerHTML='โหมดแอดมิน · ดูฝั่ง: <a onclick="location.search=\'?side=W\'">W</a> | <a onclick="location.search=\'?side=K\'">K</a> · <a href="/">กลับหน้าแอดมิน</a>'; }
  document.getElementById('head').classList.add((side||'w').toLowerCase());
  document.getElementById('title').textContent='งานของฉัน — Sales ('+(side||'?')+')';
  const bs=document.getElementById('brandsub'); if(bs)bs.textContent='Sales ('+(side||'?')+') · Telesales';
  renderNav(); showSec('overview');
  await reload();
}
init();
setInterval(()=>{ if(!document.getElementById('mbg').classList.contains('on')) reload(); }, 30000);
</script>
</body>
</html>
